<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一条线｜术式408</title><link rel="stylesheet" href="assets/style.css?v=6"><script src="assets/app.js?v=6"></script>
<style>
.ln{max-width:860px;margin:0 auto}
.ln p,.ln li,.ln td{font:500 15.5px/1.8 var(--goth);overflow-wrap:anywhere}
.ln-bar{position:sticky;top:48px;z-index:9;background:var(--paper,#f6f4ec);border-bottom:2px solid var(--ink);padding:6px 0;display:flex;gap:8px;align-items:center;font:600 12.5px/1.4 var(--goth)}
.ln-toc{flex:1;display:flex;gap:11px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.ln-toc::-webkit-scrollbar{display:none}
.ln-toc a{text-decoration:none;color:var(--ink);opacity:.62}
.ln-toc b a{opacity:1;font-weight:900}
.ln-toc a.on{opacity:1;font-weight:900;border-bottom:2.5px solid var(--ink)}
.ln-btn{font:700 12.5px/1 var(--goth);border:2px solid var(--ink);background:transparent;color:var(--ink);padding:5px 10px;cursor:pointer;flex:none}
body.test .ln-btn{background:var(--inv-bg);color:var(--inv-fg)}
.ln-part{margin:2.6em 0 .6em;background:var(--inv-bg);color:var(--inv-fg);padding:12px 16px;scroll-margin-top:100px}
.ln-part h2{font:900 clamp(22px,4vw,30px)/1.3 var(--disp);margin:0;color:inherit}
.ln-part p{margin:.35em 0 0;color:inherit;opacity:.9}
.ln-st{border-left:3px solid var(--ink);padding:0 0 .2em 15px;margin:1.6em 0 0;scroll-margin-top:100px}
.ln-st h3{font:900 21px/1.35 var(--disp);margin:0 0 .35em;display:flex;flex-wrap:wrap;align-items:baseline;gap:.45em}
.ln-st .no{display:inline-block;min-width:1.7em;text-align:center;background:var(--inv-bg);color:var(--inv-fg);font:800 14px/1.5 var(--goth);padding:1px 4px;margin-left:-33px}
.ln-st .fq{font:600 11.5px/1.6 var(--goth);border:1.5px solid var(--ink);padding:0 6px}
.ln-pic{border:1.5px solid var(--ink);padding:.55em .85em;margin:.45em 0}
.ln-pic::before{content:"画面　";font:900 12px/1 var(--goth)}
.ln-next{margin:.9em 0 0;font-style:italic}
.ln-next::before{content:"↓ 接下来　";font:900 12px/1 var(--goth);font-style:normal}
.ln-mem,.ln-cue,.ln-open,.ln-trap{margin:.75em 0}
.ln h4{font:900 12px/1.4 var(--goth);letter-spacing:.1em;margin:0 0 .25em}
.ln ul,.ln ol{margin:0;padding-left:1.3em}
.ln-mem li{border-bottom:1px dotted var(--hair);padding:.12em 0}
.ln-mem .lk{opacity:.75;margin-right:.5em}
.ln-mem .lk::after{content:" ＝"}
.ln-mem .lv{font-weight:700}
body.test .ln-mem .lv{filter:blur(7px);cursor:pointer;user-select:none;background:var(--hair)}
body.test .ln-mem .lv.show{filter:none;background:none}
.ln-cue .sig::after{content:" ⟶ ";font-weight:900}
.ln-open{border:2.5px solid var(--ink);padding:.55em .85em;box-shadow:4px 4px 0 var(--ink)}
.ln-open h4::before{content:"✍ "}
.ln-trap h4::before{content:"⚠ "}
.ln-trap li{opacity:.88}
.ln mark{background:var(--inv-bg);color:var(--inv-fg);padding:0 3px}
.ln code{font:600 .92em/1 ui-monospace,Menlo,monospace}
.ln .tw{overflow-x:auto;margin:.7em 0}
.ln table{border-collapse:collapse;min-width:100%}
.ln th,.ln td{border:1.5px solid var(--ink);padding:5px 8px;vertical-align:top;text-align:left;font-size:14px}
.ln th{background:var(--inv-bg);color:var(--inv-fg);white-space:nowrap;font:700 12.5px/1.5 var(--goth)}
.ln td:first-child{font-weight:800}
.ln-how{border:2.5px solid var(--ink);padding:.6em .95em;margin:.9em 0}
@media(max-width:600px){.ln-st{padding-left:11px}.ln-st .no{margin-left:-29px}.ln th,.ln td{font-size:13px;padding:4px 6px}}
</style></head><body data-ep=""><div class="bar"><a class="logo" href="index.html" aria-label="术式408"><img src="assets/ink/hero.webp" alt=""><b>408</b></a><span class="now"></span><span class="sp"></span><a href="真题套卷.html">真题套卷</a><a href="算法题速成.html">算法速成</a><a href="术式录.html">术式录</a><button id="neg" title="切换黑白反转">反转</button></div>
<main class="wrap"><div class="ln">
<h1 style="font:900 30px/1.3 var(--goth);margin:26px 0 6px">一条线</h1>
<p>把历年 408 真题考过的东西倒推回来，四门课排成一条从上往下读的线。一页，只用上下滑。每做一张卷之前滑一遍。</p>
<div class="ln-bar"><div class="ln-toc" id="toc">{{toc}}</div><button class="ln-btn" id="tb" onclick="LNTest()">自测</button></div>
{{body}}
<script>
function LNTest(){var on=document.body.classList.toggle('test');document.getElementById('tb').textContent=on?'退出自测':'自测';
  document.querySelectorAll('.ln-mem .lv.show').forEach(function(e){e.classList.remove('show')});try{localStorage.setItem('sx_line_test',on?'1':'')}catch(e){}}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('.ln-mem .lv');if(a&&document.body.classList.contains('test'))a.classList.toggle('show')});
try{if(localStorage.getItem('sx_line_test'))LNTest()}catch(e){}
(function(){var links=[].slice.call(document.querySelectorAll('#toc a')),secs=[].slice.call(document.querySelectorAll('.ln-st,.ln-part')),cur=null,tk=0;
  function upd(){tk=0;var y=130,hit=secs[0];for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<=y)hit=secs[i];else break}
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)hit=secs[secs.length-1];
    var l=links.filter(function(a){return a.getAttribute('href')==='#'+hit.id})[0];if(!l||l===cur)return;if(cur)cur.classList.remove('on');cur=l;l.classList.add('on');
    var t=document.getElementById('toc');t.scrollLeft=l.offsetLeft-t.clientWidth/2+l.offsetWidth/2}
  window.addEventListener('scroll',function(){if(!tk)tk=requestAnimationFrame(upd)},{passive:true});upd()})();
</script>
</div></main></body></html>
