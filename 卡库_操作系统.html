<script>
const CH = {ov:"概述与中断",proc:"进程与调度",sync:"同步与死锁",mem:"内存管理",fs:"文件系统",io:"I/O 管理"};
const K = [
{ch:"ov",name:"内核态 vs 用户态",def:"CPU 两种特权级别；特权指令（I/O 指令、置时钟、开关中断、修改页表寄存器等）只能在内核态执行。",
 mix:"访管指令（trap）本身在用户态执行——它是普通指令，作用是切入内核态。读时钟是非特权、置时钟是特权。用户态→内核态的唯一途径是中断/异常；内核态→用户态靠修改 PSW（特权操作）。",
 mem:"能「管别人、管硬件」的都是特权指令；用户态→内核态只能靠中断/异常（硬件自动切），内核态→用户态靠 IRET（内核态执行）。",
 exam:"「下列哪些指令只能在内核态执行」选择题年年见。"},
{ch:"ov",name:"并发 vs 并行（两个层次）",def:"并发＝多个事件在同一时间间隔内发生；并行＝在同一时刻真正同时发生。",
 mix:"「谁和谁并行」决定答案：①进程与进程并行 → 必须多处理器（单 CPU 只能并发）；②CPU 与 I/O 设备之间、多个 I/O 设备之间 → 单机就是真并行（中断方式的特点）。2018 真题：多任务 OS「具有并发和并行的特点」对，但「必须运行在多 CPU 上」错。多台虚拟机跑在同一物理机 = 并发，不是并行。",
 mem:"时刻＝并行，间隔＝并发；进程级并行要多核，CPU 与外设的并行单机就有。",
 exam:"ch1 出现 5 次，全章复现率第一（1.1-05、1.2-14、2018、1.6-16、1.7 疑难点）。"},
{ch:"ov",name:"OS 四特征的层级",def:"并发、共享、虚拟、异步；其中并发与共享是两个最基本的特征，二者互为前提。",
 mix:"四条不是平级：并发+共享＝必需（一定要实现）；虚拟+异步＝手段与后果。2022 真题选项「多道程序系统不必支持虚拟存储管理」是对的——早期多道批处理把数据全调入主存，没有虚存照样并发。互为前提的两条理由：①共享以并发为前提（单道无所谓共享）②有效共享是并发正确执行的基础。",
 mem:"并发共享是门槛，虚拟异步是风景。",
 exam:"2022 统考真题直接考四特征的层级关系。"},
{ch:"ov",name:"共享的两种形式 · 临界资源",def:"互斥共享：一段时间内只允许一个进程访问，该类资源称临界资源；同时访问：允许多个进程宏观上同时访问（微观上可分时交替）。",
 mix:"临界资源举例：打印机、磁带机等独占设备，以及软件中的栈、变量、表格。可同时访问：磁盘上的只读文件、用重入代码编写的程序。注意「临界资源」是资源，访问它的那段代码叫「临界区」（ch2）。同时访问的「同时」通常指逻辑上的并发访问。",
 mem:"互斥＝排队用，同时访问＝可以一起看。",
 exam:"概念判断题；ch2 的 PV 操作全部建立在临界资源之上。"},
{ch:"ov",name:"虚拟：时分复用 vs 空分复用",def:"把一个物理实体映射为多个逻辑上的对应物。两类：时分复用（处理器的分时共享）、空分复用（虚拟存储器）。",
 mix:"虚拟设备技术（SPOOLing）把独占的打印机变成多台逻辑设备——它把临界资源转化成了共享资源。虚存的逻辑容量可超过物理内存。同一思想在组原（虚存、总线分时复用）与网络（时分多路复用）里反复出现。",
 mem:"时间上错开＝时分，空间上分块＝空分。",
 exam:"概念判断；与 ch3 虚存、ch5 SPOOLing 连考。"},
{ch:"ov",name:"两类接口：命令接口 vs 程序接口",def:"用户接口（命令方式、图形方式）面向普通终端用户；程序接口（系统调用）专为应用程序设计。",
 mix:"用户接口三类：联机（命令行，输入一条立即执行并返回）、脱机（作业控制语言，用于批处理，作业说明书随作业一并提交）、GUI（底层仍走系统调用）。题干出现「在程序中」→ 一定是系统调用；出现「作业说明书」→ 脱机接口。命令解释程序（Shell）属命令接口，在用户态执行（2011 真题）。",
 mem:"人敲的叫命令接口，程序调的叫系统调用。",
 exam:"1.1-06/07、1.3-15、2011 真题。"},
{ch:"ov",name:"库函数 vs 系统调用",def:"库函数是语言提供的、运行在用户态的可复用代码；系统调用是 OS 提供的、运行在内核态的服务接口。库函数只是对系统调用的封装。",
 mix:"并非所有库函数都触发系统调用：printf→write（会），malloc→brk/mmap（可能会），strlen/sqrt/sin/random/abs（不会，纯用户态）。可移植性：库函数好、系统调用与 OS 紧耦合。可替换/可调试：库函数容易、系统调用麻烦（1.3-13 的错项正是把这条说反）。开销：库函数小、系统调用大（要上下文切换）。",
 mem:"库函数是语言给的，系统调用是 OS 给的。",
 exam:"ch1 考了四次：2010、2013（sin）、2021（random）+ 书内题。"},
{ch:"ov",name:"特权指令三族",def:"只能在内核态执行的指令。三族：①直接管理系统资源（置时钟、启停设备、I/O 指令、切换进程、设置中断）②修改系统状态（改中断向量表、改模式位、修改 PSW、开关中断、设中断屏蔽字）③系统控制（停机、重启）。",
 mix:"两个特例必须单记：陷入（访管/Trap）指令是非特权指令、在用户态执行——否则用户永远进不去内核；中断屏蔽字设置指令属特权——屏蔽字寄存器∈中断控制器∈I-O 接口⟹属 I-O 指令。普通数据传送、转移跳转、压栈、寄存器清零都在用户态。「管理员权限」不等于「内核态」：root 的程序照样在用户态。",
 mem:"影响整个系统的都是特权指令；只动自己数据的都不是。",
 exam:"ch1 考了 5 次（2014、2021 + 三道书内题）。"},
{ch:"ov",name:"发生在用户态 vs 执行在内核态",def:"同一个事件，「在哪一态发生」与「在哪一态处理」是两个问题。",
 mix:"系统调用、外中断、缺页：都发生在用户态、处理在内核态。只有进程切换连「发生」都在内核态（2012 真题正解）——切换要存取 PCB、改页表基址寄存器、换内核栈，全是特权操作。2024 真题再细分：「中断或异常发生时 CPU 处于内核态」错（可能在用户态，多重中断时也可能已在内核态）；「中断处理程序开始执行时处于内核态」对。",
 mem:"敲门在门外，干活在门里；只有进程切换是关起门来干的。",
 exam:"2012、2024 两道真题；做题第一步是圈出时间副词。"},
{ch:"ov",name:"中断现场：硬件做的 vs OS 做的",def:"中断响应由硬件（中断隐指令）完成：关中断、保存断点 PC 与 PSW、改模式位、查中断向量表取入口；中断处理由 OS 完成：保存中断屏蔽字、保存通用寄存器、执行服务例程。",
 mix:"中断向量表由 OS 在开机初始化时建立（2020、2022 两次考过）。TLB 与 Cache 无须保存，直接置有效位为 0——它们是可再生的副本。系统调用同理：保存断点/程序状态字、改模式位由硬件；保存通用寄存器、执行服务例程由 OS（2022 真题）。",
 mem:"断点、状态字、模式位归硬件；通用寄存器、屏蔽字、服务例程、向量表初始化归 OS。",
 exam:"2015、2020、2022 三年同一把刀，答案彼此印证。"},
{ch:"ov",name:"中断与异常的分类树",def:"中断分异常（内中断）与外中断（硬件）。异常＝故障 Fault + 自陷 Trap + 终止 Abort；外中断＝可屏蔽 INTR + 不可屏蔽 NMI。",
 mix:"软件中断＝故障+自陷；硬件中断＝终止+外中断。故障：缺页、除 0、非法操作码、溢出；自陷：访管/系统调用指令、条件陷阱；终止：控制器出错、存储器校验错。能屏蔽的只有可屏蔽中断，NMI 与所有异常都屏蔽不掉。缺页中断名字带中断，分类却是异常（2016 真题的错项）。",
 mem:"内因叫异常、外因叫中断；异常一律不可屏蔽。",
 exam:"2016 真题；1.3-12 书内题又考一遍。"},
{ch:"ov",name:"中断与异常的返回位置",def:"异常处理完返回第 i 条指令重新执行；中断处理完返回第 i+1 条指令继续执行。",
 mix:"组原口诀：故障退回重做、自陷与中断都往下走、终止直接不走了。这条规则是虚存能成立的前提——缺页处理完必须重执行那条访存指令，否则程序拿到垃圾数据。若判定为不可恢复的致命错误，则终止用户程序。中断在「指令执行结束后」才被检测，异常在指令执行中就触发。",
 mem:"异常回原地重做，中断往下继续。",
 exam:"与缺页处理、ch3 请求分页连考。"},
{ch:"ov",name:"中断处理 vs 子程序调用",def:"六条区别：独立性、随机性、是否需硬件支持、入口地址来源、PC 由谁保存、是否需优先级裁决。",
 mix:"入口地址：中断查中断向量表，子程序由 CALL 指令的地址码给出。PC：中断由硬件在响应时自动保存，子程序由 CALL 指令压栈。2012 真题：中断一定保存而子程序不需保存的是 PSW（程序状态字）——中断可能插在标志位刚生成还没用的缝里，且中断要切换特权级；子程序调用不跨态。系统调用要存 PC+PSW，一般过程调用只存 PC。",
 mem:"中断是随机来的客人，子程序是事先约好的。",
 exam:"2012 统考真题（PSW）；1.3-14 书内题。"},
{ch:"ov",name:"系统调用的四步与五大类",def:"四步：①传递系统调用参数 ②执行陷入指令切内核态 ③按系统调用号查系统调用表并执行服务程序 ④恢复现场返回用户态。",
 mix:"顺序不能乱：参数必须在陷入之前传，否则内核不知道要干什么（2017 真题的三个错项全把传参排在陷入之后）。五大类：设备管理、文件管理、进程控制、进程通信、内存管理。判断「哪个操作通过系统调用完成」的判据：必须由用户进程主动请求——页置换、进程调度是 OS 自发的，random() 是纯用户态（2021 真题）。不同 OS 的系统调用接口不统一（2019 的错项）。",
 mem:"先备货、再敲门、人家干活、最后送客；点菜的是你（用户态），做菜的是后厨（内核态）。",
 exam:"2017（顺序）、2021（哪个是）、2019（性质）、2022（谁完成）。"},
{ch:"ov",name:"时钟中断的内容",def:"时钟的功能＝计时 + 产生定时中断。时钟中断服务程序更新一切与时间有关的量。",
 mix:"更新内容：内核时钟变量、当前进程占用 CPU 的时间、当前进程时间片的剩余量、各种定时器；并决定是否执行调度程序。2018 真题三条说法全对。没有时钟中断就没有抢占式调度——分时靠它轮转、实时靠它算截止期、批处理靠它衡量进度。",
 mem:"时钟中断是 OS 的心跳：记账 + 决定要不要换人。",
 exam:"2018 统考真题。"},
{ch:"ov",name:"原语与关中断",def:"原语是由若干条指令组成、执行过程不可被中断的原子操作，常通过关中断实现原子性。",
 mix:"关中断是特权指令（2014 真题正解）——能把中断关掉说明权限极大。关中断后时钟中断进不来，调度器再无机会运行，用户程序若能关中断就能独占 CPU（系统假死）。常见原语：进程切换、进程同步、资源分配；ch2 的创建/撤销/阻塞/唤醒四原语与 PV 操作也是原语。",
 mem:"要么不做，要么一口气做完；关中断这件事在内核手里是工具，在用户手里是灾难。",
 exam:"2014 真题；ch2 进程控制全部由原语实现。"},
{ch:"ov",name:"三代系统追求什么",def:"批处理要「多」（吞吐量、资源利用率）；分时要「快」（响应时间）；实时要「准」（截止期限、确定性）。",
 mix:"批处理的主要缺点是缺乏交互能力（书上点名的常考点，不是吞吐量小、不是需要大量内存）。实时系统的主要目标是实时性与可靠性，资源利用率不是——为保证高优先级任务，允许「浪费」资源。实时时限由被控制对象规定，不是机器周期/周转时间/时间片。硬实时（机床控制、导弹制导）超时有永久性损害；软实时（订票、股票、银行）只损失经济利益。",
 mem:"批处理要多、分时要快、实时要准。",
 exam:"1.2 节题 02/05/06/07/10/15 全考这一条。"},
{ch:"ov",name:"单道批处理 vs 多道程序设计",def:"单道批处理三特征：自动性、顺序性、单道性；多道程序设计三特点：多道、宏观上并行、微观上串行。",
 mix:"多道依赖中断技术才能让 I-O 与 CPU 并行（2016 真题的正确说法）。多道的优点：CPU 利用率高、吞吐量大、I-O 设备利用率高；但系统开销变大（2017 真题的错项说「开销小」）。多道程序引入后程序失去封闭性和顺序性，新增制约性、间断性、共享性。进程数越多 CPU 利用率越高是错的（2022 真题）——竞争加剧甚至死锁，ch3 称之为抖动。",
 mem:"多道＝拿开销换利用率，收益有上限。",
 exam:"2016、2017、2022 三年真题全落在这里。"},
{ch:"ov",name:"响应时间 T ≈ Q × N",def:"分时系统中，响应时间约等于时间片 Q 乘以用户（就绪进程）数 N。",
 mix:"反解求时间片上界：Q ≤ T/N。例：100 个就绪进程、响应不超过 2s ⟹ Q ≤ 20ms。方向别记反：加大时间片会延长响应时间（1.2-09 的错项）。改善响应时间应采用「优先级+非抢占式调度」——纯抢占会让低优先级进程饥饿，最坏响应时间被拖成无穷。单位：题干给秒、选项给毫秒，算完要乘 1000。",
 mem:"轮一圈才轮到你：一圈 N 个人、每人 Q 秒。",
 exam:"1.2-11、1.2-12、1.2-09。"},
{ch:"ov",name:"甘特图与 CPU 利用率",def:"多道环境下多个程序共用 CPU 与外设，画甘特图求利用率；规矩：同一设备同一时刻只能被一个程序占用，后到的排队。",
 mix:"CPU 利用率＝CPU 忙的总时长 ÷ 全部结束的时刻（分母不是某个程序的长度，也不是 CPU 段之和）。「CPU 空闲」与「进程等待」是两件事：可能 CPU 满载而某进程在等，也可能无人等 CPU 而 CPU 闲着。典型结论：单道 50%、多道 88.9%（同一批工作）；另一题 CPU 空闲仅 50ms、利用率 83.3%，某进程有两段等待。",
 mem:"先画图再算，分母永远是总时长。",
 exam:"1.2 节两道综合应用题；ch2 调度算法会继续用甘特图。"},
{ch:"ov",name:"五种 OS 结构的标签",def:"分层、模块化、宏内核、微内核、外核。本节唯一的出题手法是张冠李戴。",
 mix:"分层＝单向依赖、便于调试验证（有可靠开发顺序）、但穿层效率低且依赖僵化；模块化＝高内聚低耦合、支持并行开发、模块间直接调用效率高、但没有可靠的决定顺序；宏内核＝性能高但一崩全崩；微内核＝可靠安全可扩展可移植、性能差；外核＝把裸资源直接分给用户级系统，只管分配回收保护，进程调度仍归内核。Windows 是宏内核与微内核的融合，不是分层式。",
 mem:"读到某句话先问：它本来是谁的标签。",
 exam:"1.4 节 10 道题几乎全是标签错位。"},
{ch:"ov",name:"微内核：四方面与机制策略分离",def:"定义微内核的四个方面：足够小的内核、基于客户/服务器模式、机制与策略分离、采用面向对象技术。",
 mix:"机制留内核（进程创建切换与调度队列、地址转换机制、中断与陷入的捕获分发），策略移到用户态服务器（优先级分配、页面置换算法、内存分配策略）。不宜放在微内核中的是文件系统服务（1.4-06 唯一的答案）。微内核的四个优点：扩展性灵活性、可靠性安全性、可移植性、分布式计算；唯一硬伤是性能。「微内核结构没有单一内核稳定」是错的——内核服务越少越稳定。现状：Linux/Windows/Android 宏或混合；macOS/iOS 的 XNU 融合；Fuchsia、HarmonyOS NEXT 微内核。",
 mem:"微内核＝只留骨架、其他外包；优点全是「性」字辈里除性能之外的那些。",
 exam:"2023 统考真题（仅 Ⅱ Ⅲ Ⅳ，不含性能）。"},
{ch:"ov",name:"OS 引导七步",def:"CPU 从 ROM 读 BIOS → POST 自检并按 CMOS 选启动设备 → 读入 MBR → MBR 解析分区表找活动分区并读入 PBR → PBR 加载启动管理器 → 加载内核映象 → 内核初始化并启动首个用户态进程。",
 mix:"每一棒只认识下一棒：凡「BIOS 直接加载内核」「启动管理器由 BIOS 直接读取」这类跳环节说法一律错。自举程序在主板 ROM，OS 引导程序（启动管理器）在硬盘活动分区的引导扇区——两个都叫引导程序但位置不同。CMOS 存参数不存程序。MBR＝引导代码+硬盘分区表，位于硬盘首扇区。引导只把内核装入内存（常驻内存的只有内核），OS 最终被加载到 RAM（2013 真题）。内核初始化还要建 PCB 链表、就绪与阻塞队列、设备控制块。",
 mem:"ROM 里的自举程序只负责把硬盘第一扇区读进来。",
 exam:"1.5 节五题 + 2013、2022 真题。"},
{ch:"ov",name:"两类虚拟机管理程序（VMM）",def:"第一类（裸金属）直接运行在硬件上、处于最高特权级、效率高；第二类（寄居）以应用程序形式运行在宿主 OS 上，本质是用户态进程。",
 mix:"辨认法：装它之前要不要先装别的 OS——要＝第二类（VMware Workstation、VirtualBox），不要＝第一类（Xen、ESXi）。客户 OS 运行在「虚拟内核态」，它以为自己在真实内核态，一执行敏感指令就陷入 VMM。2025 真题：VMM 与 OS 特权级相同是错的，VMM 必须高于客户 OS。VMM 代码量小于完整 OS（只模拟硬件接口）。虚拟磁盘实际上是宿主机上的一个普通文件。多台虚拟机是并发不是并行。",
 mem:"看 VMM 下面压着谁：硬件＝一类，宿主 OS＝二类。",
 exam:"2025 统考真题；1.6 节 7 题。"},
{ch:"ov",name:"网络 OS vs 分布式 OS",def:"网络 OS 仅实现资源共享与通信，各机独立运行、用户需显式指定远程资源位置；分布式 OS 节点对等、资源透明共享、提供单一系统映像。",
 mix:"分布式的核心特点：分布性、并行性、透明性，其中透明性尤为关键。判据一句话：用户需不需要知道东西在哪台机器上。注意 408 里「透明」＝用户感觉不到它的存在（虚存对用户透明、Cache 对程序员透明），不是「看得清」。",
 mem:"要自己指路的是网络 OS，感觉像一台机器的是分布式。",
 exam:"概念辨析选择题。"},
{ch:"ov",name:"中断向量表用什么数据结构",def:"数组。CPU 由中断类型号直接算出入口地址在表中的位置：地址＝基址+类型号×表项长度，O(1) 随机存取。",
 mix:"链表要顺着走 O(n)、还要多存指针；队列只能从队头取，不支持按号查找。向量表在开机初始化后基本不变、大小固定（类型号个数由硬件定死），链表擅长的频繁插删完全用不上。同一套「用定长号查定长表」的结构还有：系统调用号→系统调用表、页号→页表、逻辑块号→索引结点。",
 mem:"要 O(1) 按号取，就只能是数组。",
 exam:"2023 统考真题（三科合一：OS × 组原 × 数据结构）。"},
{ch:"proc",name:"进程与 PCB",def:"进程 = 程序的一次执行过程，是资源分配（拥有资源）的基本单位；PCB 是进程存在的唯一标志。",
 mix:"PCB 四类信息：进程描述信息（PID、用户 ID、父子关系）、进程控制与管理信息（状态、优先级）、资源分配清单（内存、打开文件、I/O 设备）、处理机相关信息（各寄存器与 PC 的现场）。PCB 常驻内存、位于内核区，用户态碰不到。由「PCB 是唯一标志」可推出两件事：创建进程的第一步是申请空白 PCB，终止进程的最后一步是释放 PCB；系统能容纳的最大进程数首先受 PCB 表（内存）限制，不是受 CPU 个数限制。",
 mem:"PCB 是进程的身份证 + 病历本；OS 眼里只有 PCB，没有 PCB 就没有这个进程。",
 exam:"2.1-24「下列不属于 PCB 的是」、2.1-25「最大进程数受什么限制」；2021、2024 两道创建/终止真题都由这条推出。"},
{ch:"proc",name:"进程映像的五个区域",def:"一个进程在内存里的样子：只读代码段、可读写数据段、运行时堆（向高地址长）、用户栈（向低地址长），外加内核区里的 PCB、内核栈与页表。",
 mix:"判某个 C 变量在哪一段，按四问走：是指令 → 代码段；函数外或带 static → 数据段；malloc 出来的 → 堆；函数内的局部变量、参数、返回地址 → 栈。PCB 不在这四段里，它在内核区。线程视角再叠一层：代码段、数据段、堆、已打开文件全部共享，只有栈（含栈指针）与寄存器是每线程一份。堆与栈相向生长，中间留空洞，这样两者谁多用一点都不浪费。",
 mem:"低地址往上是代码、数据、堆；高地址往下是栈；PCB 在墙外的内核区。",
 exam:"2.1-22 逐个变量判段；2025 综合真题直接拿这张图问「哪些区域可被同进程的线程共享」。"},
{ch:"proc",name:"进程的四个特征",def:"动态性（最基本）、并发性、独立性、异步性。",
 mix:"动态性是进程与程序的根本区别——进程有生有死、程序是静态的指令集合，其余区别都是这条的推论。异步性说的是各进程以不可预知的速度推进，所以「并发进程的相对速度由进程自己决定」是错的。独立性指进程是独立获得资源、独立调度的基本单位。注意进程与程序是多对多：一个程序跑在不同数据集上形成多个进程，一个进程执行期间也可调用多个程序（共享库）。",
 mem:"动态是命根，异步是脾气：跑多快不由你说了算。",
 exam:"2.1-03「根本区别」、2.1-05/06/07/09/23 一族判断题。"},
{ch:"proc",name:"并发失去封闭性与可再现性",def:"程序单道运行时独占全部资源，结果只由初始条件决定（封闭性），重跑必然同样结果（可再现性）；并发执行时共享变量会被别人改，两条都丢了。",
 mix:"这句话是整个 2.3 章存在的理由：正因为失去了封闭性，才需要 PV 把该独占的那一段圈起来。判断题里「并发进程失去封闭性是指多个进程共享 CPU 导致运行结果不确定」这类说法要抠准——失去封闭性的原因是共享了变量/资源，不是共享了 CPU 本身。多道程序引入后程序还新增了间断性、制约性、共享性。",
 mem:"你的结果被别人改过，就不再是你一个人的程序了。",
 exam:"2.1-18；2.3 的 x++ 交错题（2011、2018）就是它的定量版。"},
{ch:"proc",name:"进程控制四原语",def:"创建、撤销、阻塞（wait）、唤醒（wakeup）四个原语，均由若干指令组成且执行中不可被中断，通常用关中断实现原子性。",
 mix:"为什么必须是原语：进程控制要改 PCB、改队列指针，改到一半被切走会留下不一致的内核数据结构。阻塞原语由进程自己调用（自我阻塞），唤醒原语必须由别的进程/中断处理程序调用——一个进程绝不可能自我唤醒。阻塞与唤醒必须成对出现，否则被阻塞的进程永远醒不过来。四原语都执行在内核态。",
 mem:"睡是自己躺下的，醒必须别人喊。",
 exam:"2.1-28 原语性质、2.1-27「进程自身能决定什么」；ch1 的关中断特权指令与它同源。"},
{ch:"proc",name:"创建进程：必做 vs 不必做",def:"创建原语：申请空白 PCB → 为新进程分配所需资源（除 CPU）→ 初始化 PCB → 插入就绪队列。",
 mix:"2021 真题正是这四步的判断题：申请空白 PCB ✓、初始化 PCB ✓、「设置进程状态为运行态」✗——新进程一律先进就绪态，上不上 CPU 是调度器的事，创建原语管不着。会导致创建新进程的事件：用户登录成功、启动程序执行、作业调度（高级调度）、OS 响应用户请求；「设备分配」不会——它只是给已有进程加资源，没有新程序要跑。",
 mem:"造好人送进就绪队列就完事，谁上 CPU 不归它管。",
 exam:"2021 统考真题（仅 Ⅰ、Ⅱ）、2010 统考真题（导致创建新进程的操作）、2.1-08/47。"},
{ch:"proc",name:"终止进程与级联终止",def:"撤销原语：找到 PCB → 若在运行则剥夺 CPU → 终止其子进程（若该系统采用级联终止）→ 归还全部资源 → 删除 PCB。",
 mix:"2024 真题问「终止进程时不一定执行的是」，正解就是「终止子进程」——级联终止只是某些系统的设计策略，不是普遍规则；而回收内存、回收设备、释放 PCB 是任何系统都要做的。引起终止的三类事件：正常结束、异常结束（越界、非法指令、除零、运行超时）、外界干预（操作员干预、父进程请求、父进程终止）。",
 mem:"资源一定收，孩子不一定杀。",
 exam:"2024 统考真题；与 2020 真题的父子进程关系连着考。"},
{ch:"proc",name:"父进程与子进程",def:"子进程由父进程创建，可继承父进程的部分资源；父进程终止时子进程未必终止（取决于是否级联）。",
 mix:"最容易记反的一条：父子进程不共享虚拟地址空间——子进程拿到的是父进程地址空间的一份副本（写时复制），改了互不影响；能共享的是已打开的文件这类资源。子进程撤销时要把从父进程那里获得的资源归还给父进程，不是归还给系统。进程树是一棵树：一个进程只有一个父进程，可以有多个子进程。",
 mem:"给的是复印件不是原件；还的时候还给爸爸不是还给系统。",
 exam:"2020 统考真题（2.1-67）、2.1-21。"},
{ch:"proc",name:"五状态模型的四条箭头",def:"就绪→运行（被调度）、运行→就绪（只缺 CPU）、运行→阻塞（缺 CPU 以外的东西）、阻塞→就绪（等的东西来了）。加上创建态与终止态即五状态。",
 mix:"两条箭头永远不存在：就绪→阻塞（不在 CPU 上跑，没机会提申请）、阻塞→运行（资源到手也只能先回就绪队列排队）。三条箭头是被动的、只有一条是自己按的：进程唯一能自己决定的是「运行→阻塞」。单处理器上 n 个进程，就绪队列最多 n−1 个（必有一个在运行），但阻塞队列可以是 n 个（CPU 空转）。",
 mem:"缺 CPU 进就绪，缺别的进阻塞；睡醒了也要回队尾排队。",
 exam:"2.1-40 的经典错项 D 就是「阻塞→运行」；2.3-31a/31b 考队列长度上限。"},
{ch:"proc",name:"就绪态 vs 阻塞态（判据）",def:"两者都不在 CPU 上跑，区别只在于「一旦拿到 CPU 能不能马上跑」：就绪态能，阻塞态不能（还差别的东西）。",
 mix:"判据一句话：缺的是不是 CPU。时间片用完、被高优先级抢占、主动出让 CPU → 就绪；读文件、读磁盘、申请外设、缺页、wait() 且信号量不足、申请临界资源失败 → 阻塞。三个高频陷阱：缺页是阻塞不是就绪（要等磁盘）；wait() 不一定阻塞（S 减完仍 ≥ 0 就继续跑）；「时间片用完」永远是就绪，既不是阻塞也不构成唤醒。",
 mem:"就绪是只差车、阻塞是还差货。",
 exam:"2015、2018、2022、2023 四年真题全考这条线；2019 真题从「唤醒」的反面考。"},
{ch:"proc",name:"唤醒与自我阻塞",def:"阻塞由进程自己调用阻塞原语完成；唤醒必须由另一个进程或中断处理程序调用唤醒原语完成。",
 mix:"因此「某事件可能将进程唤醒」的判据是：阻塞队列里等的那样东西到了没有。I/O 结束 ✓（等 I/O 的醒）、别的进程退出临界区 ✓（等锁的醒）、当前进程时间片用完 ✗（动的是运行态的进程，跟阻塞队列毫无关系）。反过来「必会引起进程切换」的唯一答案是运行→就绪：创建后进就绪、阻塞后转就绪都只是往就绪队列塞人，当前进程照跑不误。",
 mem:"唤醒的主语永远是别人；只有运行态那位下来了，CPU 才必须换人。",
 exam:"2019 统考真题（仅 Ⅰ、Ⅱ）；2.1-44、2.1-46。"},
{ch:"proc",name:"挂起态与七状态模型",def:"挂起 = 把进程从内存换到外存。五状态加上就绪挂起、阻塞挂起两态即七状态模型，由中级调度负责换入换出。",
 mix:"挂起不等于阻塞：阻塞是在等事件、人还在内存；挂起是被搬到了外存，既可能处于就绪也可能处于阻塞。所以有「阻塞挂起 → 就绪挂起」这条箭头（在外存里等的事件发生了）。引起挂起的原因：内存不足、用户请求、父进程请求、周期性执行的进程、负荷调节。",
 mem:"阻塞是在屋里等，挂起是被请到屋外等。",
 exam:"与 2.2 的中级调度、ch3 的对换区连考。"},
{ch:"proc",name:"进程通信三方式",def:"共享存储（直接读写同一块内存）、消息传递（send/receive，含直接通信与信箱式间接通信）、管道（内核中的固定大小缓冲区）。",
 mix:"共享存储最快（数据不经内核搬运），代价是互斥必须由用户自己用 PV 保证。消息传递每条消息都要内核收发一次，慢但天然互斥、可跨机器。区分技巧：题干说「在程序中直接读写同一变量」是共享存储，说「信箱」「邮件」是间接通信。信号只能通知事件、传不了数据，所以「不能用来交换数据的是」这类题的答案常是信号或文件之外的那一项。",
 mem:"共享存储最快，消息传递最省心，管道最像文件。",
 exam:"2.1-02/29/30/42；2014 真题专攻管道。"},
{ch:"proc",name:"管道的五条性质",def:"管道是内核中一个固定大小的缓冲区，写满则写进程阻塞、读空则读进程阻塞。",
 mix:"2014 真题的五个选项就是它的五条性质：① 本质是内存缓冲区不是磁盘文件；② 半双工，双向要开两条；③ 数据被读走就没了，不能像文件那样重复读；④ 各进程互斥访问，互斥由 OS 保证不用自己加锁；⑤ 匿名管道只用于父子等亲缘进程，命名管道 FIFO 才能用于任意进程。读写阻塞方向别记反：空则读阻塞、满则写阻塞——它就是内核替你写好的有界缓冲区。",
 mem:"管道 = 内核版的生产者-消费者，empty/full 都替你管好了。",
 exam:"2014 统考真题；与 2.3 生产者-消费者对照记。"},
{ch:"proc",name:"线程：共享什么、私有什么",def:"线程是 CPU 调度的基本单位，被称为轻量级进程；同进程的线程共享进程的一切资源，只有 TCB、程序计数器、通用寄存器和栈是私有的。",
 mix:"共享清单：代码段、数据段、堆、已打开的文件与文件描述符、信号量、定时器、I/O 设备。私有清单：TCB、PC、通用寄存器、程序状态字、栈（含栈指针）。栈为什么必须私有：栈里是这条执行流自己的局部变量、参数与返回地址，共用一个栈函数返回地址就会互相覆盖。注意「线程不拥有系统资源」是指不拥有进程级资源，它确实拥有一点必不可少的资源。",
 mem:"栈在线里、其余在线外；进程分资源、线程抢 CPU。",
 exam:"2011（不能共享的是栈指针）、2024（可共享的是地址空间 + 文件描述符）两年正反各问一次；2019 真题在「不拥有任何资源」上设错。"},
{ch:"proc",name:"用户级线程 vs 内核级线程",def:"用户级线程由用户空间的线程库管理，内核看不见；内核级线程由内核管理和调度。",
 mix:"一切结论都从「内核看不见」推出：切换不用陷内核 ⟹ 快、开销小、可自定义调度算法；一个线程阻塞时内核以为整个进程阻塞 ⟹ 全进程陪葬；内核只把一个 CPU 分给这个进程 ⟹ 用不上多核。内核级线程反之：切换要模式切换（慢），但阻塞只阻塞自己、能真并行。最细的一刀：用户级线程的切换不由时钟中断驱动，只能靠线程主动让出、调用线程库函数或线程结束——时间片用完在 ULT 里换的是进程不是线程。",
 mem:"内核看不见你，好处是没人管你，坏处是没人救你。",
 exam:"2.1-48 至 2.1-57 十道题；2.1-52 单考「什么能触发 ULT 切换」。"},
{ch:"proc",name:"三种多线程模型",def:"多对一（多个 ULT 映射到一个 KLT）、一对一、多对多。",
 mix:"多对一 = 并发度最差（一个线程阻塞则全体阻塞、不能多核并行）但管理开销最小；一对一 = 并发度好、能真并行，但线程数受内核限制、创建与切换开销大；多对多 = 取两者之长。所以「并发性较好的模型」是一对一与多对多两个。多对一模型里线程管理在用户空间做，效率高的说法是对的，错项通常写成「多对一也能多核并行」。",
 mem:"多对一省事不顶用，一对一顶用不省事，多对多两头讨好。",
 exam:"2.1-55/56/57。"},
{ch:"proc",name:"三级调度",def:"高级调度（作业调度）把作业从外存后备队列调入内存并建立进程；中级调度（内存调度）把进程在内存与外存挂起区之间换进换出；低级调度（进程调度）从就绪队列里挑一个上 CPU。",
 mix:"对应的状态变化分别是：无→创建→就绪、就绪↔就绪挂起、就绪→运行。中级调度的目的是节省内存、提高多道程序度，不是提高 CPU 利用率（选项里这两个常并列出现）。频率：低级最高、中级次之、高级最低。分时系统与实时系统一般没有作业调度，只有多道批处理才有。作业 vs 进程：作业由用户提交、以用户任务为单位；进程由系统生成、是资源分配与调度的单位。",
 mem:"高级管进不进内存，中级管留不留内存，低级管上不上 CPU。",
 exam:"2.2-01（中级调度的目的是节省内存）、2.2-02、2.2-24。"},
{ch:"proc",name:"调度时机与三处不能调度",def:"能引起调度的事件：进程运行完毕、自我阻塞、时间片用完、出错终止、所需资源未就绪、中断处理结束。",
 mix:"不能进行调度的三处：① 正在处理中断的过程中；② 进程处于内核临界区中（持有内核数据结构的锁）；③ 需要完全屏蔽中断的原子操作中（加锁解锁、中断现场的保护与恢复）。注意普通临界区不在此列——进程在自己的临界区里是可以被调度走的，只是别人进不去临界区，只有内核临界区才禁止调度。另一头：「新进程被创建进入就绪态」不是引起调度的直接原因，非抢占系统里它只能排队等着。",
 mem:"中断里、内核锁里、关中断里——这三处不换人。",
 exam:"2021 统考真题（四项全选）、2.2-13（新进程进就绪不是直接原因）、2.2-14。"},
{ch:"proc",name:"进程切换 vs 模式切换 vs 线程切换",def:"模式切换 = 用户态↔内核态，进程不变；进程切换 = 换 PCB、换地址空间；线程切换 = 同进程内换执行流，地址空间不变。",
 mix:"系统调用返回后往往还是原进程继续跑——发生了两次模式切换、零次进程切换。中断处理一定引起模式切换，但不一定引起进程切换；进程切换必伴随模式切换（反之不然）。开销由小到大：线程切换 < 进程切换；线程切换省的恰恰是页表基址寄存器那一项，因而 TLB 不用刷、Cache 命中率不掉——答简答题要答到这一层，只写「不用切换地址空间」拿不全分。",
 mem:"换衣服（模式）不等于换人（进程），同一家人换手（线程）最省事。",
 exam:"2.2-07/08、2.2-09（线程切换要更新哪些）、2023 真题（哪种操作导致内核态转用户态）。"},
{ch:"proc",name:"上下文切换要更新哪些寄存器",def:"判据只有一条：这个寄存器的内容属于某个进程/线程，还是全系统共用。属于个体的必须换，全局共用的不用换。",
 mix:"换进程时要更新：PC、通用寄存器、PSW、栈基址寄存器、页表基址寄存器、进程打开文件表。不用更新：内核中断向量表基址寄存器（全局共享、由内核统一维护）。换同进程内的线程时：PC、通用寄存器、栈基址寄存器要换；页表基址寄存器、打开文件表不用换。TLB 与 Cache 从不「保存」，切进程时直接置无效即可——它们是页表和主存的可再生副本。",
 mem:"个人物品带走，公共设施留下；TLB 是副本，丢了能再生。",
 exam:"2.2-09（书内）、2024（进程切换三项全要）、2025（中断向量表基址不用更新）三年连考同一张表。"},
{ch:"proc",name:"抢占式 vs 非抢占式",def:"非抢占：进程一旦上 CPU 就跑到结束或主动阻塞为止；抢占：更紧迫的进程到达时可以立刻夺走 CPU。",
 mix:"做题第一步是判抢占：题干出现「抢占式」「可抢占」「最短剩余时间优先」就要在每个新进程到达时重新比一次；否则一旦上 CPU 就跑到底。时间片轮转是绝对可抢占的——时间片一到无条件下来。抢占的两个代价：切换开销增大、可能让长进程更难完成；收益是响应及时、适合分时与实时。注意抢占只对 CPU 有效，正在传输的外设一般抢不走。",
 mem:"看到「抢占」两个字，就在时间轴上每个到达点画一条竖线。",
 exam:"2.2-23（绝对可抢占的是 RR）、2022 真题数调度次数、2023 真题算平均周转。"},
{ch:"proc",name:"FCFS / SJF / SRTN",def:"FCFS 比到达时刻；SJF 比服务时间（非抢占）；SRTN 比剩余时间（抢占）。",
 mix:"三条结论要背方向：FCFS 开销最小、绝不饥饿，但对短作业不利（短的排长的后面就得干等）；SJF 在所有进程同时到达时给出最小平均周转时间，但长作业可能饥饿；到达时刻不同时 SJF 未必最优，SRTN 更小。SJF 也可视为一种特殊的优先级调度（服务时间越短优先级越高），这就是它会饥饿的原因——排队分数永远不变。",
 mem:"先来先服务讲公平，短作业优先讲效率，抢占版更狠也更饿。",
 exam:"2017 真题（t=2 时 FCFS 选 J₁、SJF 选 J₃）、2.2-19/28/31/32/34。"},
{ch:"proc",name:"HRRN 响应比",def:"响应比 R =（等待时间 + 服务时间）÷ 服务时间 = 1 + 等待 ÷ 服务；每次调度前对所有就绪进程重算一遍，取最大者。",
 mix:"这个式子同时兼顾两头：服务时间相同则等得越久 R 越大（照顾长等待）、等待时间相同则作业越短 R 越大（照顾短作业），因此 HRRN 不会饥饿——这正是 2011 真题「满足短作业优先且不会饥饿」的唯一答案。响应比只在调度那一刻算，不是连续变化的量。例：8:00 到达、服务 1h、10:00 才开始执行 ⟹ R =（2+1)/1 = 3。它是非抢占算法，开销比 FCFS 大（每次要重算一轮）。",
 mem:"分子里有等待时间，所以等久了自己会翻身。",
 exam:"2009 真题（综合考虑等待与执行时间）、2011 真题（短作业优先且不饥饿）、2.2-21。"},
{ch:"proc",name:"RR 与时间片大小",def:"时间片轮转：所有就绪进程排成队列，队首上 CPU 跑一个时间片 q，用完无条件回队尾。",
 mix:"两个方向的退化：q 过大 ⟹ 退化为 FCFS；q 过小 ⟹ 切换开销占比暴涨。分时系统的响应时间约为 T ≈ q × N（N 为就绪进程数），反解得 q ≤ T/N。RR 不会饥饿（每轮都轮得到），对短作业不算特别有利但很公平。新到达的进程与用完时间片的进程都插入队尾，若两者同时发生，一般约定新到达者先入队。",
 mem:"轮一圈才轮到你：一圈 N 个人、每人 q 秒。",
 exam:"2024 真题（队尾进程 25ms、10 个进程、q=5 ⟹ 周转 250ms）、2017 真题（基于时间片的调度叙述）、2.2-25。"},
{ch:"proc",name:"多级反馈队列",def:"三条规则：新进程进第一级队列队尾；用完一个时间片没结束就降到下一级队列队尾（时间片通常翻倍）；只有上级队列全空才轮到下级，下级运行时上级来了新进程则被抢占。",
 mix:"降级降的是队列不是优先级数值，而且是降到队尾不是队首，漏掉「队尾」两个字多进程时顺序就全乱。它的最大优点是不需要预先知道进程的运行时间（这正是它比 SJF 实用的地方，错项常写成「需要预知运行时间」）。设计 MLFQ 需要考虑四项：队列数量、各队列的调度算法、各队列的时间片大小、进程升降级的条件。",
 mem:"新人从头等舱开始坐，坐不完就往后挪一节车厢。",
 exam:"2019 真题（二级、Q₂ 用短进程优先 ⟹ 平均等待 15ms）、2020 真题（设计要考虑哪些）、2.2-29/33。"},
{ch:"proc",name:"周转时间四个公式",def:"周转 = 完成时刻 − 到达时刻；带权周转 = 周转 ÷ 服务时间（恒 ≥ 1）；等待 = 周转 − 服务时间；含切换开销时每次切换在时间轴上插一段。",
 mix:"最常见的错是把周转算成「完成 − 开始」——等待的那一段必须算进去。带权周转对短作业最敏感（分母小），所以拿它衡量「短作业受不受委屈」。开销题最容易漏掉自己那一次：n 个进程跑完共发生 n 次切换，不是 n−1 次。2018 真题的算式模式值得背下来：某进程周转 = 它已等待的时间 + 前面所有进程的（开销 + 服务）+ 自己的（开销 + 服务）。",
 mem:"周转从「到达」算起，不是从「开始跑」算起。",
 exam:"2018 真题（平均 75μs）、2023 真题（平均 61ms）、2.2-26/28、综 04/08。"},
{ch:"proc",name:"饥饿 vs 死锁 vs 忙等",def:"饥饿 = 某进程长期得不到资源但系统仍在推进；死锁 = 一组进程互相等待、全都推进不了；忙等 = 拿不到锁就在原地空转，CPU 一直被占着。",
 mix:"判饥饿只需一问：这个进程的排队分数会不会随等待时间自动变好？会 ⟹ 不饥饿（FCFS、RR、HRRN、MLFQ 带老化）；不会 ⟹ 可能饥饿（SJF/SRTN、静态优先级）。死锁一定伴随饥饿，反之不然。资源剥夺法能解除死锁，但若某进程总被挑中当受害者就会造成饥饿——这正是「一直剥夺已阻塞进程资源」那道题的正解。忙等的问题是不满足让权等待，属于 2.3 的话题。",
 mem:"饥饿是一个人倒霉，死锁是一群人卡死，忙等是占着 CPU 干等。",
 exam:"2014 真题（不可能饥饿的是 RR）、2.2-35、2.4-06（剥夺导致饥饿）。"},
{ch:"proc",name:"I/O 型作业该给高优先级",def:"综合考虑 CPU 时间与 I/O 时间时，I/O 繁忙型作业应给更高的优先级。",
 mix:"理由是它很快就会主动让出 CPU 去做 I/O，早点放它走可以让 CPU 与外设同时忙，提高系统整体资源利用率；若让 CPU 型的先跑，外设就得干等一大段。反面是 FCFS 有利于 CPU 繁忙型、不利于 I/O 繁忙型。同一思路在 MLFQ 里体现为：I/O 型进程往往用不完时间片，因此能长期留在高优先级队列。",
 mem:"让爱跑腿的先出门，屋里屋外一起忙。",
 exam:"2013 统考真题（优先级设为 P₃ > P₂ > P₁）、2.2-10。"},
{ch:"proc",name:"调度算法特性总表",def:"从四个维度记：会不会饥饿、抢不抢占、开销大小、典型场景。",
 mix:"FCFS：不饥饿、非抢占、开销最小、对短作业不利。SJF/SRTN：会饥饿、SRTN 抢占、同时到达时平均周转最优。HRRN：不饥饿、非抢占、开销大（每次重算）。静态优先级：会饥饿、看题干、实时系统常用。RR：不饥饿、绝对可抢占、开销大、分时系统专用。MLFQ：基本不饥饿、抢占、不需预知运行时间、通用。多处理器调度额外要考虑负载平衡与处理器亲和性——「进程周转时间」是单处理器就有的目标，不算额外。",
 mem:"分数会自己长大的算法都不饿人。",
 exam:"2.2-12/23/30/31/34/35/36/43，一张表覆盖八道题。"},

{ch:"sync",name:"临界资源 vs 临界区",def:"临界资源是一次仅允许一个进程使用的资源；临界区是访问临界资源的那一段代码。",
 mix:"一个是资源、一个是代码，别混。临界资源举例：打印机、磁带机等独占设备，以及共享变量、栈、表格。可同时访问的：只读文件、用可重入代码编写的程序。若有 5 个进程都会访问同一个变量 A，则与 A 相关的临界区有 5 个（每个进程里各一段）。进入区、临界区、退出区、剩余区是一段代码的四个部分，锁在进入区加、在退出区放。",
 mem:"资源只有一个，临界区有几段就看几个进程碰它。",
 exam:"2.3-01/06/08/09/27；2.3-19/20（可重入代码是代码段/程序）。"},
{ch:"sync",name:"同步四准则",def:"空闲让进、忙则等待、有限等待、让权等待。",
 mix:"关键在地位不同：前三条是实现临界区互斥必须遵循的，让权等待不是必须的——Peterson 算法不满足让权等待却是正确的互斥算法（2020 真题正解是「仅前三条」）。各算法违反哪条：单标志法违反空闲让进（必须轮流）；双标志先检查违反忙则等待（会两人同进）；双标志后检查满足互斥但会活锁（都谦让）；Peterson 与 TSL 只差让权等待；TSL 还不保证有限等待（谁抢到看运气）。",
 mem:"空忙有让四字诀，前三必须、让权可选。",
 exam:"2020 统考真题、2016 真题（TSL 的两个不）、2.3-07。"},
{ch:"sync",name:"信号量的值代表什么",def:"S > 0 时 S 是当前可用的资源数；S ≤ 0 时 |S| 是阻塞队列里等待的进程数。",
 mix:"两条推论：P 先减后判，减完仍 ≥ 0 就不阻塞；V 先加后判，加完仍 ≤ 0 说明还有人在等、必须唤醒一个——所以「因 V 操作唤醒了别人」等价于「V 之前 S ≤ −1、V 之后 S ≤ 0」。三种算法：已知初值求当前值用 S = S₀ − P次数 + V次数；求取值范围用「上界 = 资源数、下界 = −(进程数 − 资源数)」；判断阻塞在哪个信号量上要看题问的是 mutex 还是 empty/full。",
 mem:"正数是货、负数是人；|负数| 就是排队的人头。",
 exam:"2010 真题（初值 3、当前 1 ⟹ 已分配 2 个且无人等待）、2.3-03/24/25/26/32/35。"},
{ch:"sync",name:"互斥信号量 vs 同步信号量",def:"互斥信号量把临界区锁起来，初值恒为 1；同步信号量表达「A 做完 B 才能做」，初值为 0（或初始可用的资源数）。",
 mix:"最好用的判别法：互斥量的 P 和 V 必在同一个进程里一前一后；同步量的 P 和 V 常常分处两个不同进程（一个发票、一个收票）。互斥信号量的初值与生产者数、消费者数、缓冲区大小全都无关——9 个生产者 6 个消费者容量 8 的题里 mutex 仍是 1，被数字唬住就上当了。计数信号量（初值 = 资源个数）是同步量的一种，用于「有限的多个同类资源」。",
 mem:"锁是自己拿自己还，票是别人发你收。",
 exam:"2.3-17/18/42；PV 大题的采分点之一就是信号量声明与含义。"},
{ch:"sync",name:"整型信号量 vs 记录型信号量",def:"整型信号量的 wait 用 while(S ≤ 0) 空转（忙等）；记录型信号量带一个等待队列，用 block 原语把自己挂起。",
 mix:"因此只有记录型信号量满足让权等待——2018 真题问「下列同步机制中可以实现让权等待的是」，Peterson、swap、TSL 全是忙等，正解是信号量。课本默认的 P/V 指记录型。要当心题目自己重新定义 P/V 的情况（2021 综合真题给的是整型信号量的功能描述），这时一律以题干定义为准，不能套课本结论。",
 mem:"整型的等法是站着干瞪眼，记录型的等法是躺下让出 CPU。",
 exam:"2018 统考真题（2.3-55）、2021 综合真题（2.3-综25）。"},
{ch:"sync",name:"P、V 操作与原子性",def:"P（wait）与 V（signal）是一对原语，执行过程不可被中断；P 可能阻塞自己，V 绝不阻塞自己、只可能唤醒别人。",
 mix:"为什么必须原子：P 里包含「减一 + 判断 + 可能阻塞」三步，若在减一与判断之间被切走，两个进程可能同时认为自己拿到了最后一个资源。实现原子性靠关中断或硬件指令。PV 只能加减 1 且不能读出当前值——所以凡是需要「读出数量再判断」的场合（如判断自己是不是第一个读者），必须另用普通整型变量加一把专属的 mutex。",
 mem:"P 是拿、V 是还；拿不到就睡，还完顺手叫醒一个。",
 exam:"2.3-12/13/23/30；读者-写者的 count 就是「信号量读不出值」的直接后果。"},
{ch:"sync",name:"软件互斥算法三代",def:"单标志法（turn 轮流）、双标志先检查、双标志后检查、Peterson 算法。",
 mix:"Peterson 是软件方案的终点，两个变量分工必须说清：flag[i] = true 表示「我想进」（表达意愿），turn = j 表示「让你先」（解决同时想进时的僵局）。把 turn 写成 turn = i（我先）就变成错误算法——2010 真题的填空考的就是这一格。Peterson 满足空闲让进、忙则等待、有限等待，唯独不满足让权等待。单标志法的毛病最典型：即使临界区空着，没轮到你也进不去。",
 mem:"先举手（flag）再谦让（turn），谦让的那句话是「你先」不是「我先」。",
 exam:"2010 统考真题（2.3-48）、2.3-36/37/38。"},
{ch:"sync",name:"硬件互斥：TSL / swap / 关中断",def:"TestAndSet 与 swap 由硬件保证「读 + 改 + 写」不可分割；关中断法直接屏蔽中断使自己不被切走。",
 mix:"关中断的两个硬伤：是特权指令（用户态用不了）、多处理器上无效（只关得住自己这颗核）。TSL 与 swap 适用于多处理器、实现简单，但都是忙等，且不保证有限等待（无法避免饥饿）。用 swap 实现互斥的标准写法里，key 必须是每个进程私有的局部变量，退出临界区时要把 lock 置回 false——2023 综合真题让你找学生代码的错误，先查这两处。",
 mem:"硬件方案买的是原子性，付的是忙等的电费。",
 exam:"2016 真题（TSL 机制的叙述）、2023 综合真题（swap 找错）、2.3-综08。"},
{ch:"sync",name:"互斥锁与自旋锁",def:"互斥锁提供 acquire/release 两个原子操作；实现上分自旋（忙等）与睡眠两类。",
 mix:"自旋锁在临界区很短、且多处理器的场合反而更划算——省下了两次上下文切换。但在单处理器上自旋锁毫无意义：持锁者被切走后，自旋者把整个时间片空转完也等不到锁。使用互斥锁最常见的死锁场景是「同一个进程对同一把锁连续 acquire 两次」，或两个进程以相反顺序获取两把锁。",
 mem:"临界区短就转两圈，临界区长就睡一觉。",
 exam:"2.3-21/22。"},
{ch:"sync",name:"管程与条件变量",def:"管程把共享数据结构、操作它的一组过程、初始化语句和一个名字打包，由编译器保证任一时刻只有一个进程在管程内。",
 mix:"管程的价值：互斥是免费的（编译器管），程序员只需处理同步。条件变量与信号量的四点不同：条件变量没有值、只是一个等待队列；x.wait() 调了就一定阻塞；x.wait() 会阻塞自己并释放管程使用权（2018 真题正解，否则谁也进不来救它）；x.signal() 若无人等待则什么也不做（V 一定加 1）。「管程内可以有多个进程」是错的，「等待队列里可以有多个进程」是对的——它们在管程外等。",
 mem:"管程是把 PV 封进一个类；条件变量是没有余额的信号量。",
 exam:"2018 真题（x.wait 做什么）、2016 真题（管程叙述的错项）、2.3-15/28/29。"},
{ch:"sync",name:"生产者-消费者骨架",def:"semaphore mutex = 1, empty = n, full = 0；生产者 P(empty)→P(mutex)→放→V(mutex)→V(full)；消费者 P(full)→P(mutex)→取→V(mutex)→V(empty)。",
 mix:"三个信号量各管一件事：empty 防写满、full 防读空、mutex 防两人同时改指针；缺 empty 会覆盖数据、缺 full 会取到空、缺 mutex 会指针错乱。V 的对象别写反：生产者结束 V(full)（我加了货），消费者结束 V(empty)（我腾了位）。缓冲区只有一个单元时可以省掉 mutex（empty/full 已经保证了互斥）。多生产者多消费者时骨架一字不改。",
 mem:"生产者先要空位、消费者先要货，然后才轮到抢锁。",
 exam:"2014 统考真题、2009 统考真题、2.3-39 至 2.3-43。"},
{ch:"sync",name:"P 的顺序为什么不能换",def:"同步信号量的 P 必须写在互斥信号量的 P 之前；V 的顺序则无所谓。",
 mix:"把 P(mutex) 提前会死锁：生产者拿着锁却发现没有空位，于是抱着锁睡着；消费者想取货腾位子，却拿不到锁——两边互相等。这是 PV 大题唯一的致命错误，也是所有 PV 综合题的第一个采分点。V 为什么可以随便：V 永远不阻塞，谁先谁后都能顺利执行完。不对称的根源就在这里：P 会睡、V 不会。",
 mem:"先看有没有位子，再去抢门票；抱着锁睡觉是最惨的死法。",
 exam:"2013 真题（博物馆：P(empty) 必须在 P(mutex) 前）、几乎每道 PV 大题的必查项。"},
{ch:"sync",name:"生产者-消费者的四种变体",def:"多生产者多消费者、一次连取 k 件、缓冲区按类别分流、放入的是成套的东西。",
 mix:"一次连取 k 件：把 P(mutex) 提到 for 循环外面，否则取到一半被别人插队（2014 真题的全部难度）。按奇偶或类别分流：把 full 拆成 full_odd 与 full_even，empty 与 mutex 仍共用（2009 真题）。成套产品（车架+车轮、苹果+橘子）：每种产品一个 full、empty 共用；若还有「箱内不能只剩一种」这类约束要另加计数信号量。判据：题干出现「连续」「一次性」「一组」，先想锁的粒度要放大。",
 mem:"要连着做的事，锁就要圈得大一点。",
 exam:"2014 统考真题（综 20）、2009 统考真题（综 17）、2.3-综09/10/16。"},
{ch:"sync",name:"读者-写者：计数 + 双锁",def:"semaphore rw = 1, mutex = 1; int count = 0；第一个读者负责 P(rw) 上大门锁，最后一个读者负责 V(rw) 开锁，中间的读者直接进；写者只 P(rw)。",
 mix:"两把锁分工不能错：rw 保护被读写的资源（读者群体整体只占用它一次），mutex 保护计数器 count——没有它，两个读者同时 ++count 会双双认为自己不是第一个，于是谁也不去 P(rw)。判断与加锁必须在同一个 mutex 保护下完成，这是「检查-然后-动作」竞态的教科书案例。上面的模板是读者优先（写者可能饿死）；再套一个最外层信号量 w（读者写者都先 P(w)）就变成写者优先/公平版。",
 mem:"第一个进的人锁门，最后一个出的人开门；数人头这件事本身也要上锁。",
 exam:"2.3-44；双向过桥、录像厅、博物馆同向问题全是它的变体。"},
{ch:"sync",name:"哲学家就餐与四种破法",def:"五位哲学家各先拿左筷再拿右筷时，全体同时拿起左筷就形成环，死锁。",
 mix:"三种考过的破法：限制人数（至多 n−1 人同时去拿筷子，5 人时 seat 初值最大取 4）、奇偶分流（奇数号先拿左、偶数号先拿右）、一次拿两根（把取左取右放进一个互斥段，要么都拿到要么都不拿，破的是请求并保持）。2019 真题在此基础上加了 m 个碗：bowl 初值 = min{n−1, m}，且 P(bowl) 必须写在拿筷子之前——两个约束取更严的那个，只写 m 或只写 n−1 都只能拿一半分。放筷子时不需要任何判断，直接 V 两下。",
 mem:"少放一个人进屋，或者让一个人反着拿，环就断了。",
 exam:"2019 统考真题（综 23）、2.3-45（seat 最大取 4）、2.4-14/15（左右撇子并存不死锁）。"},
{ch:"sync",name:"前驱图型 PV",def:"图上有几条弧就设几个信号量、初值一律为 0；每个结点把所有入边的 P 写在动作前、所有出边的 V 写在动作后。",
 mix:"验收方法：数一遍「P 的总数 = V 的总数 = 边数」，对上就一定不会错。两个易错点：一是别偷懒合并信号量——某结点有两条入边就必须两个信号量，用一个 V 两次会在「A 连做两次而 B 一次没做」时错误放行；二是线程版要先把「同一线程内部的边」划掉（顺序执行天然保证），只有跨线程的边才需要信号量。",
 mem:"一条边一张票，进门交票、出门发票。",
 exam:"2020 统考真题（A,B→C；C,D→E）、2022 统考真题（两线程六操作）、2.3-综06/14/29。"},
{ch:"sync",name:"并发执行结果的不确定性",def:"高级语言的一条 x = x + 1 实际是「load → add → store」三条指令，竞态发生在读与写之间被别人插了一脚。",
 mix:"问可能的结果有哪些：看谁最后 store——最终值 = 最后写回者当初读到的值经它修改后的结果。问有几种序列能得到正确结果：正确值通常只在完全不交错时出现，n 个线程即 n! 种。2016 真题的题眼是「不同进程的同名变量互不影响」——P₁ 的 x 与 P₂ 的 x 是两个地址，根本不存在竞态；只有同一进程内两个线程对同一变量的写才需要互斥，局部变量不用、读读之间也不用。",
 mem:"拆成读-改-写三步，再想「谁最后写回」。",
 exam:"2011（x 可取 0/1/2）、2018（使 x=2 的序列有 2 种）、2016（哪些操作需互斥）、2.3-33/46。"},
{ch:"sync",name:"死锁的定义与四个必要条件",def:"死锁是多个进程因竞争资源而造成的一种互相等待、若无外力都无法推进的僵局。四个必要条件：互斥、请求并保持（占有且等待）、不可剥夺、循环等待。",
 mix:"「必要条件」意味着四条同时成立才可能死锁，但成立也不一定死锁——尤其是循环等待：多实例资源下出现环也未必死锁。四条里互斥是唯一无法破坏的（打印机就是不能两人同时用）。产生死锁的两大原因：系统资源竞争 + 进程推进顺序非法（不合适的 PV 顺序也算，PV 写反了就是典型的死锁制造机）。",
 mem:"互斥破不了，其余三条各有破法。",
 exam:"2.4-02/03/04/05；2.3 的 PV 顺序错误就是它的代码版。"},
{ch:"sync",name:"死锁预防：四条件各自的破法",def:"破互斥（不可行）、破请求并保持（一次性申请全部资源）、破不可剥夺（申请不到就释放已占有的）、破循环等待（顺序资源分配法）。",
 mix:"一次性分配所有资源破的是请求并保持（不是互斥、不是循环等待），代价是资源利用率极低、可能饥饿。顺序资源分配法要求进程按编号递增顺序申请资源，代价是编号一旦定死就限制了新设备的加入、也不便于用户编程。破不可剥夺的代价是前面的工作可能作废、实现复杂，一般只用于状态易保存恢复的资源（CPU、内存），打印机这类不适用。",
 mem:"预防是事前立规矩，规矩越硬利用率越低。",
 exam:"2.4-09（一次分配破的是占有并请求）、2.4-11/12/13；2015 真题提醒「顺序资源分配法属预防不属避免」。"},
{ch:"sync",name:"安全状态与安全序列",def:"安全状态 = 存在一个进程推进序列，使每个进程都能依次拿到所需资源并运行完；这样的序列称为安全序列。",
 mix:"三者的圈层关系必须记牢方向：安全 ⟹ 一定不死锁 ✓；死锁 ⟹ 一定不安全 ✓；不安全 ⟹ 一定死锁 ✗（只是可能）；不死锁 ⟹ 一定安全 ✗。也就是说不安全状态里还有一片「暂时没死但可能死」的区域。安全序列往往不唯一，但也可能一个都没有——2011 真题的正解偏偏是「不存在」，四个选项里三个具体序列时更要老实算。",
 mem:"安全是一定不死，不安全只是可能死。",
 exam:"2013 真题（安全状态一定无死锁）、2.4-17、2011 真题（安全序列不存在）。"},
{ch:"sync",name:"银行家算法四步",def:"处理一次资源请求：① Request ≤ Need？否则出错 ② Request ≤ Available？否则让它等待 ③ 试探性分配 ④ 跑安全性算法，安全就真分配、不安全就撤销试分配并让它等。",
 mix:"第 ② 步是最常被漏掉的采分点：Request > Available 时进程直接等待，压根不必再做安全性检查。银行家算法属于死锁避免，它一条必要条件都不破坏，只是不让系统进入不安全状态；说它「预防死锁」或「破坏了请求并保持」都是错的（2013 真题四个选项就是这四个角）。它的前提是进程必须事先声明各类资源的最大需求量。",
 mem:"先问超不超需求，再问够不够分，最后问分完还安不安全。",
 exam:"2013 统考真题、2.4-18/19；综合题要求写完整步骤时漏掉第 ② 步就丢分。"},
{ch:"sync",name:"安全性算法：Work += Allocation",def:"令 Work = Available，反复找一个 Need ≤ Work 的进程，标记完成并执行 Work += Allocation；全部完成则安全。",
 mix:"归还的是 Allocation（它现在手里拿着的），不是 Max、也不是 Need——2018 真题的 A/C 之争全在这里：4 个资源，三进程需求 4/3/1、已占 2/1/0 ⟹ Available = 1、Need = 2/2/1，只有 P₃ 能跑，但 P₃ 归还的 Allocation = 0，Work 仍是 1，P₁、P₂ 全卡住 ⟹ 不安全。考场提速用集合推进法：只要还有得选，选谁都不影响「是否安全」的结论，不必逐个试排列。选择题给四个候选序列时更快——只验证第一个进程能不能启动，往往一步定答案。",
 mem:"它还回来的是手上的，不是它想要的。",
 exam:"2018 真题（不安全）、2011/2012/2020/2022 四道真题、2.4-综03/04/05。"},
{ch:"sync",name:"死锁公式 m > n(k−1)",def:"n 个进程、每个最多需要 k 个同类资源时，系统必不死锁的充分条件是 m > n(k−1)，即 m ≥ n(k−1)+1。",
 mix:"推导：最坏情况是每人都拿到 k−1 个（差一个就能干完）共占 n(k−1) 个，只要还多出 1 个就能塞给任一进程让它跑完并归还全部资源，雪崩式解开。各进程需求不同时改成求和式 Σkᵢ < m + n（2.4-31 的正解就是「小于 m+n」）。三道真题全部死在「严格大于」上：m = n(k−1) 时恰好死锁。看清问的是资源最少还是进程最多——同一条不等式，解的方向相反。公式的前提是同类资源、一次申请一个、用完全部释放；多类资源必须改用银行家算法。",
 mem:"人人差一个的时候最危险，再多给一个就全活了。",
 exam:"2009（8 台打印机 ⟹ K=3）、2014（三进程需 3/4/5 ⟹ n=10）、2021（各需 2 ⟹ m=n+1）、2.4-27/28/29/30/31。"},
{ch:"sync",name:"资源分配图与死锁定理",def:"单实例资源：有环 ⟺ 死锁。多实例资源：有环只是可能死锁，要看资源分配图能否完全简化；不可完全简化即死锁（死锁定理）。",
 mix:"化简就是反复找一个「请求边都能被满足」的进程，把它的边全部擦掉（它能跑完并归还）；化简顺序不影响结论，放心从最容易满足的开始。死锁定理属于检测手段，不是预防也不是避免。求死锁进程数下界的通法（2016 真题）：把「谁要哪些资源」写成集合两两求交，交集大小 ≥ 2 才可能出现二元环，否则最小环长是 3；问「至少」就要构造被卡住的人最少的场景，环外能先跑完的进程不算。",
 mem:"能擦干净就没死锁；两个人成环得共享两类资源。",
 exam:"2016 统考真题（死锁进程数至少 3）、2.4-20/21/22/23/32。"},
{ch:"sync",name:"死锁检测与解除",def:"检测：定期运行死锁检测算法（资源分配图化简）；解除：资源剥夺法、撤销进程法、进程回退法。",
 mix:"2015 真题的三点辨析：采用检测法的系统允许死锁发生，因此必须配套剥夺或回退才能解除；采用避免法（银行家）的系统不会进入不安全状态，因而不需要检测。撤销进程法代价最大（前面的工作全废），进程回退法要求系统记录历史信息、设置还原点。解除死锁不采用的方法通常是「立即释放全部资源给最后一个进程」这类张冠李戴的选项。剥夺资源若总挑同一个受害者会造成饥饿。",
 mem:"死了再救的前提是你手里得有剥夺权。",
 exam:"2015 统考真题、2019 统考真题、2.4-24/25/26。"},
{ch:"sync",name:"预防 · 避免 · 检测三策略对比",def:"预防在分配前就定死规则（破坏四条件之一）；避免在每次分配前算一次安全性；检测+解除等死了再处理。",
 mix:"三者的代价：预防的资源利用率最低、并发度最差；避免要求预知最大需求、每次分配都有计算开销；检测要求能剥夺或回滚。判断题的常见错法：把银行家算法说成预防（它是避免）、把顺序资源分配法说成避免（它是预防）、说「不安全状态一定死锁」（只是可能）。还有一类是「鸵鸟策略」——直接忽略死锁，实际系统（如通用 OS）大多这么干。",
 mem:"事前立规矩、事中算一算、事后收尸；越靠前越保守。",
 exam:"2013、2015、2019 三年真题；2.4-16/37/39/42。"},

{ch:"mem",name:"连续分配与碎片",def:"动态分区算法：首次适应、最佳适应、最坏适应、邻近适应；动态分区产生外部碎片，固定分区产生内部碎片。",
 mix:"最佳适应听着好，实际外部碎片最多（越切越碎）；首次适应综合表现通常最好。紧凑（拼接）可消外碎片，但需要动态重定位（基址寄存器）支持。",
 mem:"内碎片在分区「内」浪费，外碎片是分区「间」的缝。",
 exam:"给请求序列问分配到哪个分区，选择题高频。"},
{ch:"mem",name:"分页存储基础",def:"内存和进程都按固定大小划分（页框/页）；逻辑地址 = 页号 + 页内偏移；页表记录页号→块号。",
 mix:"地址拆分按二进制：页大小 4KB → 偏移占 12 位，页号 = 逻辑地址高位。分页有内部碎片（最后一页装不满）、无外部碎片。页表寄存器 PTBR 存页表起址，进程切换时更换。",
 mem:"偏移位数 = log₂(页大小)，先算这个再谈别的。",
 exam:"地址转换计算年年考 → 去「地址转换模拟器」亲手点。"},
{ch:"mem",name:"页表项与页表大小",def:"页表项 = 块号 + 有效位 + 访问位 + 修改位 + 保护位；页表大小 = 页表项数 × 项大小。",
 mix:"页表项数由逻辑地址空间决定（页数），块号位数由物理内存决定——两头别搞混。页表项大小按位数上取整到字节。「页内偏移也存在页表里」错——偏移直接拼接，不查表。",
 mem:"逻辑管「几行」，物理管「每行多宽」。",
 exam:"求页表占用空间的计算题高频易错。"},
{ch:"mem",name:"TLB 与有效访问时间",def:"TLB（快表）是页表项的高速缓存，相联存储器按内容并行查找。EAT = 命中率×(t_TLB+t_mem) + (1−命中率)×(t_TLB+2·t_mem)。",
 mix:"TLB 命中则总共只访存 1 次；未命中要先访存查页表再访存取数（2 次）。题目若说「TLB 与慢表同时查找」则未命中时不重复计 TLB 时间。TLB 是硬件，进程切换时要刷新。",
 mem:"快表命中省一次访存。",
 exam:"EAT 计算选择题高频，注意题干「同时/先后查找」措辞。"},
{ch:"mem",name:"二级页表",def:"页表本身再分页；逻辑地址 = 一级页号 + 二级页号 + 页内偏移；一级页表（页目录）常驻内存。",
 mix:"多级页表的目的是页表可离散存放、且可不全部调入内存——不是为了快（访存次数反而多一次：n 级页表要 n+1 次访存取数）。各级页表大小不得超过一个页面。",
 mem:"给页表建目录，目录不许超一页。",
 exam:"划分逻辑地址结构的计算题高频。"},
{ch:"mem",name:"分页 vs 分段",def:"页是物理划分、定长、对用户透明、地址一维；段是逻辑划分、变长、用户可见、地址二维（段名+段内址）。",
 mix:"分段利于共享和保护（按逻辑模块），有外部碎片；分页无外碎片有内碎片。越界检查：分页只查页号 < 页表长度；分段还要查段内偏移 < 段长。段页式 = 先分段、段内再分页，地址 = 段号+页号+偏移，访存 3 次（段表+页表+数据）。",
 mem:"页管物理省空间，段管逻辑好共享。",
 exam:"两者辨析选择题高频。"},
{ch:"mem",name:"虚拟内存与请求分页",def:"基于局部性原理：部分装入、按需调页、必要时置换。页表项增加有效位/访问位/修改位。",
 mix:"缺页中断是内中断（异常），一条指令执行中可产生多次缺页（操作数跨页）。虚存最大容量由计算机地址位数决定，不是「内存+外存容量之和」。虚拟内存的实现必须有硬件支持（页表机制+中断机构+地址变换）。",
 mem:"用得着再搬进来，用不着先住外存。",
 exam:"概念判断选择题高频。"},
{ch:"mem",name:"页面置换算法",def:"OPT 淘汰将来最久不用（理论最优不可实现）；FIFO 淘汰最早进入；LRU 淘汰最久未使用；CLOCK 用使用位近似 LRU。",
 mix:"只有 FIFO 会 Belady 异常（页框多缺页反增）；LRU 是栈式算法不会。LRU 手算技巧：从当前位置向左回看。改进 CLOCK 优先淘汰（访问0,修改0）。缺页时不一定发生置换（有空闲块就不换）。",
 mem:"去「页面置换模拟器」亲手点一遍，比背表格牢。",
 exam:"手算缺页次数年年考。"},
{ch:"mem",name:"页框分配与抖动",def:"分配策略 = 固定/可变分配 × 局部/全局置换（固定+全局不存在）；抖动 = 页面频繁换入换出，CPU 利用率骤降。",
 mix:"发现「CPU 利用率低、磁盘利用率高」→ 正在抖动，此时增加多道程序度反而更糟，应减少并发数或增加页框。工作集 = 时间窗口内实际访问的页集合，分配页框数应不小于工作集大小。",
 mem:"人多粥少就抖，减人或加粥。",
 exam:"场景判断选择题经典。"},

{ch:"fs",name:"文件物理结构三种",def:"连续分配（随机访问快、不便增长）；链接分配（隐式链接逐块找 / 显式链接 FAT）；索引分配（每文件一索引块）。",
 mix:"FAT 是显式链接：整张表常驻内存，查找链不用访盘，且支持相对随机的访问。隐式链接访问第 i 块要读 i 次盘。连续分配删除文件后产生外部碎片。",
 mem:"连续像数组，链接像链表，索引像页表。",
 exam:"「访问第 i 块需几次访盘」计算选择高频。"},
{ch:"fs",name:"UNIX 混合索引",def:"inode 含若干直接地址 + 一级/二级/三级间接地址；最大文件长度 = (直接块数 + k + k² + k³) × 块大小，k = 每块可存地址数。",
 mix:"算最大文件长度别忘直接块；读文件某偏移的访盘次数 = 间接级数 + 1（间址块本身也要读）。inode 在打开文件时调入内存。",
 mem:"直接块是口袋，间址块是柜子、仓库、仓库群。",
 exam:"最大文件大小/访盘次数计算，408 大题选择都爱考。"},
{ch:"fs",name:"目录、硬链接与软链接",def:"目录项 = 文件名 + inode 号。硬链接 = 多个目录项指向同一 inode（计数+1）；软链接 = 存放路径字符串的新文件。",
 mix:"删除硬链接只是计数减 1，计数为 0 才真正删除文件；删除源文件后软链接悬空失效。硬链接不能跨文件系统、通常不能指向目录；软链接都可以，但访问要多读一次（先读链接文件取路径）。",
 mem:"硬链接是同一人多个名字，软链接是写着地址的便条。",
 exam:"链接计数变化选择题高频。"},
{ch:"fs",name:"空闲空间管理",def:"空闲表、空闲链表、位示图、成组链接四法；位示图 1 位对应 1 块。",
 mix:"位示图计算：盘块号 = 字号×字长 + 位号（注意题目从 0 还是 1 编号，两种口径结果差 1）。成组链接是 UNIX 用法，超级块存第一组。",
 mem:"位示图 = 一张座位表，1 占 0 空（或反之，看题目定义）。",
 exam:"位示图字号位号互算，选择题高频。"},
{ch:"fs",name:"磁盘调度算法",def:"FCFS、SSTF（最短寻道优先）、SCAN（电梯，到头才回）、LOOK（到最远请求即回）、C-SCAN（单向服务，回程不停）。",
 mix:"SSTF 平均寻道短但两端请求饥饿；SCAN 与 LOOK 的区别（到不到磁盘边缘）、C-SCAN 回程不服务是采分细节。做题先把请求按柱面排成数轴再模拟。",
 mem:"电梯来回扫，C 型单向转。",
 exam:"算总寻道距离/服务序列，年年见。"},
{ch:"fs",name:"磁盘存取时间",def:"存取时间 = 寻道时间 + 旋转延迟 + 传输时间；平均旋转延迟 = 转半圈的时间 = 1/(2r)。",
 mix:"转速 rpm 先换算成每秒转数再算；传输时间 = 数据量/磁道容量 × 每转时间。减少旋转延迟的技巧：交替编号、错位命名。磁盘格式化后有效容量变小（间隙与校验开销）。",
 mem:"找道→等转→读写，三段时间分开算。",
 exam:"计算题高频，转速换算是易错点。"},

{ch:"io",name:"I/O 控制方式四种",def:"程序查询（忙等）→ 中断驱动（每字符/字一次中断）→ DMA（每块一次中断）→ 通道（每组块一次中断）。",
 mix:"DMA 数据传输不经过 CPU（直接内存↔设备），但初始化和结束处理仍需 CPU。大量数据时中断方式的 CPU 开销高于 DMA。通道是能执行通道程序的「小 CPU」，进一步解放主 CPU。",
 mem:"CPU 参与度递减：全程盯→打断我→搬完叫我→整批完再叫我。",
 exam:"算中断次数/CPU 占用时间，选择题高频。"},
{ch:"io",name:"缓冲区计算",def:"单缓冲每块处理耗时 = max(C, T) + M；双缓冲 = max(C+M, T)。（T=输入，M=传送，C=计算）",
 mix:"两个公式记反是重灾区：单缓冲时传送 M 与输入 T 不能并行（同一缓冲区），双缓冲可以。缓冲区设在内存。缓冲池 = 多个缓冲区共享。",
 mem:"双缓冲「边倒边灌」，单缓冲「倒完再灌」。",
 exam:"计算处理 n 块数据总时间，选择题常考。"},
{ch:"io",name:"SPOOLing 假脱机",def:"用磁盘上的输入井/输出井 + 输入输出进程，把独占设备改造成逻辑上的共享设备（如打印机）。",
 mix:"SPOOLing 需要多道程序技术支持，但不需要真的多台设备。井在磁盘上不在内存。用户进程的「打印」只是把数据送入输出井，物理打印由 SPOOLing 系统统一调度。",
 mem:"每人发一台「虚拟打印机」，实际排队一台真机。",
 exam:"概念判断选择题常客。"},
{ch:"io",name:"I/O 层次与设备独立性",def:"用户层 I/O → 设备独立性软件（逻辑设备表 LUT）→ 设备驱动程序 → 中断处理程序 → 硬件。",
 mix:"设备独立性 = 程序用逻辑设备名，映射到物理设备由 LUT 完成；换物理设备不用改程序。驱动程序与硬件相关，每类设备一个。「某功能属于哪一层」是标准考法（如缓冲管理在设备独立层）。",
 mem:"越往上越抽象，越往下越懂硬件。",
 exam:"层次归属选择题高频。"},
{ch:"io",name:"设备分配",def:"按独占/共享/虚拟设备区分策略；数据结构：设备控制表 DCT、控制器表 COCT、通道表 CHCT、系统设备表 SDT。",
 mix:"独占设备静态分配才安全（动态易死锁）；共享设备（磁盘）动态分配。安全分配方式：申请后阻塞直到分到——牺牲效率换安全。",
 mem:"独占的慎重给，共享的排队用。",
 exam:"概念选择题中频。"}
];

/* ===== 渲染（与其余卡库同模板） ===== */
const panel=document.getElementById('panel');
const vg=document.getElementById('vgrid');
const isMobile=()=>window.innerWidth<=900;
let curFilter='all', curIdx=-1;

function cardHTML(d){
  return `<div class="wcard">
    <div class="head"><span class="w">${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
    <div class="row r-def"><b>一句话定义</b>${d.def}</div>
    <div class="row r-conf"><b>易混辨析（408 命脉）</b>${d.mix}</div>
    <div class="row r-mem"><b>怎么记</b>${d.mem}</div>
    <div class="row r-exam"><b>408 考法</b>${d.exam}</div>
    ${d.src?`<div class="r-src">📦 提炼自：${d.src}</div>`:''}
    <div class="r-link">🔗 真题出处：待错题页生成后回链点亮</div>
  </div>`;
}
function showCard(i){
  const d=K[i]; curIdx=i;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.toggle('active', +e.dataset.i===i));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>`+cardHTML(d);
  if(isMobile())panel.classList.add('open');
}
function quiz(){
  const pool=K.map((d,i)=>[d,i]).filter(([d])=>curFilter==='all'||d.ch===curFilter);
  const [d,i]=pool[Math.floor(Math.random()*pool.length)];
  curIdx=-1;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.remove('active'));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>
  <div class="wcard"><div class="head"><span class="w">🎲 ${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
  <div class="hint" style="padding:20px 6px;color:var(--muted);font-size:.85rem;text-align:center">先在心里说出<b>定义</b>和<b>易混点</b>……</div>
  <button class="reveal" onclick="showCard(${i})">想好了，看答案</button>
  <button class="reveal" style="background:none;border-color:var(--line);color:var(--muted)" onclick="quiz()">换一张</button></div>`;
  if(isMobile())panel.classList.add('open');
}
function renderGrid(f){
  curFilter=f; vg.innerHTML='';
  K.forEach((d,i)=>{
    if(f!=='all'&&d.ch!==f)return;
    const div=document.createElement('div');div.className='vitem';div.dataset.i=i;
    if(i===curIdx)div.classList.add('active');
    div.innerHTML=`<span class="chip">${CH[d.ch]}</span><div class="w">${d.name}</div><div class="cn">${d.def.length>38?d.def.slice(0,38)+'…':d.def}</div>`;
    div.addEventListener('click',()=>{showCard(i);if(!isMobile())window.scrollTo({top:0,behavior:'smooth'})});
    vg.appendChild(div);
  });
}
const fdiv=document.getElementById('filters');
const counts={};K.forEach(d=>counts[d.ch]=(counts[d.ch]||0)+1);
const fs=[['all','全部 '+K.length]].concat(Object.keys(CH).map(k=>[k,CH[k]+' '+counts[k]]));
fs.forEach(([k,label],j)=>{
  const b=document.createElement('button');b.className='fbtn'+(j===0?' on':'');
  b.innerHTML=label.replace(/ (\d+)$/,' <span class="cnt">$1</span>');
  b.addEventListener('click',()=>{document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderGrid(k)});
  fdiv.appendChild(b);
});
const qb=document.createElement('button');qb.className='quizbtn';qb.textContent='🎲 随机抽卡自测';
qb.addEventListener('click',quiz);fdiv.appendChild(qb);
renderGrid('all');
</script>
