<script>
const CH = {ov:"概述与中断",proc:"进程与调度",sync:"同步与死锁",mem:"内存管理",vm:"虚拟内存",fs:"文件管理",io:"I/O 管理"};
const K = [
{ch:"ov",name:"内核态 vs 用户态",def:"CPU 两种特权级别；特权指令（I/O 指令、置时钟、开关中断、修改页表寄存器等）只能在内核态执行。",
 mix:"访管指令（trap）本身在用户态执行——它是普通指令，作用是切入内核态。读时钟是非特权、置时钟是特权。用户态→内核态的唯一途径是中断/异常；内核态→用户态靠修改 PSW（特权操作）。",
 mem:"能「管别人、管硬件」的都是特权指令；用户态→内核态只能靠中断/异常（硬件自动切），内核态→用户态靠 IRET（内核态执行）。",
 exam:"「下列哪些指令只能在内核态执行」选择题年年见。"},
{ch:"ov",name:"并发 vs 并行（两个层次）",def:"并发＝多个事件在同一时间间隔内发生；并行＝在同一时刻真正同时发生。",
 mix:"「谁和谁并行」决定答案：①进程与进程并行 → 必须多处理器（单 CPU 只能并发）；②CPU 与 I/O 设备之间、多个 I/O 设备之间 → 单机就是真并行（中断方式的特点）。2018 真题：多任务 OS「具有并发和并行的特点」对，但「必须运行在多 CPU 上」错。多台虚拟机跑在同一物理机 = 并发，不是并行。",
 mem:"时刻＝并行，间隔＝并发；进程级并行要多核，CPU 与外设的并行单机就有。",
 exam:"ch1 出现 5 次，全章复现率第一（1.1-05、1.2-14、2018、1.6-16、1.7 疑难点）。"},
{ch:"ov",name:"OS 四特征的层级",def:"并发、共享、虚拟、异步；其中并发与共享是两个最基本的特征，二者互为前提。",
 mix:"四条不是平级：并发+共享＝必需（一定要实现）；虚拟+异步＝手段与后果。2022 真题选项「多道程序系统不必支持虚拟存储管理」是对的——早期多道批处理把数据全调入主存，没有虚存照样并发。互为前提的两条理由：①共享以并发为前提（单道无所谓共享）②有效共享是并发正确执行的基础。",
 mem:"并发共享是门槛，虚拟异步是风景。",
 exam:"2022 统考真题直接考四特征的层级关系。"},
{ch:"ov",name:"共享的两种形式 · 临界资源",def:"互斥共享：一段时间内只允许一个进程访问，该类资源称临界资源；同时访问：允许多个进程宏观上同时访问（微观上可分时交替）。",
 mix:"临界资源举例：打印机、磁带机等独占设备，以及软件中的栈、变量、表格。可同时访问：磁盘上的只读文件、用重入代码编写的程序。注意「临界资源」是资源，访问它的那段代码叫「临界区」（ch2）。同时访问的「同时」通常指逻辑上的并发访问。",
 mem:"互斥＝排队用，同时访问＝可以一起看。",
 exam:"概念判断题；ch2 的 PV 操作全部建立在临界资源之上。"},
{ch:"ov",name:"虚拟：时分复用 vs 空分复用",def:"把一个物理实体映射为多个逻辑上的对应物。两类：时分复用（处理器的分时共享）、空分复用（虚拟存储器）。",
 mix:"虚拟设备技术（SPOOLing）把独占的打印机变成多台逻辑设备——它把临界资源转化成了共享资源。虚存的逻辑容量可超过物理内存。同一思想在组原（虚存、总线分时复用）与网络（时分多路复用）里反复出现。",
 mem:"时间上错开＝时分，空间上分块＝空分。",
 exam:"概念判断；与 ch3 虚存、ch5 SPOOLing 连考。"},
{ch:"ov",name:"两类接口：命令接口 vs 程序接口",def:"用户接口（命令方式、图形方式）面向普通终端用户；程序接口（系统调用）专为应用程序设计。",
 mix:"用户接口三类：联机（命令行，输入一条立即执行并返回）、脱机（作业控制语言，用于批处理，作业说明书随作业一并提交）、GUI（底层仍走系统调用）。题干出现「在程序中」→ 一定是系统调用；出现「作业说明书」→ 脱机接口。命令解释程序（Shell）属命令接口，在用户态执行（2011 真题）。",
 mem:"人敲的叫命令接口，程序调的叫系统调用。",
 exam:"1.1-06/07、1.3-15、2011 真题。"},
{ch:"ov",name:"库函数 vs 系统调用",def:"库函数是语言提供的、运行在用户态的可复用代码；系统调用是 OS 提供的、运行在内核态的服务接口。库函数只是对系统调用的封装。",
 mix:"并非所有库函数都触发系统调用：printf→write（会），malloc→brk/mmap（可能会），strlen/sqrt/sin/random/abs（不会，纯用户态）。可移植性：库函数好、系统调用与 OS 紧耦合。可替换/可调试：库函数容易、系统调用麻烦（1.3-13 的错项正是把这条说反）。开销：库函数小、系统调用大（要上下文切换）。",
 mem:"库函数是语言给的，系统调用是 OS 给的。",
 exam:"ch1 考了四次：2010、2013（sin）、2021（random）+ 书内题。"},
{ch:"ov",name:"特权指令三族",def:"只能在内核态执行的指令。三族：①直接管理系统资源（置时钟、启停设备、I/O 指令、切换进程、设置中断）②修改系统状态（改中断向量表、改模式位、修改 PSW、开关中断、设中断屏蔽字）③系统控制（停机、重启）。",
 mix:"两个特例必须单记：陷入（访管/Trap）指令是非特权指令、在用户态执行——否则用户永远进不去内核；中断屏蔽字设置指令属特权——屏蔽字寄存器∈中断控制器∈I-O 接口⟹属 I-O 指令。普通数据传送、转移跳转、压栈、寄存器清零都在用户态。「管理员权限」不等于「内核态」：root 的程序照样在用户态。",
 mem:"影响整个系统的都是特权指令；只动自己数据的都不是。",
 exam:"ch1 考了 5 次（2014、2021 + 三道书内题）。"},
{ch:"ov",name:"发生在用户态 vs 执行在内核态",def:"同一个事件，「在哪一态发生」与「在哪一态处理」是两个问题。",
 mix:"系统调用、外中断、缺页：都发生在用户态、处理在内核态。只有进程切换连「发生」都在内核态（2012 真题正解）——切换要存取 PCB、改页表基址寄存器、换内核栈，全是特权操作。2024 真题再细分：「中断或异常发生时 CPU 处于内核态」错（可能在用户态，多重中断时也可能已在内核态）；「中断处理程序开始执行时处于内核态」对。",
 mem:"敲门在门外，干活在门里；只有进程切换是关起门来干的。",
 exam:"2012、2024 两道真题；做题第一步是圈出时间副词。"},
{ch:"ov",name:"中断现场：硬件做的 vs OS 做的",def:"中断响应由硬件（中断隐指令）完成：关中断、保存断点 PC 与 PSW、改模式位、查中断向量表取入口；中断处理由 OS 完成：保存中断屏蔽字、保存通用寄存器、执行服务例程。",
 mix:"中断向量表由 OS 在开机初始化时建立（2020、2022 两次考过）。TLB 与 Cache 无须保存，直接置有效位为 0——它们是可再生的副本。系统调用同理：保存断点/程序状态字、改模式位由硬件；保存通用寄存器、执行服务例程由 OS（2022 真题）。",
 mem:"断点、状态字、模式位归硬件；通用寄存器、屏蔽字、服务例程、向量表初始化归 OS。",
 exam:"2015、2020、2022 三年同一把刀，答案彼此印证。"},
{ch:"ov",name:"中断与异常的分类树",def:"中断分异常（内中断）与外中断（硬件）。异常＝故障 Fault + 自陷 Trap + 终止 Abort；外中断＝可屏蔽 INTR + 不可屏蔽 NMI。",
 mix:"软件中断＝故障+自陷；硬件中断＝终止+外中断。故障：缺页、除 0、非法操作码、溢出；自陷：访管/系统调用指令、条件陷阱；终止：控制器出错、存储器校验错。能屏蔽的只有可屏蔽中断，NMI 与所有异常都屏蔽不掉。缺页中断名字带中断，分类却是异常（2016 真题的错项）。",
 mem:"内因叫异常、外因叫中断；异常一律不可屏蔽。",
 exam:"2016 真题；1.3-12 书内题又考一遍。"},
{ch:"ov",name:"中断与异常的返回位置",def:"异常处理完返回第 i 条指令重新执行；中断处理完返回第 i+1 条指令继续执行。",
 mix:"组原口诀：故障退回重做、自陷与中断都往下走、终止直接不走了。这条规则是虚存能成立的前提——缺页处理完必须重执行那条访存指令，否则程序拿到垃圾数据。若判定为不可恢复的致命错误，则终止用户程序。中断在「指令执行结束后」才被检测，异常在指令执行中就触发。",
 mem:"异常回原地重做，中断往下继续。",
 exam:"与缺页处理、ch3 请求分页连考。"},
{ch:"ov",name:"中断处理 vs 子程序调用",def:"六条区别：独立性、随机性、是否需硬件支持、入口地址来源、PC 由谁保存、是否需优先级裁决。",
 mix:"入口地址：中断查中断向量表，子程序由 CALL 指令的地址码给出。PC：中断由硬件在响应时自动保存，子程序由 CALL 指令压栈。2012 真题：中断一定保存而子程序不需保存的是 PSW（程序状态字）——中断可能插在标志位刚生成还没用的缝里，且中断要切换特权级；子程序调用不跨态。系统调用要存 PC+PSW，一般过程调用只存 PC。",
 mem:"中断是随机来的客人，子程序是事先约好的。",
 exam:"2012 统考真题（PSW）；1.3-14 书内题。"},
{ch:"ov",name:"系统调用的四步与五大类",def:"四步：①传递系统调用参数 ②执行陷入指令切内核态 ③按系统调用号查系统调用表并执行服务程序 ④恢复现场返回用户态。",
 mix:"顺序不能乱：参数必须在陷入之前传，否则内核不知道要干什么（2017 真题的三个错项全把传参排在陷入之后）。五大类：设备管理、文件管理、进程控制、进程通信、内存管理。判断「哪个操作通过系统调用完成」的判据：必须由用户进程主动请求——页置换、进程调度是 OS 自发的，random() 是纯用户态（2021 真题）。不同 OS 的系统调用接口不统一（2019 的错项）。",
 mem:"先备货、再敲门、人家干活、最后送客；点菜的是你（用户态），做菜的是后厨（内核态）。",
 exam:"2017（顺序）、2021（哪个是）、2019（性质）、2022（谁完成）。"},
{ch:"ov",name:"时钟中断的内容",def:"时钟的功能＝计时 + 产生定时中断。时钟中断服务程序更新一切与时间有关的量。",
 mix:"更新内容：内核时钟变量、当前进程占用 CPU 的时间、当前进程时间片的剩余量、各种定时器；并决定是否执行调度程序。2018 真题三条说法全对。没有时钟中断就没有抢占式调度——分时靠它轮转、实时靠它算截止期、批处理靠它衡量进度。",
 mem:"时钟中断是 OS 的心跳：记账 + 决定要不要换人。",
 exam:"2018 统考真题。"},
{ch:"ov",name:"原语与关中断",def:"原语是由若干条指令组成、执行过程不可被中断的原子操作，常通过关中断实现原子性。",
 mix:"关中断是特权指令（2014 真题正解）——能把中断关掉说明权限极大。关中断后时钟中断进不来，调度器再无机会运行，用户程序若能关中断就能独占 CPU（系统假死）。常见原语：进程切换、进程同步、资源分配；ch2 的创建/撤销/阻塞/唤醒四原语与 PV 操作也是原语。",
 mem:"要么不做，要么一口气做完；关中断这件事在内核手里是工具，在用户手里是灾难。",
 exam:"2014 真题；ch2 进程控制全部由原语实现。"},
{ch:"ov",name:"三代系统追求什么",def:"批处理要「多」（吞吐量、资源利用率）；分时要「快」（响应时间）；实时要「准」（截止期限、确定性）。",
 mix:"批处理的主要缺点是缺乏交互能力（书上点名的常考点，不是吞吐量小、不是需要大量内存）。实时系统的主要目标是实时性与可靠性，资源利用率不是——为保证高优先级任务，允许「浪费」资源。实时时限由被控制对象规定，不是机器周期/周转时间/时间片。硬实时（机床控制、导弹制导）超时有永久性损害；软实时（订票、股票、银行）只损失经济利益。",
 mem:"批处理要多、分时要快、实时要准。",
 exam:"1.2 节题 02/05/06/07/10/15 全考这一条。"},
{ch:"ov",name:"单道批处理 vs 多道程序设计",def:"单道批处理三特征：自动性、顺序性、单道性；多道程序设计三特点：多道、宏观上并行、微观上串行。",
 mix:"多道依赖中断技术才能让 I-O 与 CPU 并行（2016 真题的正确说法）。多道的优点：CPU 利用率高、吞吐量大、I-O 设备利用率高；但系统开销变大（2017 真题的错项说「开销小」）。多道程序引入后程序失去封闭性和顺序性，新增制约性、间断性、共享性。进程数越多 CPU 利用率越高是错的（2022 真题）——竞争加剧甚至死锁，ch3 称之为抖动。",
 mem:"多道＝拿开销换利用率，收益有上限。",
 exam:"2016、2017、2022 三年真题全落在这里。"},
{ch:"ov",name:"响应时间 T ≈ Q × N",def:"分时系统中，响应时间约等于时间片 Q 乘以用户（就绪进程）数 N。",
 mix:"反解求时间片上界：Q ≤ T/N。例：100 个就绪进程、响应不超过 2s ⟹ Q ≤ 20ms。方向别记反：加大时间片会延长响应时间（1.2-09 的错项）。改善响应时间应采用「优先级+非抢占式调度」——纯抢占会让低优先级进程饥饿，最坏响应时间被拖成无穷。单位：题干给秒、选项给毫秒，算完要乘 1000。",
 mem:"轮一圈才轮到你：一圈 N 个人、每人 Q 秒。",
 exam:"1.2-11、1.2-12、1.2-09。"},
{ch:"ov",name:"甘特图与 CPU 利用率",def:"多道环境下多个程序共用 CPU 与外设，画甘特图求利用率；规矩：同一设备同一时刻只能被一个程序占用，后到的排队。",
 mix:"CPU 利用率＝CPU 忙的总时长 ÷ 全部结束的时刻（分母不是某个程序的长度，也不是 CPU 段之和）。「CPU 空闲」与「进程等待」是两件事：可能 CPU 满载而某进程在等，也可能无人等 CPU 而 CPU 闲着。典型结论：单道 50%、多道 88.9%（同一批工作）；另一题 CPU 空闲仅 50ms、利用率 83.3%，某进程有两段等待。",
 mem:"先画图再算，分母永远是总时长。",
 exam:"1.2 节两道综合应用题；ch2 调度算法会继续用甘特图。"},
{ch:"ov",name:"五种 OS 结构的标签",def:"分层、模块化、宏内核、微内核、外核。本节唯一的出题手法是张冠李戴。",
 mix:"分层＝单向依赖、便于调试验证（有可靠开发顺序）、但穿层效率低且依赖僵化；模块化＝高内聚低耦合、支持并行开发、模块间直接调用效率高、但没有可靠的决定顺序；宏内核＝性能高但一崩全崩；微内核＝可靠安全可扩展可移植、性能差；外核＝把裸资源直接分给用户级系统，只管分配回收保护，进程调度仍归内核。Windows 是宏内核与微内核的融合，不是分层式。",
 mem:"读到某句话先问：它本来是谁的标签。",
 exam:"1.4 节 10 道题几乎全是标签错位。"},
{ch:"ov",name:"微内核：四方面与机制策略分离",def:"定义微内核的四个方面：足够小的内核、基于客户/服务器模式、机制与策略分离、采用面向对象技术。",
 mix:"机制留内核（进程创建切换与调度队列、地址转换机制、中断与陷入的捕获分发），策略移到用户态服务器（优先级分配、页面置换算法、内存分配策略）。不宜放在微内核中的是文件系统服务（1.4-06 唯一的答案）。微内核的四个优点：扩展性灵活性、可靠性安全性、可移植性、分布式计算；唯一硬伤是性能。「微内核结构没有单一内核稳定」是错的——内核服务越少越稳定。现状：Linux/Windows/Android 宏或混合；macOS/iOS 的 XNU 融合；Fuchsia、HarmonyOS NEXT 微内核。",
 mem:"微内核＝只留骨架、其他外包；优点全是「性」字辈里除性能之外的那些。",
 exam:"2023 统考真题（仅 Ⅱ Ⅲ Ⅳ，不含性能）。"},
{ch:"ov",name:"OS 引导七步",def:"CPU 从 ROM 读 BIOS → POST 自检并按 CMOS 选启动设备 → 读入 MBR → MBR 解析分区表找活动分区并读入 PBR → PBR 加载启动管理器 → 加载内核映象 → 内核初始化并启动首个用户态进程。",
 mix:"每一棒只认识下一棒：凡「BIOS 直接加载内核」「启动管理器由 BIOS 直接读取」这类跳环节说法一律错。自举程序在主板 ROM，OS 引导程序（启动管理器）在硬盘活动分区的引导扇区——两个都叫引导程序但位置不同。CMOS 存参数不存程序。MBR＝引导代码+硬盘分区表，位于硬盘首扇区。引导只把内核装入内存（常驻内存的只有内核），OS 最终被加载到 RAM（2013 真题）。内核初始化还要建 PCB 链表、就绪与阻塞队列、设备控制块。",
 mem:"ROM 里的自举程序只负责把硬盘第一扇区读进来。",
 exam:"1.5 节五题 + 2013、2022 真题。"},
{ch:"ov",name:"两类虚拟机管理程序（VMM）",def:"第一类（裸金属）直接运行在硬件上、处于最高特权级、效率高；第二类（寄居）以应用程序形式运行在宿主 OS 上，本质是用户态进程。",
 mix:"辨认法：装它之前要不要先装别的 OS——要＝第二类（VMware Workstation、VirtualBox），不要＝第一类（Xen、ESXi）。客户 OS 运行在「虚拟内核态」，它以为自己在真实内核态，一执行敏感指令就陷入 VMM。2025 真题：VMM 与 OS 特权级相同是错的，VMM 必须高于客户 OS。VMM 代码量小于完整 OS（只模拟硬件接口）。虚拟磁盘实际上是宿主机上的一个普通文件。多台虚拟机是并发不是并行。",
 mem:"看 VMM 下面压着谁：硬件＝一类，宿主 OS＝二类。",
 exam:"2025 统考真题；1.6 节 7 题。"},
{ch:"ov",name:"网络 OS vs 分布式 OS",def:"网络 OS 仅实现资源共享与通信，各机独立运行、用户需显式指定远程资源位置；分布式 OS 节点对等、资源透明共享、提供单一系统映像。",
 mix:"分布式的核心特点：分布性、并行性、透明性，其中透明性尤为关键。判据一句话：用户需不需要知道东西在哪台机器上。注意 408 里「透明」＝用户感觉不到它的存在（虚存对用户透明、Cache 对程序员透明），不是「看得清」。",
 mem:"要自己指路的是网络 OS，感觉像一台机器的是分布式。",
 exam:"概念辨析选择题。"},
{ch:"ov",name:"中断向量表用什么数据结构",def:"数组。CPU 由中断类型号直接算出入口地址在表中的位置：地址＝基址+类型号×表项长度，O(1) 随机存取。",
 mix:"链表要顺着走 O(n)、还要多存指针；队列只能从队头取，不支持按号查找。向量表在开机初始化后基本不变、大小固定（类型号个数由硬件定死），链表擅长的频繁插删完全用不上。同一套「用定长号查定长表」的结构还有：系统调用号→系统调用表、页号→页表、逻辑块号→索引结点。",
 mem:"要 O(1) 按号取，就只能是数组。",
 exam:"2023 统考真题（三科合一：OS × 组原 × 数据结构）。"},
{ch:"proc",name:"进程与 PCB",def:"进程 = 程序的一次执行过程，是资源分配（拥有资源）的基本单位；PCB 是进程存在的唯一标志。",
 mix:"PCB 四类信息：进程描述信息（PID、用户 ID、父子关系）、进程控制与管理信息（状态、优先级）、资源分配清单（内存、打开文件、I/O 设备）、处理机相关信息（各寄存器与 PC 的现场）。PCB 常驻内存、位于内核区，用户态碰不到。由「PCB 是唯一标志」可推出两件事：创建进程的第一步是申请空白 PCB，终止进程的最后一步是释放 PCB；系统能容纳的最大进程数首先受 PCB 表（内存）限制，不是受 CPU 个数限制。",
 mem:"PCB 是进程的身份证 + 病历本；OS 眼里只有 PCB，没有 PCB 就没有这个进程。",
 exam:"2.1-24「下列不属于 PCB 的是」、2.1-25「最大进程数受什么限制」；2021、2024 两道创建/终止真题都由这条推出。"},
{ch:"proc",name:"进程映像的五个区域",def:"一个进程在内存里的样子：只读代码段、可读写数据段、运行时堆（向高地址长）、用户栈（向低地址长），外加内核区里的 PCB、内核栈与页表。",
 mix:"判某个 C 变量在哪一段，按四问走：是指令 → 代码段；函数外或带 static → 数据段；malloc 出来的 → 堆；函数内的局部变量、参数、返回地址 → 栈。PCB 不在这四段里，它在内核区。线程视角再叠一层：代码段、数据段、堆、已打开文件全部共享，只有栈（含栈指针）与寄存器是每线程一份。堆与栈相向生长，中间留空洞，这样两者谁多用一点都不浪费。",
 mem:"低地址往上是代码、数据、堆；高地址往下是栈；PCB 在墙外的内核区。",
 exam:"2.1-22 逐个变量判段；2025 综合真题直接拿这张图问「哪些区域可被同进程的线程共享」。"},
{ch:"proc",name:"进程的四个特征",def:"动态性（最基本）、并发性、独立性、异步性。",
 mix:"动态性是进程与程序的根本区别——进程有生有死、程序是静态的指令集合，其余区别都是这条的推论。异步性说的是各进程以不可预知的速度推进，所以「并发进程的相对速度由进程自己决定」是错的。独立性指进程是独立获得资源、独立调度的基本单位。注意进程与程序是多对多：一个程序跑在不同数据集上形成多个进程，一个进程执行期间也可调用多个程序（共享库）。",
 mem:"动态是命根，异步是脾气：跑多快不由你说了算。",
 exam:"2.1-03「根本区别」、2.1-05/06/07/09/23 一族判断题。"},
{ch:"proc",name:"并发失去封闭性与可再现性",def:"程序单道运行时独占全部资源，结果只由初始条件决定（封闭性），重跑必然同样结果（可再现性）；并发执行时共享变量会被别人改，两条都丢了。",
 mix:"这句话是整个 2.3 章存在的理由：正因为失去了封闭性，才需要 PV 把该独占的那一段圈起来。判断题里「并发进程失去封闭性是指多个进程共享 CPU 导致运行结果不确定」这类说法要抠准——失去封闭性的原因是共享了变量/资源，不是共享了 CPU 本身。多道程序引入后程序还新增了间断性、制约性、共享性。",
 mem:"你的结果被别人改过，就不再是你一个人的程序了。",
 exam:"2.1-18；2.3 的 x++ 交错题（2011、2018）就是它的定量版。"},
{ch:"proc",name:"进程控制四原语",def:"创建、撤销、阻塞（wait）、唤醒（wakeup）四个原语，均由若干指令组成且执行中不可被中断，通常用关中断实现原子性。",
 mix:"为什么必须是原语：进程控制要改 PCB、改队列指针，改到一半被切走会留下不一致的内核数据结构。阻塞原语由进程自己调用（自我阻塞），唤醒原语必须由别的进程/中断处理程序调用——一个进程绝不可能自我唤醒。阻塞与唤醒必须成对出现，否则被阻塞的进程永远醒不过来。四原语都执行在内核态。",
 mem:"睡是自己躺下的，醒必须别人喊。",
 exam:"2.1-28 原语性质、2.1-27「进程自身能决定什么」；ch1 的关中断特权指令与它同源。"},
{ch:"proc",name:"创建进程：必做 vs 不必做",def:"创建原语：申请空白 PCB → 为新进程分配所需资源（除 CPU）→ 初始化 PCB → 插入就绪队列。",
 mix:"2021 真题正是这四步的判断题：申请空白 PCB ✓、初始化 PCB ✓、「设置进程状态为运行态」✗——新进程一律先进就绪态，上不上 CPU 是调度器的事，创建原语管不着。会导致创建新进程的事件：用户登录成功、启动程序执行、作业调度（高级调度）、OS 响应用户请求；「设备分配」不会——它只是给已有进程加资源，没有新程序要跑。",
 mem:"造好人送进就绪队列就完事，谁上 CPU 不归它管。",
 exam:"2021 统考真题（仅 Ⅰ、Ⅱ）、2010 统考真题（导致创建新进程的操作）、2.1-08/47。"},
{ch:"proc",name:"终止进程与级联终止",def:"撤销原语：找到 PCB → 若在运行则剥夺 CPU → 终止其子进程（若该系统采用级联终止）→ 归还全部资源 → 删除 PCB。",
 mix:"2024 真题问「终止进程时不一定执行的是」，正解就是「终止子进程」——级联终止只是某些系统的设计策略，不是普遍规则；而回收内存、回收设备、释放 PCB 是任何系统都要做的。引起终止的三类事件：正常结束、异常结束（越界、非法指令、除零、运行超时）、外界干预（操作员干预、父进程请求、父进程终止）。",
 mem:"资源一定收，孩子不一定杀。",
 exam:"2024 统考真题；与 2020 真题的父子进程关系连着考。"},
{ch:"proc",name:"父进程与子进程",def:"子进程由父进程创建，可继承父进程的部分资源；父进程终止时子进程未必终止（取决于是否级联）。",
 mix:"最容易记反的一条：父子进程不共享虚拟地址空间——子进程拿到的是父进程地址空间的一份副本（写时复制），改了互不影响；能共享的是已打开的文件这类资源。子进程撤销时要把从父进程那里获得的资源归还给父进程，不是归还给系统。进程树是一棵树：一个进程只有一个父进程，可以有多个子进程。",
 mem:"给的是复印件不是原件；还的时候还给爸爸不是还给系统。",
 exam:"2020 统考真题（2.1-67）、2.1-21。"},
{ch:"proc",name:"五状态模型的四条箭头",def:"就绪→运行（被调度）、运行→就绪（只缺 CPU）、运行→阻塞（缺 CPU 以外的东西）、阻塞→就绪（等的东西来了）。加上创建态与终止态即五状态。",
 mix:"两条箭头永远不存在：就绪→阻塞（不在 CPU 上跑，没机会提申请）、阻塞→运行（资源到手也只能先回就绪队列排队）。三条箭头是被动的、只有一条是自己按的：进程唯一能自己决定的是「运行→阻塞」。单处理器上 n 个进程，就绪队列最多 n−1 个（必有一个在运行），但阻塞队列可以是 n 个（CPU 空转）。",
 mem:"缺 CPU 进就绪，缺别的进阻塞；睡醒了也要回队尾排队。",
 exam:"2.1-40 的经典错项 D 就是「阻塞→运行」；2.3-31a/31b 考队列长度上限。"},
{ch:"proc",name:"就绪态 vs 阻塞态（判据）",def:"两者都不在 CPU 上跑，区别只在于「一旦拿到 CPU 能不能马上跑」：就绪态能，阻塞态不能（还差别的东西）。",
 mix:"判据一句话：缺的是不是 CPU。时间片用完、被高优先级抢占、主动出让 CPU → 就绪；读文件、读磁盘、申请外设、缺页、wait() 且信号量不足、申请临界资源失败 → 阻塞。三个高频陷阱：缺页是阻塞不是就绪（要等磁盘）；wait() 不一定阻塞（S 减完仍 ≥ 0 就继续跑）；「时间片用完」永远是就绪，既不是阻塞也不构成唤醒。",
 mem:"就绪是只差车、阻塞是还差货。",
 exam:"2015、2018、2022、2023 四年真题全考这条线；2019 真题从「唤醒」的反面考。"},
{ch:"proc",name:"唤醒与自我阻塞",def:"阻塞由进程自己调用阻塞原语完成；唤醒必须由另一个进程或中断处理程序调用唤醒原语完成。",
 mix:"因此「某事件可能将进程唤醒」的判据是：阻塞队列里等的那样东西到了没有。I/O 结束 ✓（等 I/O 的醒）、别的进程退出临界区 ✓（等锁的醒）、当前进程时间片用完 ✗（动的是运行态的进程，跟阻塞队列毫无关系）。反过来「必会引起进程切换」的唯一答案是运行→就绪：创建后进就绪、阻塞后转就绪都只是往就绪队列塞人，当前进程照跑不误。",
 mem:"唤醒的主语永远是别人；只有运行态那位下来了，CPU 才必须换人。",
 exam:"2019 统考真题（仅 Ⅰ、Ⅱ）；2.1-44、2.1-46。"},
{ch:"proc",name:"挂起态与七状态模型",def:"挂起 = 把进程从内存换到外存。五状态加上就绪挂起、阻塞挂起两态即七状态模型，由中级调度负责换入换出。",
 mix:"挂起不等于阻塞：阻塞是在等事件、人还在内存；挂起是被搬到了外存，既可能处于就绪也可能处于阻塞。所以有「阻塞挂起 → 就绪挂起」这条箭头（在外存里等的事件发生了）。引起挂起的原因：内存不足、用户请求、父进程请求、周期性执行的进程、负荷调节。",
 mem:"阻塞是在屋里等，挂起是被请到屋外等。",
 exam:"与 2.2 的中级调度、ch3 的对换区连考。"},
{ch:"proc",name:"进程通信三方式",def:"共享存储（直接读写同一块内存）、消息传递（send/receive，含直接通信与信箱式间接通信）、管道（内核中的固定大小缓冲区）。",
 mix:"共享存储最快（数据不经内核搬运），代价是互斥必须由用户自己用 PV 保证。消息传递每条消息都要内核收发一次，慢但天然互斥、可跨机器。区分技巧：题干说「在程序中直接读写同一变量」是共享存储，说「信箱」「邮件」是间接通信。信号只能通知事件、传不了数据，所以「不能用来交换数据的是」这类题的答案常是信号或文件之外的那一项。",
 mem:"共享存储最快，消息传递最省心，管道最像文件。",
 exam:"2.1-02/29/30/42；2014 真题专攻管道。"},
{ch:"proc",name:"管道的五条性质",def:"管道是内核中一个固定大小的缓冲区，写满则写进程阻塞、读空则读进程阻塞。",
 mix:"2014 真题的五个选项就是它的五条性质：① 本质是内存缓冲区不是磁盘文件；② 半双工，双向要开两条；③ 数据被读走就没了，不能像文件那样重复读；④ 各进程互斥访问，互斥由 OS 保证不用自己加锁；⑤ 匿名管道只用于父子等亲缘进程，命名管道 FIFO 才能用于任意进程。读写阻塞方向别记反：空则读阻塞、满则写阻塞——它就是内核替你写好的有界缓冲区。",
 mem:"管道 = 内核版的生产者-消费者，empty/full 都替你管好了。",
 exam:"2014 统考真题；与 2.3 生产者-消费者对照记。"},
{ch:"proc",name:"线程：共享什么、私有什么",def:"线程是 CPU 调度的基本单位，被称为轻量级进程；同进程的线程共享进程的一切资源，只有 TCB、程序计数器、通用寄存器和栈是私有的。",
 mix:"共享清单：代码段、数据段、堆、已打开的文件与文件描述符、信号量、定时器、I/O 设备。私有清单：TCB、PC、通用寄存器、程序状态字、栈（含栈指针）。栈为什么必须私有：栈里是这条执行流自己的局部变量、参数与返回地址，共用一个栈函数返回地址就会互相覆盖。注意「线程不拥有系统资源」是指不拥有进程级资源，它确实拥有一点必不可少的资源。",
 mem:"栈在线里、其余在线外；进程分资源、线程抢 CPU。",
 exam:"2011（不能共享的是栈指针）、2024（可共享的是地址空间 + 文件描述符）两年正反各问一次；2019 真题在「不拥有任何资源」上设错。"},
{ch:"proc",name:"用户级线程 vs 内核级线程",def:"用户级线程由用户空间的线程库管理，内核看不见；内核级线程由内核管理和调度。",
 mix:"一切结论都从「内核看不见」推出：切换不用陷内核 ⟹ 快、开销小、可自定义调度算法；一个线程阻塞时内核以为整个进程阻塞 ⟹ 全进程陪葬；内核只把一个 CPU 分给这个进程 ⟹ 用不上多核。内核级线程反之：切换要模式切换（慢），但阻塞只阻塞自己、能真并行。最细的一刀：用户级线程的切换不由时钟中断驱动，只能靠线程主动让出、调用线程库函数或线程结束——时间片用完在 ULT 里换的是进程不是线程。",
 mem:"内核看不见你，好处是没人管你，坏处是没人救你。",
 exam:"2.1-48 至 2.1-57 十道题；2.1-52 单考「什么能触发 ULT 切换」。"},
{ch:"proc",name:"三种多线程模型",def:"多对一（多个 ULT 映射到一个 KLT）、一对一、多对多。",
 mix:"多对一 = 并发度最差（一个线程阻塞则全体阻塞、不能多核并行）但管理开销最小；一对一 = 并发度好、能真并行，但线程数受内核限制、创建与切换开销大；多对多 = 取两者之长。所以「并发性较好的模型」是一对一与多对多两个。多对一模型里线程管理在用户空间做，效率高的说法是对的，错项通常写成「多对一也能多核并行」。",
 mem:"多对一省事不顶用，一对一顶用不省事，多对多两头讨好。",
 exam:"2.1-55/56/57。"},
{ch:"proc",name:"三级调度",def:"高级调度（作业调度）把作业从外存后备队列调入内存并建立进程；中级调度（内存调度）把进程在内存与外存挂起区之间换进换出；低级调度（进程调度）从就绪队列里挑一个上 CPU。",
 mix:"对应的状态变化分别是：无→创建→就绪、就绪↔就绪挂起、就绪→运行。中级调度的目的是节省内存、提高多道程序度，不是提高 CPU 利用率（选项里这两个常并列出现）。频率：低级最高、中级次之、高级最低。分时系统与实时系统一般没有作业调度，只有多道批处理才有。作业 vs 进程：作业由用户提交、以用户任务为单位；进程由系统生成、是资源分配与调度的单位。",
 mem:"高级管进不进内存，中级管留不留内存，低级管上不上 CPU。",
 exam:"2.2-01（中级调度的目的是节省内存）、2.2-02、2.2-24。"},
{ch:"proc",name:"调度时机与三处不能调度",def:"能引起调度的事件：进程运行完毕、自我阻塞、时间片用完、出错终止、所需资源未就绪、中断处理结束。",
 mix:"不能进行调度的三处：① 正在处理中断的过程中；② 进程处于内核临界区中（持有内核数据结构的锁）；③ 需要完全屏蔽中断的原子操作中（加锁解锁、中断现场的保护与恢复）。注意普通临界区不在此列——进程在自己的临界区里是可以被调度走的，只是别人进不去临界区，只有内核临界区才禁止调度。另一头：「新进程被创建进入就绪态」不是引起调度的直接原因，非抢占系统里它只能排队等着。",
 mem:"中断里、内核锁里、关中断里——这三处不换人。",
 exam:"2021 统考真题（四项全选）、2.2-13（新进程进就绪不是直接原因）、2.2-14。"},
{ch:"proc",name:"进程切换 vs 模式切换 vs 线程切换",def:"模式切换 = 用户态↔内核态，进程不变；进程切换 = 换 PCB、换地址空间；线程切换 = 同进程内换执行流，地址空间不变。",
 mix:"系统调用返回后往往还是原进程继续跑——发生了两次模式切换、零次进程切换。中断处理一定引起模式切换，但不一定引起进程切换；进程切换必伴随模式切换（反之不然）。开销由小到大：线程切换 < 进程切换；线程切换省的恰恰是页表基址寄存器那一项，因而 TLB 不用刷、Cache 命中率不掉——答简答题要答到这一层，只写「不用切换地址空间」拿不全分。",
 mem:"换衣服（模式）不等于换人（进程），同一家人换手（线程）最省事。",
 exam:"2.2-07/08、2.2-09（线程切换要更新哪些）、2023 真题（哪种操作导致内核态转用户态）。"},
{ch:"proc",name:"上下文切换要更新哪些寄存器",def:"判据只有一条：这个寄存器的内容属于某个进程/线程，还是全系统共用。属于个体的必须换，全局共用的不用换。",
 mix:"换进程时要更新：PC、通用寄存器、PSW、栈基址寄存器、页表基址寄存器、进程打开文件表。不用更新：内核中断向量表基址寄存器（全局共享、由内核统一维护）。换同进程内的线程时：PC、通用寄存器、栈基址寄存器要换；页表基址寄存器、打开文件表不用换。TLB 与 Cache 从不「保存」，切进程时直接置无效即可——它们是页表和主存的可再生副本。",
 mem:"个人物品带走，公共设施留下；TLB 是副本，丢了能再生。",
 exam:"2.2-09（书内）、2024（进程切换三项全要）、2025（中断向量表基址不用更新）三年连考同一张表。"},
{ch:"proc",name:"抢占式 vs 非抢占式",def:"非抢占：进程一旦上 CPU 就跑到结束或主动阻塞为止；抢占：更紧迫的进程到达时可以立刻夺走 CPU。",
 mix:"做题第一步是判抢占：题干出现「抢占式」「可抢占」「最短剩余时间优先」就要在每个新进程到达时重新比一次；否则一旦上 CPU 就跑到底。时间片轮转是绝对可抢占的——时间片一到无条件下来。抢占的两个代价：切换开销增大、可能让长进程更难完成；收益是响应及时、适合分时与实时。注意抢占只对 CPU 有效，正在传输的外设一般抢不走。",
 mem:"看到「抢占」两个字，就在时间轴上每个到达点画一条竖线。",
 exam:"2.2-23（绝对可抢占的是 RR）、2022 真题数调度次数、2023 真题算平均周转。"},
{ch:"proc",name:"FCFS / SJF / SRTN",def:"FCFS 比到达时刻；SJF 比服务时间（非抢占）；SRTN 比剩余时间（抢占）。",
 mix:"三条结论要背方向：FCFS 开销最小、绝不饥饿，但对短作业不利（短的排长的后面就得干等）；SJF 在所有进程同时到达时给出最小平均周转时间，但长作业可能饥饿；到达时刻不同时 SJF 未必最优，SRTN 更小。SJF 也可视为一种特殊的优先级调度（服务时间越短优先级越高），这就是它会饥饿的原因——排队分数永远不变。",
 mem:"先来先服务讲公平，短作业优先讲效率，抢占版更狠也更饿。",
 exam:"2017 真题（t=2 时 FCFS 选 J₁、SJF 选 J₃）、2.2-19/28/31/32/34。"},
{ch:"proc",name:"HRRN 响应比",def:"响应比 R =（等待时间 + 服务时间）÷ 服务时间 = 1 + 等待 ÷ 服务；每次调度前对所有就绪进程重算一遍，取最大者。",
 mix:"这个式子同时兼顾两头：服务时间相同则等得越久 R 越大（照顾长等待）、等待时间相同则作业越短 R 越大（照顾短作业），因此 HRRN 不会饥饿——这正是 2011 真题「满足短作业优先且不会饥饿」的唯一答案。响应比只在调度那一刻算，不是连续变化的量。例：8:00 到达、服务 1h、10:00 才开始执行 ⟹ R =（2+1)/1 = 3。它是非抢占算法，开销比 FCFS 大（每次要重算一轮）。",
 mem:"分子里有等待时间，所以等久了自己会翻身。",
 exam:"2009 真题（综合考虑等待与执行时间）、2011 真题（短作业优先且不饥饿）、2.2-21。"},
{ch:"proc",name:"RR 与时间片大小",def:"时间片轮转：所有就绪进程排成队列，队首上 CPU 跑一个时间片 q，用完无条件回队尾。",
 mix:"两个方向的退化：q 过大 ⟹ 退化为 FCFS；q 过小 ⟹ 切换开销占比暴涨。分时系统的响应时间约为 T ≈ q × N（N 为就绪进程数），反解得 q ≤ T/N。RR 不会饥饿（每轮都轮得到），对短作业不算特别有利但很公平。新到达的进程与用完时间片的进程都插入队尾，若两者同时发生，一般约定新到达者先入队。",
 mem:"轮一圈才轮到你：一圈 N 个人、每人 q 秒。",
 exam:"2024 真题（队尾进程 25ms、10 个进程、q=5 ⟹ 周转 250ms）、2017 真题（基于时间片的调度叙述）、2.2-25。"},
{ch:"proc",name:"多级反馈队列",def:"三条规则：新进程进第一级队列队尾；用完一个时间片没结束就降到下一级队列队尾（时间片通常翻倍）；只有上级队列全空才轮到下级，下级运行时上级来了新进程则被抢占。",
 mix:"降级降的是队列不是优先级数值，而且是降到队尾不是队首，漏掉「队尾」两个字多进程时顺序就全乱。它的最大优点是不需要预先知道进程的运行时间（这正是它比 SJF 实用的地方，错项常写成「需要预知运行时间」）。设计 MLFQ 需要考虑四项：队列数量、各队列的调度算法、各队列的时间片大小、进程升降级的条件。",
 mem:"新人从头等舱开始坐，坐不完就往后挪一节车厢。",
 exam:"2019 真题（二级、Q₂ 用短进程优先 ⟹ 平均等待 15ms）、2020 真题（设计要考虑哪些）、2.2-29/33。"},
{ch:"proc",name:"周转时间四个公式",def:"周转 = 完成时刻 − 到达时刻；带权周转 = 周转 ÷ 服务时间（恒 ≥ 1）；等待 = 周转 − 服务时间；含切换开销时每次切换在时间轴上插一段。",
 mix:"最常见的错是把周转算成「完成 − 开始」——等待的那一段必须算进去。带权周转对短作业最敏感（分母小），所以拿它衡量「短作业受不受委屈」。开销题最容易漏掉自己那一次：n 个进程跑完共发生 n 次切换，不是 n−1 次。2018 真题的算式模式值得背下来：某进程周转 = 它已等待的时间 + 前面所有进程的（开销 + 服务）+ 自己的（开销 + 服务）。",
 mem:"周转从「到达」算起，不是从「开始跑」算起。",
 exam:"2018 真题（平均 75μs）、2023 真题（平均 61ms）、2.2-26/28、综 04/08。"},
{ch:"proc",name:"饥饿 vs 死锁 vs 忙等",def:"饥饿 = 某进程长期得不到资源但系统仍在推进；死锁 = 一组进程互相等待、全都推进不了；忙等 = 拿不到锁就在原地空转，CPU 一直被占着。",
 mix:"判饥饿只需一问：这个进程的排队分数会不会随等待时间自动变好？会 ⟹ 不饥饿（FCFS、RR、HRRN、MLFQ 带老化）；不会 ⟹ 可能饥饿（SJF/SRTN、静态优先级）。死锁一定伴随饥饿，反之不然。资源剥夺法能解除死锁，但若某进程总被挑中当受害者就会造成饥饿——这正是「一直剥夺已阻塞进程资源」那道题的正解。忙等的问题是不满足让权等待，属于 2.3 的话题。",
 mem:"饥饿是一个人倒霉，死锁是一群人卡死，忙等是占着 CPU 干等。",
 exam:"2014 真题（不可能饥饿的是 RR）、2.2-35、2.4-06（剥夺导致饥饿）。"},
{ch:"proc",name:"I/O 型作业该给高优先级",def:"综合考虑 CPU 时间与 I/O 时间时，I/O 繁忙型作业应给更高的优先级。",
 mix:"理由是它很快就会主动让出 CPU 去做 I/O，早点放它走可以让 CPU 与外设同时忙，提高系统整体资源利用率；若让 CPU 型的先跑，外设就得干等一大段。反面是 FCFS 有利于 CPU 繁忙型、不利于 I/O 繁忙型。同一思路在 MLFQ 里体现为：I/O 型进程往往用不完时间片，因此能长期留在高优先级队列。",
 mem:"让爱跑腿的先出门，屋里屋外一起忙。",
 exam:"2013 统考真题（优先级设为 P₃ > P₂ > P₁）、2.2-10。"},
{ch:"proc",name:"调度算法特性总表",def:"从四个维度记：会不会饥饿、抢不抢占、开销大小、典型场景。",
 mix:"FCFS：不饥饿、非抢占、开销最小、对短作业不利。SJF/SRTN：会饥饿、SRTN 抢占、同时到达时平均周转最优。HRRN：不饥饿、非抢占、开销大（每次重算）。静态优先级：会饥饿、看题干、实时系统常用。RR：不饥饿、绝对可抢占、开销大、分时系统专用。MLFQ：基本不饥饿、抢占、不需预知运行时间、通用。多处理器调度额外要考虑负载平衡与处理器亲和性——「进程周转时间」是单处理器就有的目标，不算额外。",
 mem:"分数会自己长大的算法都不饿人。",
 exam:"2.2-12/23/30/31/34/35/36/43，一张表覆盖八道题。"},

{ch:"sync",name:"临界资源 vs 临界区",def:"临界资源是一次仅允许一个进程使用的资源；临界区是访问临界资源的那一段代码。",
 mix:"一个是资源、一个是代码，别混。临界资源举例：打印机、磁带机等独占设备，以及共享变量、栈、表格。可同时访问的：只读文件、用可重入代码编写的程序。若有 5 个进程都会访问同一个变量 A，则与 A 相关的临界区有 5 个（每个进程里各一段）。进入区、临界区、退出区、剩余区是一段代码的四个部分，锁在进入区加、在退出区放。",
 mem:"资源只有一个，临界区有几段就看几个进程碰它。",
 exam:"2.3-01/06/08/09/27；2.3-19/20（可重入代码是代码段/程序）。"},
{ch:"sync",name:"同步四准则",def:"空闲让进、忙则等待、有限等待、让权等待。",
 mix:"关键在地位不同：前三条是实现临界区互斥必须遵循的，让权等待不是必须的——Peterson 算法不满足让权等待却是正确的互斥算法（2020 真题正解是「仅前三条」）。各算法违反哪条：单标志法违反空闲让进（必须轮流）；双标志先检查违反忙则等待（会两人同进）；双标志后检查满足互斥但会活锁（都谦让）；Peterson 与 TSL 只差让权等待；TSL 还不保证有限等待（谁抢到看运气）。",
 mem:"空忙有让四字诀，前三必须、让权可选。",
 exam:"2020 统考真题、2016 真题（TSL 的两个不）、2.3-07。"},
{ch:"sync",name:"信号量的值代表什么",def:"S > 0 时 S 是当前可用的资源数；S ≤ 0 时 |S| 是阻塞队列里等待的进程数。",
 mix:"两条推论：P 先减后判，减完仍 ≥ 0 就不阻塞；V 先加后判，加完仍 ≤ 0 说明还有人在等、必须唤醒一个——所以「因 V 操作唤醒了别人」等价于「V 之前 S ≤ −1、V 之后 S ≤ 0」。三种算法：已知初值求当前值用 S = S₀ − P次数 + V次数；求取值范围用「上界 = 资源数、下界 = −(进程数 − 资源数)」；判断阻塞在哪个信号量上要看题问的是 mutex 还是 empty/full。",
 mem:"正数是货、负数是人；|负数| 就是排队的人头。",
 exam:"2010 真题（初值 3、当前 1 ⟹ 已分配 2 个且无人等待）、2.3-03/24/25/26/32/35。"},
{ch:"sync",name:"互斥信号量 vs 同步信号量",def:"互斥信号量把临界区锁起来，初值恒为 1；同步信号量表达「A 做完 B 才能做」，初值为 0（或初始可用的资源数）。",
 mix:"最好用的判别法：互斥量的 P 和 V 必在同一个进程里一前一后；同步量的 P 和 V 常常分处两个不同进程（一个发票、一个收票）。互斥信号量的初值与生产者数、消费者数、缓冲区大小全都无关——9 个生产者 6 个消费者容量 8 的题里 mutex 仍是 1，被数字唬住就上当了。计数信号量（初值 = 资源个数）是同步量的一种，用于「有限的多个同类资源」。",
 mem:"锁是自己拿自己还，票是别人发你收。",
 exam:"2.3-17/18/42；PV 大题的采分点之一就是信号量声明与含义。"},
{ch:"sync",name:"整型信号量 vs 记录型信号量",def:"整型信号量的 wait 用 while(S ≤ 0) 空转（忙等）；记录型信号量带一个等待队列，用 block 原语把自己挂起。",
 mix:"因此只有记录型信号量满足让权等待——2018 真题问「下列同步机制中可以实现让权等待的是」，Peterson、swap、TSL 全是忙等，正解是信号量。课本默认的 P/V 指记录型。要当心题目自己重新定义 P/V 的情况（2021 综合真题给的是整型信号量的功能描述），这时一律以题干定义为准，不能套课本结论。",
 mem:"整型的等法是站着干瞪眼，记录型的等法是躺下让出 CPU。",
 exam:"2018 统考真题（2.3-55）、2021 综合真题（2.3-综25）。"},
{ch:"sync",name:"P、V 操作与原子性",def:"P（wait）与 V（signal）是一对原语，执行过程不可被中断；P 可能阻塞自己，V 绝不阻塞自己、只可能唤醒别人。",
 mix:"为什么必须原子：P 里包含「减一 + 判断 + 可能阻塞」三步，若在减一与判断之间被切走，两个进程可能同时认为自己拿到了最后一个资源。实现原子性靠关中断或硬件指令。PV 只能加减 1 且不能读出当前值——所以凡是需要「读出数量再判断」的场合（如判断自己是不是第一个读者），必须另用普通整型变量加一把专属的 mutex。",
 mem:"P 是拿、V 是还；拿不到就睡，还完顺手叫醒一个。",
 exam:"2.3-12/13/23/30；读者-写者的 count 就是「信号量读不出值」的直接后果。"},
{ch:"sync",name:"软件互斥算法三代",def:"单标志法（turn 轮流）、双标志先检查、双标志后检查、Peterson 算法。",
 mix:"Peterson 是软件方案的终点，两个变量分工必须说清：flag[i] = true 表示「我想进」（表达意愿），turn = j 表示「让你先」（解决同时想进时的僵局）。把 turn 写成 turn = i（我先）就变成错误算法——2010 真题的填空考的就是这一格。Peterson 满足空闲让进、忙则等待、有限等待，唯独不满足让权等待。单标志法的毛病最典型：即使临界区空着，没轮到你也进不去。",
 mem:"先举手（flag）再谦让（turn），谦让的那句话是「你先」不是「我先」。",
 exam:"2010 统考真题（2.3-48）、2.3-36/37/38。"},
{ch:"sync",name:"硬件互斥：TSL / swap / 关中断",def:"TestAndSet 与 swap 由硬件保证「读 + 改 + 写」不可分割；关中断法直接屏蔽中断使自己不被切走。",
 mix:"关中断的两个硬伤：是特权指令（用户态用不了）、多处理器上无效（只关得住自己这颗核）。TSL 与 swap 适用于多处理器、实现简单，但都是忙等，且不保证有限等待（无法避免饥饿）。用 swap 实现互斥的标准写法里，key 必须是每个进程私有的局部变量，退出临界区时要把 lock 置回 false——2023 综合真题让你找学生代码的错误，先查这两处。",
 mem:"硬件方案买的是原子性，付的是忙等的电费。",
 exam:"2016 真题（TSL 机制的叙述）、2023 综合真题（swap 找错）、2.3-综08。"},
{ch:"sync",name:"互斥锁与自旋锁",def:"互斥锁提供 acquire/release 两个原子操作；实现上分自旋（忙等）与睡眠两类。",
 mix:"自旋锁在临界区很短、且多处理器的场合反而更划算——省下了两次上下文切换。但在单处理器上自旋锁毫无意义：持锁者被切走后，自旋者把整个时间片空转完也等不到锁。使用互斥锁最常见的死锁场景是「同一个进程对同一把锁连续 acquire 两次」，或两个进程以相反顺序获取两把锁。",
 mem:"临界区短就转两圈，临界区长就睡一觉。",
 exam:"2.3-21/22。"},
{ch:"sync",name:"管程与条件变量",def:"管程把共享数据结构、操作它的一组过程、初始化语句和一个名字打包，由编译器保证任一时刻只有一个进程在管程内。",
 mix:"管程的价值：互斥是免费的（编译器管），程序员只需处理同步。条件变量与信号量的四点不同：条件变量没有值、只是一个等待队列；x.wait() 调了就一定阻塞；x.wait() 会阻塞自己并释放管程使用权（2018 真题正解，否则谁也进不来救它）；x.signal() 若无人等待则什么也不做（V 一定加 1）。「管程内可以有多个进程」是错的，「等待队列里可以有多个进程」是对的——它们在管程外等。",
 mem:"管程是把 PV 封进一个类；条件变量是没有余额的信号量。",
 exam:"2018 真题（x.wait 做什么）、2016 真题（管程叙述的错项）、2.3-15/28/29。"},
{ch:"sync",name:"生产者-消费者骨架",def:"semaphore mutex = 1, empty = n, full = 0；生产者 P(empty)→P(mutex)→放→V(mutex)→V(full)；消费者 P(full)→P(mutex)→取→V(mutex)→V(empty)。",
 mix:"三个信号量各管一件事：empty 防写满、full 防读空、mutex 防两人同时改指针；缺 empty 会覆盖数据、缺 full 会取到空、缺 mutex 会指针错乱。V 的对象别写反：生产者结束 V(full)（我加了货），消费者结束 V(empty)（我腾了位）。缓冲区只有一个单元时可以省掉 mutex（empty/full 已经保证了互斥）。多生产者多消费者时骨架一字不改。",
 mem:"生产者先要空位、消费者先要货，然后才轮到抢锁。",
 exam:"2014 统考真题、2009 统考真题、2.3-39 至 2.3-43。"},
{ch:"sync",name:"P 的顺序为什么不能换",def:"同步信号量的 P 必须写在互斥信号量的 P 之前；V 的顺序则无所谓。",
 mix:"把 P(mutex) 提前会死锁：生产者拿着锁却发现没有空位，于是抱着锁睡着；消费者想取货腾位子，却拿不到锁——两边互相等。这是 PV 大题唯一的致命错误，也是所有 PV 综合题的第一个采分点。V 为什么可以随便：V 永远不阻塞，谁先谁后都能顺利执行完。不对称的根源就在这里：P 会睡、V 不会。",
 mem:"先看有没有位子，再去抢门票；抱着锁睡觉是最惨的死法。",
 exam:"2013 真题（博物馆：P(empty) 必须在 P(mutex) 前）、几乎每道 PV 大题的必查项。"},
{ch:"sync",name:"生产者-消费者的四种变体",def:"多生产者多消费者、一次连取 k 件、缓冲区按类别分流、放入的是成套的东西。",
 mix:"一次连取 k 件：把 P(mutex) 提到 for 循环外面，否则取到一半被别人插队（2014 真题的全部难度）。按奇偶或类别分流：把 full 拆成 full_odd 与 full_even，empty 与 mutex 仍共用（2009 真题）。成套产品（车架+车轮、苹果+橘子）：每种产品一个 full、empty 共用；若还有「箱内不能只剩一种」这类约束要另加计数信号量。判据：题干出现「连续」「一次性」「一组」，先想锁的粒度要放大。",
 mem:"要连着做的事，锁就要圈得大一点。",
 exam:"2014 统考真题（综 20）、2009 统考真题（综 17）、2.3-综09/10/16。"},
{ch:"sync",name:"读者-写者：计数 + 双锁",def:"semaphore rw = 1, mutex = 1; int count = 0；第一个读者负责 P(rw) 上大门锁，最后一个读者负责 V(rw) 开锁，中间的读者直接进；写者只 P(rw)。",
 mix:"两把锁分工不能错：rw 保护被读写的资源（读者群体整体只占用它一次），mutex 保护计数器 count——没有它，两个读者同时 ++count 会双双认为自己不是第一个，于是谁也不去 P(rw)。判断与加锁必须在同一个 mutex 保护下完成，这是「检查-然后-动作」竞态的教科书案例。上面的模板是读者优先（写者可能饿死）；再套一个最外层信号量 w（读者写者都先 P(w)）就变成写者优先/公平版。",
 mem:"第一个进的人锁门，最后一个出的人开门；数人头这件事本身也要上锁。",
 exam:"2.3-44；双向过桥、录像厅、博物馆同向问题全是它的变体。"},
{ch:"sync",name:"哲学家就餐与四种破法",def:"五位哲学家各先拿左筷再拿右筷时，全体同时拿起左筷就形成环，死锁。",
 mix:"三种考过的破法：限制人数（至多 n−1 人同时去拿筷子，5 人时 seat 初值最大取 4）、奇偶分流（奇数号先拿左、偶数号先拿右）、一次拿两根（把取左取右放进一个互斥段，要么都拿到要么都不拿，破的是请求并保持）。2019 真题在此基础上加了 m 个碗：bowl 初值 = min{n−1, m}，且 P(bowl) 必须写在拿筷子之前——两个约束取更严的那个，只写 m 或只写 n−1 都只能拿一半分。放筷子时不需要任何判断，直接 V 两下。",
 mem:"少放一个人进屋，或者让一个人反着拿，环就断了。",
 exam:"2019 统考真题（综 23）、2.3-45（seat 最大取 4）、2.4-14/15（左右撇子并存不死锁）。"},
{ch:"sync",name:"前驱图型 PV",def:"图上有几条弧就设几个信号量、初值一律为 0；每个结点把所有入边的 P 写在动作前、所有出边的 V 写在动作后。",
 mix:"验收方法：数一遍「P 的总数 = V 的总数 = 边数」，对上就一定不会错。两个易错点：一是别偷懒合并信号量——某结点有两条入边就必须两个信号量，用一个 V 两次会在「A 连做两次而 B 一次没做」时错误放行；二是线程版要先把「同一线程内部的边」划掉（顺序执行天然保证），只有跨线程的边才需要信号量。",
 mem:"一条边一张票，进门交票、出门发票。",
 exam:"2020 统考真题（A,B→C；C,D→E）、2022 统考真题（两线程六操作）、2.3-综06/14/29。"},
{ch:"sync",name:"并发执行结果的不确定性",def:"高级语言的一条 x = x + 1 实际是「load → add → store」三条指令，竞态发生在读与写之间被别人插了一脚。",
 mix:"问可能的结果有哪些：看谁最后 store——最终值 = 最后写回者当初读到的值经它修改后的结果。问有几种序列能得到正确结果：正确值通常只在完全不交错时出现，n 个线程即 n! 种。2016 真题的题眼是「不同进程的同名变量互不影响」——P₁ 的 x 与 P₂ 的 x 是两个地址，根本不存在竞态；只有同一进程内两个线程对同一变量的写才需要互斥，局部变量不用、读读之间也不用。",
 mem:"拆成读-改-写三步，再想「谁最后写回」。",
 exam:"2011（x 可取 0/1/2）、2018（使 x=2 的序列有 2 种）、2016（哪些操作需互斥）、2.3-33/46。"},
{ch:"sync",name:"死锁的定义与四个必要条件",def:"死锁是多个进程因竞争资源而造成的一种互相等待、若无外力都无法推进的僵局。四个必要条件：互斥、请求并保持（占有且等待）、不可剥夺、循环等待。",
 mix:"「必要条件」意味着四条同时成立才可能死锁，但成立也不一定死锁——尤其是循环等待：多实例资源下出现环也未必死锁。四条里互斥是唯一无法破坏的（打印机就是不能两人同时用）。产生死锁的两大原因：系统资源竞争 + 进程推进顺序非法（不合适的 PV 顺序也算，PV 写反了就是典型的死锁制造机）。",
 mem:"互斥破不了，其余三条各有破法。",
 exam:"2.4-02/03/04/05；2.3 的 PV 顺序错误就是它的代码版。"},
{ch:"sync",name:"死锁预防：四条件各自的破法",def:"破互斥（不可行）、破请求并保持（一次性申请全部资源）、破不可剥夺（申请不到就释放已占有的）、破循环等待（顺序资源分配法）。",
 mix:"一次性分配所有资源破的是请求并保持（不是互斥、不是循环等待），代价是资源利用率极低、可能饥饿。顺序资源分配法要求进程按编号递增顺序申请资源，代价是编号一旦定死就限制了新设备的加入、也不便于用户编程。破不可剥夺的代价是前面的工作可能作废、实现复杂，一般只用于状态易保存恢复的资源（CPU、内存），打印机这类不适用。",
 mem:"预防是事前立规矩，规矩越硬利用率越低。",
 exam:"2.4-09（一次分配破的是占有并请求）、2.4-11/12/13；2015 真题提醒「顺序资源分配法属预防不属避免」。"},
{ch:"sync",name:"安全状态与安全序列",def:"安全状态 = 存在一个进程推进序列，使每个进程都能依次拿到所需资源并运行完；这样的序列称为安全序列。",
 mix:"三者的圈层关系必须记牢方向：安全 ⟹ 一定不死锁 ✓；死锁 ⟹ 一定不安全 ✓；不安全 ⟹ 一定死锁 ✗（只是可能）；不死锁 ⟹ 一定安全 ✗。也就是说不安全状态里还有一片「暂时没死但可能死」的区域。安全序列往往不唯一，但也可能一个都没有——2011 真题的正解偏偏是「不存在」，四个选项里三个具体序列时更要老实算。",
 mem:"安全是一定不死，不安全只是可能死。",
 exam:"2013 真题（安全状态一定无死锁）、2.4-17、2011 真题（安全序列不存在）。"},
{ch:"sync",name:"银行家算法四步",def:"处理一次资源请求：① Request ≤ Need？否则出错 ② Request ≤ Available？否则让它等待 ③ 试探性分配 ④ 跑安全性算法，安全就真分配、不安全就撤销试分配并让它等。",
 mix:"第 ② 步是最常被漏掉的采分点：Request > Available 时进程直接等待，压根不必再做安全性检查。银行家算法属于死锁避免，它一条必要条件都不破坏，只是不让系统进入不安全状态；说它「预防死锁」或「破坏了请求并保持」都是错的（2013 真题四个选项就是这四个角）。它的前提是进程必须事先声明各类资源的最大需求量。",
 mem:"先问超不超需求，再问够不够分，最后问分完还安不安全。",
 exam:"2013 统考真题、2.4-18/19；综合题要求写完整步骤时漏掉第 ② 步就丢分。"},
{ch:"sync",name:"安全性算法：Work += Allocation",def:"令 Work = Available，反复找一个 Need ≤ Work 的进程，标记完成并执行 Work += Allocation；全部完成则安全。",
 mix:"归还的是 Allocation（它现在手里拿着的），不是 Max、也不是 Need——2018 真题的 A/C 之争全在这里：4 个资源，三进程需求 4/3/1、已占 2/1/0 ⟹ Available = 1、Need = 2/2/1，只有 P₃ 能跑，但 P₃ 归还的 Allocation = 0，Work 仍是 1，P₁、P₂ 全卡住 ⟹ 不安全。考场提速用集合推进法：只要还有得选，选谁都不影响「是否安全」的结论，不必逐个试排列。选择题给四个候选序列时更快——只验证第一个进程能不能启动，往往一步定答案。",
 mem:"它还回来的是手上的，不是它想要的。",
 exam:"2018 真题（不安全）、2011/2012/2020/2022 四道真题、2.4-综03/04/05。"},
{ch:"sync",name:"死锁公式 m > n(k−1)",def:"n 个进程、每个最多需要 k 个同类资源时，系统必不死锁的充分条件是 m > n(k−1)，即 m ≥ n(k−1)+1。",
 mix:"推导：最坏情况是每人都拿到 k−1 个（差一个就能干完）共占 n(k−1) 个，只要还多出 1 个就能塞给任一进程让它跑完并归还全部资源，雪崩式解开。各进程需求不同时改成求和式 Σkᵢ < m + n（2.4-31 的正解就是「小于 m+n」）。三道真题全部死在「严格大于」上：m = n(k−1) 时恰好死锁。看清问的是资源最少还是进程最多——同一条不等式，解的方向相反。公式的前提是同类资源、一次申请一个、用完全部释放；多类资源必须改用银行家算法。",
 mem:"人人差一个的时候最危险，再多给一个就全活了。",
 exam:"2009（8 台打印机 ⟹ K=3）、2014（三进程需 3/4/5 ⟹ n=10）、2021（各需 2 ⟹ m=n+1）、2.4-27/28/29/30/31。"},
{ch:"sync",name:"资源分配图与死锁定理",def:"单实例资源：有环 ⟺ 死锁。多实例资源：有环只是可能死锁，要看资源分配图能否完全简化；不可完全简化即死锁（死锁定理）。",
 mix:"化简就是反复找一个「请求边都能被满足」的进程，把它的边全部擦掉（它能跑完并归还）；化简顺序不影响结论，放心从最容易满足的开始。死锁定理属于检测手段，不是预防也不是避免。求死锁进程数下界的通法（2016 真题）：把「谁要哪些资源」写成集合两两求交，交集大小 ≥ 2 才可能出现二元环，否则最小环长是 3；问「至少」就要构造被卡住的人最少的场景，环外能先跑完的进程不算。",
 mem:"能擦干净就没死锁；两个人成环得共享两类资源。",
 exam:"2016 统考真题（死锁进程数至少 3）、2.4-20/21/22/23/32。"},
{ch:"sync",name:"死锁检测与解除",def:"检测：定期运行死锁检测算法（资源分配图化简）；解除：资源剥夺法、撤销进程法、进程回退法。",
 mix:"2015 真题的三点辨析：采用检测法的系统允许死锁发生，因此必须配套剥夺或回退才能解除；采用避免法（银行家）的系统不会进入不安全状态，因而不需要检测。撤销进程法代价最大（前面的工作全废），进程回退法要求系统记录历史信息、设置还原点。解除死锁不采用的方法通常是「立即释放全部资源给最后一个进程」这类张冠李戴的选项。剥夺资源若总挑同一个受害者会造成饥饿。",
 mem:"死了再救的前提是你手里得有剥夺权。",
 exam:"2015 统考真题、2019 统考真题、2.4-24/25/26。"},
{ch:"sync",name:"预防 · 避免 · 检测三策略对比",def:"预防在分配前就定死规则（破坏四条件之一）；避免在每次分配前算一次安全性；检测+解除等死了再处理。",
 mix:"三者的代价：预防的资源利用率最低、并发度最差；避免要求预知最大需求、每次分配都有计算开销；检测要求能剥夺或回滚。判断题的常见错法：把银行家算法说成预防（它是避免）、把顺序资源分配法说成避免（它是预防）、说「不安全状态一定死锁」（只是可能）。还有一类是「鸵鸟策略」——直接忽略死锁，实际系统（如通用 OS）大多这么干。",
 mem:"事前立规矩、事中算一算、事后收尸；越靠前越保守。",
 exam:"2013、2015、2019 三年真题；2.4-16/37/39/42。"},

{ch:"mem",name:"内存管理的五个功能",def:"分配与回收、地址转换、空间扩充（虚存）、内存共享、存储保护。",
 mix:"五条不是并列的，是一条时间线：单一连续只有①；固定/动态分区有①⑤；基本分页/分段有①②④⑤但仍要求一次性全装入；只有请求分页（3.2）五条全有。由此可直接推出「虚拟内存必须建立在离散分配基础上」——连续分配根本走不到第三步。",
 mem:"能不能「用一点装一点」，是分页与请求分页的唯一分界。",
 exam:"「某方式不具备下列哪个能力」这类题的底表。"},

{ch:"mem",name:"三种装入方式",def:"绝对装入（单道，编译时定址，逻辑=物理）；可重定位装入＝静态重定位（装入时一次改完，运行期不能移动）；动态运行时装入＝动态重定位（执行时才转换，靠重定位寄存器）。",
 mix:"静态重定位的三条限制各堵死一条路：不能移动⟹不能紧凑、不能对换；必须一次拿全内存⟹不能虚存；不能动态申请⟹不能扩堆。动态重定位＝组原 ch4 的基址寻址（EA=(BR)+A），组原原话「面向操作系统，用于程序的浮动装入」。",
 mem:"静态把地址钉进指令里，动态把地址留在寄存器里；钉死的搬不动。",
 exam:"2011 真题（编译链接装入的工作内容）；「紧凑的前提是什么」答动态重定位。"},

{ch:"mem",name:"三种链接方式",def:"静态链接（运行前拼成一个装入模块）；装入时动态链接（边装边链）；运行时动态链接（调用时才装入并链接）。",
 mix:"优点别张冠李戴：装入时动态链接＝便于修改更新 + 便于共享目标模块；运行时动态链接＝加快装入 + 节省内存（用不到的不装）。静态链接做两件事：地址调整（模块 A 长 L，则 B 内所有地址加 L）与外部符号解析（CALL B 里的 B 换成 L）。",
 mem:"装入时是「整批进场，谁改换谁」；运行时是「用到才叫，不用不进场」。",
 exam:"2011 真题；与组原 ch4 4.3「链接器解析符号 + 重定位」是同一段话。"},

{ch:"mem",name:"内存保护：先比后加",def:"重定位寄存器（＝基址）用于「加」，界地址寄存器（＝限长）用于「比」；顺序是先比后加，比较由硬件自动完成。",
 mix:"两个寄存器的装载必须用特权指令，只有内核能做——这是 2009 真题与「内存保护可以仅靠软件实现」这一错项的落点。另一种方法是 CPU 中设一对上、下限寄存器。判据同 ch1 的硬件/OS 分工：每次访存都要做的事归硬件，设置策略归 OS。",
 mem:"查由硬件做（要快），设由内核做（要安全）。",
 exam:"2009 真题（分区分配的内存保护措施）；3.1-02 的 B 项。"},

{ch:"mem",name:"内存共享与可重入代码",def:"只有只读区域可共享；可重入代码（纯代码）允许多进程同时访问但不允许任何进程修改，每个进程需配私有数据区。",
 mix:"书上算例：40 用户、编辑程序 160KB 代码 + 40KB 数据。不共享 (160+40)×40 = 8000KB；共享后 160 + 40×40 = 1760KB，省 6240KB。分页共享要在每个进程页表里建 40 个页表项（4KB/页），分段只要 1 个段表项——「40 vs 1」就是分段共享方便的全部依据。",
 mem:"代码共用一份，数据各存一份。",
 exam:"2019、2023 两年考「页、段共享的原理和特点」。"},

{ch:"mem",name:"内碎片 vs 外碎片：判据只有一条",def:"分配单元「大小固定」就有内部碎片，「大小按需」就有外部碎片。内碎片长在已分配区域之内，外碎片长在已分配区域之间。",
 mix:"单一连续/固定分区/分页＝内碎片；动态分区/分段＝外碎片。分页平均内碎片 = 每进程半页（n 个进程共浪费 n×页面大小÷2）。紧凑只能治外碎片，且必须以动态重定位为前提。经典画面：图 3.5 最后一张 6+6+4=16MB 空闲却装不下 14MB 的进程。",
 mem:"内碎片是自己浪费的，外碎片是大家一起浪费的。",
 exam:"「哪种方式会产生外部碎片」年年出现；3.3 疑难点表的第四行。"},

{ch:"mem",name:"四种适应算法",def:"首次适应（地址递增，取第一个满足的）、邻近适应（从上次位置继续找）、最佳适应（容量递增，取最小够用块）、最坏适应（容量递减，取最大块）。",
 mix:"考的是过程不是特点：先按算法重排链表，再逐个请求划掉写剩余。书上结论——首次适应综合最优（查找简单、回收无须重排、保留高地址大空闲区）；最佳适应剩下一地极小碎块，实际较差；邻近适应把高地址大块也切碎，通常比首次适应更差。回收后是否重排随算法而变：地址序不用，容量序必须。",
 mem:"名字带「最佳」的反而不最佳。",
 exam:"2010（最佳适应过程）、2019、2024（各算法特点）；3.1-07 要先把内存布局图上所有分界线抄成表。"},

{ch:"mem",name:"动态分区回收四情形",def:"与前邻：合并并更新前一分区的大小；与后邻：更新起始地址和大小；前后都邻：更新前一分区大小并删除后一分区表项；都不邻：新建表项。",
 mix:"差别不在合不合并，而在改哪个字段：向前合并起址没变（只改大小），向后合并这块从更靠前处开始（必须改起址）。表项数：前邻/后邻不变、全邻减 1、不邻加 1。2017 真题的干扰项就是「只合并、漏了按容量重排链表」。固定分区回收只需改状态位、不涉及合并。",
 mem:"向前合并不改址，向后合并要改址；三合一删表项，孤零零建表项。",
 exam:"2017 真题（动态分区分配的内存回收方法）。"},

{ch:"mem",name:"伙伴系统",def:"所有分区大小均为 2ᵏ；每个分区有唯一的伙伴——与它大小相同、地址相邻且由同一父块二分而来的那一半。",
 mix:"判据：地址除以块大小得编号，编号成对（2i 与 2i+1）才是伙伴。起址 0 与 64 的两个 64B 块是伙伴（编号 0、1）；起址 64 与 128 的不是（编号 1、2 跨对了）。分配是「化整为零」会产生外部碎片，回收则不断向上合并直至无法合并。结构上是完全二叉树，等价于数构「结点 i 的兄弟是 i 异或 1」。",
 mem:"伙伴不只是邻居，还必须是同一个父块劈开的那两半。",
 exam:"2024 真题（伙伴关系的概念）；3.2.6 的 Linux 页框回收再考一次。"},

{ch:"mem",name:"分页的地址结构：三步切位",def:"① 偏移位数 = log₂(页面大小)　② 页号位数 = 逻辑地址位数 − 偏移位数　③ 页面数（页表项数）= 2^页号位数。",
 mix:"第③步是翻车重灾区：页表项「数量」由虚拟地址决定，页表项「宽度」才由物理地址决定，题目常给物理地址位数当干扰（2019 选 19）。页面大小必须取 2 的幂，否则求页号要做真除法——凡给了非 2 的幂的页面大小，一定是在考概念不是考计算。分页地址是一维的（一个整数即可定位）。",
 mem:"先切偏移，剩下的全是页号。",
 exam:"2009、2010、2013、2015、2017、2024 六年连考。"},

{ch:"mem",name:"页表项：存什么、多宽、第 K 项在哪",def:"页表项存物理块号 + 状态位；页号作为数组下标是隐含的，不存储。第 K 项地址 = 页表始址 F + K × 页表项长度。",
 mix:"32 位、页 4KB ⟹ 2²⁰ 个页框 ⟹ 页框号 20 位 ⟹ 至少 3B，实际取 4B（对齐 + 预留有效位/访问位/修改位）；4KB/4B = 1024 项/页，这就是多级页表的分母。三个「长度」别混：页表长度＝项数（用于越界判断）、页表项长度＝字节数（用于算项地址）、页表大小＝两者相乘。",
 mem:"页号不存，因为它就是下标。",
 exam:"2024 真题（页表项地址的计算与分析）。"},

{ch:"mem",name:"基本地址变换四步",def:"① P=⌊A/L⌋、W=A mod L　② 若 P ≥ 页表长度 M 则越界中断　③ 页表项地址 = F + P×项长，取块号 b　④ 物理地址 E = b×L + W。",
 mix:"全章第一大失分点：E = b×L + W，不是 b + W——块号是「第几块」不是「第几个字节」。但若地址以十六进制给出，一次乘法都别做：画竖线切开低位偏移，把高位页号换成块号直接拼接（0A6FH、页 1KB ⟹ 页号 2、块号 11 ⟹ 2E6FH）。分段则相反：段表存的本来就是字节地址，E = 基址 + 偏移。",
 mem:"算完自检：E 是否落在 [b×L, (b+1)×L) 里。",
 exam:"2013、2021、2024（页式地址变换过程）。"},

{ch:"mem",name:"快表 TLB 与访存次数",def:"TLB 是能并行比较的高速缓存，存「完整虚页号 → 页框号」；命中 1 次访存，未命中 2 次（多级页表 n+1 次）。",
 mix:"访存次数总表：基本分页 2/1、两级页表 3/1、n 级 n+1/1、基本分段 2/1、段页式 3/1（斜杠后为快表命中）。「多级页表命中快表也只要 1 次」是最易想歪的一条（书上综 07 专门加了注意框）——快表不会因为页表分级而分级。EAT = 命中率×(查TLB+1 次访存) + (1−命中率)×(查TLB+查页表+1 次访存)。TLB 未命中不产生任何中断，只是慢一点。",
 mem:"快表命中一律 1 次访存，与几级页表无关。",
 exam:"2009（快表性能分析）；2014 选 14：0.75×1+0.25×3 = 1.5 次。"},

{ch:"mem",name:"多级页表：级数公式与代价",def:"级数 = ⌈(虚拟地址位数 − 页内偏移位数) ÷ log₂(每页能装的页表项数)⌉；根本目的是按需分配页表页，避免为未使用的地址空间预留页表项。",
 mix:"32 位/4KB/4B ⟹ 2 级；48 位/4KB/8B ⟹ 4 级；64 位/4KB/4B ⟹ 6 级（故实际系统把虚地址限为 48 位）。省内存是有条件的：稀疏时 4MB → 8KB，用满时反而多一页；但它任何时候都解决了「页表必须连续存放」这个硬约束。代价是无快表时访存次数升到 n+1。页目录基址寄存器里装的是顶级页表的物理起始地址，进程切换时由 OS 重装（平时存在 PCB）。",
 mem:"分母是「一页能装几个页表项」，分子用虚拟地址位数。",
 exam:"2014（多级页表特点）、2010/2013/2015/2017—2019（地址结构）、2018/2021（基址寄存器内容）。"},

{ch:"mem",name:"分段：二维地址与两次越界",def:"段号 S + 段内偏移 W，两者必须由用户显式提供（编译程序代劳）；段表项存段长 C 与基址 b；先判 S ≥ 段表长度，再判 W ≥ C。",
 mix:"分段要两次越界检查的根源是段长不固定，而这又源于「段是按用户逻辑划分的」——一条链推到底：用户需求 → 段长不定 → 段表要存段长 → 段表项更胖（32 位系统约 6B）→ 多一次比较。一维 vs 二维的判据：能不能只给一个整数就唯一确定位置（页号加 1 等于地址加一个页面大小，段号加 1 不等于加固定值）。",
 mem:"页是给系统用的，段是给用户用的。",
 exam:"2009（分段逻辑地址结构）、2016（段式地址变换过程）。"},

{ch:"mem",name:"段的共享与保护",def:"共享段表记段号、段长、内存起址、存在位、外存起址与共享进程计数 count；count 减到 0 才回收该段内存。同一共享段在不同进程中可以有不同的段号。",
 mix:"保护分两类：地址越界保护（两次比较）与存取控制保护（段表项里的访问权限位）。分页也能共享，只是要建 N 个页表项——「分页无法共享」一律错。书上脚注：2019 年真题考的是「在每个进程段表中设段表项」这一旧方法。count 这个引用计数在 OS ch4 的硬链接里原样重现。",
 mem:"多人共用一份实体，靠计数决定何时销毁。",
 exam:"2019、2023（页、段共享的原理和特点）。"},

{ch:"mem",name:"段页式：一张段表 + 多张页表",def:"逻辑地址 = 段号 S | 页号 P | 页内偏移 W；每个进程仅有一张段表，但可能有多张页表（每段一张）；无快表时每次访存需三次访存。",
 mix:"段页式的段表项里没有段长和基址——段长的位置换成「页表长度」，基址换成「页表始址」，凡是选项写「段页式段表项含段的基址」一律错。对用户而言仍按段组织、分页完全透明，所以地址空间是二维的。段表寄存器既用于段表寻址，也用于段号越界检查。",
 mem:"先查段表拿页表地址，再查页表拿块号，最后拼偏移。",
 exam:"三种方式对照题的第三列；只考「几次访存 / 几张表 / 几维」。"},

{ch:"mem",name:"分页 vs 分段（3.3 疑难点表 3.6）",def:"四个维度：目的（系统需要 vs 用户需要）、长度（固定由系统定 vs 不固定由程序逻辑定）、地址空间（一维 vs 二维）、碎片（内部无外部 vs 外部无内部）。",
 mix:"四个维度是一条因果链：目的（给谁用）⟹ 长度（谁定大小）⟹ 维数 ⟹ 碎片。只要记住第一格，后三格都能推出来。书上没并进表、但同样常考的两个维度：越界检查次数（1 次 vs 2 次）、共享一段代码需要的表项数（N 个页表项 vs 1 个段表项）。相似之处：内存中都不连续、都有地址变换机构。",
 mem:"一个根推出六条区别，别死背表。",
 exam:"本章唯一的「疑难点」，整表建议默写一遍。"},

{ch:"vm",name:"虚存打破的两个特征",def:"传统存储管理的两个共同特征：一次性（必须全部装入才能运行）与驻留性（装入后一直驻留）。虚存用请求调页破前者、用页面置换破后者。",
 mix:"两把锁各配一把钥匙，正好对应虚存的两个手段特征：请求调页 ⟹ 多次性；页面置换 ⟹ 对换性。二者合起来才产生虚拟性（本质特征和根本目标）。虚存必须建立在离散分配基础上，可用请求分页、请求分段或请求段页式实现——「虚存只能基于分页」是错的。四类硬件支持：足够的内外存、页表机制、中断机构、地址变换机构。",
 mem:"多次性 + 对换性 ⟹ 虚拟性。",
 exam:"2012（虚拟存储器的特点）；「一次性是虚存特征」是经典错项。"},

{ch:"vm",name:"虚存的四个必错说法",def:"①「扩充了内存或外存容量」错——并未扩充任何物理容量，只是相对地扩充主存（逻辑空间）；②「仅靠软件即可实现」错——必须有硬件支持；③「容量由磁盘容量决定」错——最大容量由虚拟地址位数决定；④「一次性是虚存特征」错。",
 mix:"全章第三条分界线：最大容量由地址位数画死（32 位 ⟹ 4GB，2012 选 45），实际可用容量受内存与外存容量之和限制（2023 选 58）。两句都对，考的是看清问的是哪一个。另外：虚存的「虚拟」指它并非真实存在的物理实体，是 OS 通过部分装入、请求调页与置换构造的逻辑抽象。",
 mem:"上限由地址位数画死，实际由内外存之和兜底。",
 exam:"2012、2023 两年正反各考一次。"},

{ch:"vm",name:"局部性原理",def:"时间局部性——被访问过的还会再被访问（源于循环）；空间局部性——被访问单元附近的还会被访问（源于指令顺序存放、数组连续存放）。",
 mix:"它是 408 最大的跨科枢纽：组原 Cache（两者都要）、本章快表（时间）、本章预调页与工作集（两者）、OS ch5 磁盘预读（空间）、数构外部排序与 B+ 树（空间）。2012 真题问的是「时间」局部性；而 3.2.8「按行存储就按行访问」考的是「空间」局部性，两者别答反。",
 mem:"刚用过的还会用（时间），旁边的也会用（空间）。",
 exam:"2012 真题；虚存与 Cache 能成立的唯一依据。"},

{ch:"vm",name:"请求分页的页表项四个新字段",def:"状态位 P（是否已调入，供判断是否缺页）、访问字段 A（供置换算法参考）、修改位 M（脏位，决定换出时是否写回）、外存地址（调页时去哪读）。",
 mix:"谁置位是考点：A 与 M 由硬件在每次访存/写时自动置 1；清零 A、选淘汰页、启动磁盘 I/O 由 OS 做。总纲——每次访存都要做的事归硬件，偶尔做一次的策略归 OS。最易错的一处：存在位为 0 时页表项里的块号是无意义的旧值，绝不能拿来拼地址（3.2-55 的干扰项 B）。这四位与组原 Cache 行的有效位/脏位/替换位一一对应。",
 mem:"拿到页表先看存在位，这个动作要变成条件反射。",
 exam:"3.2-24（合法位决定是否发生页面故障）、3.2-55。"},

{ch:"vm",name:"缺页中断的两个特点",def:"① 在指令执行期间触发（不是执行完之后）；② 一条指令可能引发多次缺页——copy A to B 若指令与两个操作数各跨两页，最多 6 次。",
 mix:"缺页属于异常（内中断），返回时重新执行原指令（回 i），不是执行下一条——这与 ch1「中断回 i+1 vs 异常回 i」是同一把刀。进程状态：触发缺页 ⟹ 运行转阻塞（等磁盘 I/O），调入完成 ⟹ 阻塞转就绪（不是直接回运行态，2023 考过）。同一个「6」在 3.2.3 是最小页框数的下限，在这里是缺页次数的上限——一个算例的两面。",
 mem:"异常是「这条指令没干成」，所以要重来。",
 exam:"2011、2013、2014、2020、2022（缺页处理）；2023（进程状态变化）。"},

{ch:"vm",name:"最小页框数",def:"能保证进程正常运行所需的最少页框数，与硬件结构有关，取决于指令的格式、功能和寻址方式。单地址指令+直接寻址 ⟹ 2 个；支持间接寻址 ⟹ 3 个；指令与两个操作数各跨两页 ⟹ 6 个。",
 mix:"通式：1（放指令）+ 该寻址方式访问操作数所需的存储单元数 + 跨页数。所以支持二次间址的机器最少需要 4 个页框（书上没给，从组原 ch4 的寻址方式推出）。这正是 2025 年那道真题的考法。",
 mem:"数一数这条指令最坏情况会碰几个不同的页面。",
 exam:"2025 真题（最小物理块数的确定原则）；直连组原 ch4 4.2 寻址方式。"},

{ch:"vm",name:"三种可行的分配策略",def:"固定分配局部置换、可变分配全局置换、可变分配局部置换。不存在「固定分配全局置换」——抢了别人的页框自己的页框数就变了，与「固定」矛盾。",
 mix:"两个问题定位：Q1 页框数会不会变？不变 ⟹ 固定分配（必然局部置换）。Q2 换出的页可否是别人的？可以 ⟹ 全局置换（必然可变分配）。三种典型故障：固定＝僵（分少了一直抖、分多了一直浪费）、可变全局＝乱（活跃进程驻留集无限膨胀挤死别人）、可变局部＝贵但对（用缺页率反馈动态增减驻留集）。王道专门警告过：2015 年考的就是这三个名字。",
 mem:"固定＝僵，全局＝乱，可变局部＝贵但对。",
 exam:"2015 真题（页面分配与置换策略的名称）。"},

{ch:"vm",name:"调页时机与从何处调入",def:"预调页（运行前一次调若干相邻页，预测成功率约 50%，主要用于首次调入）；请求调页（运行中缺页才调，当前虚存大多采用）。外存分文件区（离散分配）与对换区（连续分配），对换区 I/O 更快。",
 mix:"三种情况：①对换区充足 ⟹ 运行前把文件从文件区复制到对换区，全部从对换区调入；②对换区不足 ⟹ 不会被修改的页直接从文件区调入（换出时无须写回），可能被修改的换出到对换区；③UNIX 方式 ⟹ 未运行过的从文件区调入，被换出过的从对换区调入，已在内存的共享页可直接复用。对换区更快的原因来自 ch4/ch5：连续分配 ⟹ 寻道少。",
 mem:"预调页在运行前，请求调页在运行中。",
 exam:"「从何处调入」的三种情况是选择题素材；「不会被修改的页无须写回」是修改位 M 的第一次实战。"},

{ch:"vm",name:"置换题三规矩",def:"① 前 m 次缺页是装入空页框、不算置换；② 命中时 FIFO 队列不动、LRU 必须把该页移到最新；③ 逐列写，命中就照抄上一列。",
 mix:"全章第一条分界线：缺页次数与置换次数相差正好 m（驻留集被填满过的前提下）。教材主例（m=3，20 次访问）：OPT 9/6、LRU 12/9（书上未给总数，为复算补出）、FIFO 15/12。两条秒杀下界：缺页次数 ≥ 不同页号数 n；若 m ≥ n 则缺页次数恰好 = n，连表都不用画。综合题只给数字不给分，必须画表并标出哪几列缺页。",
 mem:"缺页 − 置换 = 页框数 m。",
 exam:"2019 选 53 问的是置换次数（答 5）不是缺页次数（9）。"},

{ch:"vm",name:"OPT 向右看，LRU 向左看",def:"OPT 淘汰将来最久不用的（不可实现，用作理论下界）；LRU 淘汰最近最久未使用的；FIFO 淘汰最早进入的。",
 mix:"手法只差方向：OPT 向右找每页第一次出现取最大（永不再现的直接判最大）；LRU 从当前位置往左倒扫，最后被扫到的那个就淘汰它（不用维护时间戳）。LRU 是「向后看」、OPT 是「向前看」，书上明说过去与未来的走向并无必然联系。四算法性能：OPT 最好但不可实现、FIFO 简单但差、LRU 接近 OPT 但实现开销大（纯软件 O(n) 遍历，硬件是为降低该开销而引入的手段，因果别倒）。",
 mem:"OPT 往右数，LRU 往左数。",
 exam:"2009、2015、2019、2025（LRU 应用分析）；2010（FIFO）。"},

{ch:"vm",name:"Belady 异常的两种问法",def:"「哪种算法可能出现 Belady」答 FIFO；「FIFO 下页帧增加缺页数会怎样」答可能增也可能减（反例 1,2,3,1,2,3：2 帧 6 次、3 帧 3 次）。",
 mix:"综 04 那张表最值得整表背：同一串 4,3,2,1,4,3,5,4,3,2,1,5，OPT 7/12→6/12（降）、FIFO 9/12→10/12（升）、LRU 10/12→8/12（降），只有 FIFO 那一行是反的（六个数字均经复算）。原因：OPT 与 LRU 属堆栈类算法，m 个页框的驻留集永远是 m+1 个页框驻留集的子集，故单调不增。注意 m=3 时 LRU（10）比 FIFO（9）还差——「LRU 一定比 FIFO 好」是错的。",
 mem:"只有 FIFO 会反常，但也不是一定反常。",
 exam:"2014 选 48 与选 17 是这两种问法的正反面。"},

{ch:"vm",name:"简单 CLOCK：0 就杀，1 就赦",def:"每页一个访问位，装入或被访问时置 1；指针在循环队列上走，指到访问位为 0 直接淘汰，为 1 则置 0 后前移（宽恕一次）。也称最近未用 NRU 算法。",
 mix:"两个易错点：①全是 1 时要转一整圈把访问位全清零、指针回到出发点，再淘汰出发点那一页（不是「全 1 就淘汰当前页」）；②淘汰后指针指向被淘汰页的下一个页框，停原地会重复淘汰新页。教材算例（m=4，16 次访问）共 8 次缺页 = 4 装入 + 4 置换，四次淘汰依次是帧1的页7、帧3的页1、帧4的页2、帧2的页0（复算逐一吻合）。",
 mem:"0 就杀，1 就赦并清零，杀完往前走一格。",
 exam:"2010（CLOCK 应用分析）、2012（类 CLOCK 过程分析）；选项写「淘汰被访问次数多的页」是说反了。"},

{ch:"vm",name:"改进型 CLOCK：四类页与三轮扫描",def:"按 (A,M) 分四类：1 类(0,0) 最佳淘汰、2 类(0,1) 次佳、3 类(1,0)、4 类(1,1)。第一轮找 (0,0) 且不修改任何访问位；第二轮找 (0,1) 并把经过的 A 全置 0；第三轮指针复位、A 清零后重做。",
 mix:"画成 2×2 表最牢：先看 A（要不要留），A 相同再看 M（扔它贵不贵）。A 的权重高于 M——2 类(0,1) 优先于 3 类(1,0) 被淘汰，哪怕它是脏页；直觉容易反过来。第一轮「只看不动」是最容易漏的动词，它与简单 CLOCK 的「路过就清零」正相反。最多扫 4 轮：第二轮已把 A 全清零，第三轮不可能再全是 1。",
 mem:"先看 A 再看 M；第一轮只看不动。",
 exam:"2018（思想）、2016 与 2021（应用分析）。"},

{ch:"vm",name:"四算法排排坐（综 11 原型）",def:"同一张页帧状态表，FIFO 看装入时间最小、LRU 看上次引用时间最小、简单 CLOCK 看指针位置后第一个 A=0、改进型 CLOCK 找第一个 (0,0)。",
 mix:"综 11 的四个答案是三个不同的页：FIFO 选第 2 页（装入 120）、LRU 选第 1 页（上次引用 260）、两种 CLOCK 都选第 0 页。做题三步：①在表上标出每页的 (A,M)　②记清指针从哪开始　③按算法读对应的那一列。碰巧同解不代表算法等价，四个空要逐个算。",
 mem:"一张表四个算法，先标 (A,M) 再读列。",
 exam:"3.2-综09、3.2-综11 是同一类题的两道。"},

{ch:"vm",name:"抖动与三种诊断",def:"抖动＝刚换出的页马上又换入、刚换入的又被换出；根本原因是分配给进程的物理块数过少，后果是 CPU 利用率急剧下降甚至趋近于零。",
 mix:"诊断表：CPU 13% + 磁盘 97% ⟹ 抖动，处方是降低并发度（此时加进程是火上浇油）；CPU 87% + 磁盘 3% ⟹ 正常，什么都不做；CPU 13% + 磁盘 3% ⟹ CPU 没用满，增加并发进程数。处方只有两个方向：给它更多页框（工作集指导）或减少要页框的人（中级调度整个换出）；第三条是改善程序局部性。所有页面调度策略都不可能完全避免抖动。",
 mem:"磁盘忙+CPU闲＝抖动；两个都闲＝进程不够。",
 exam:"2011（抖动的处理措施）；3.2-25、3.2-综05。"},

{ch:"vm",name:"工作集",def:"某段时间间隔内进程实际访问过的页面集合，由时刻 t 与窗口尺寸 Δ 共同确定。驻留集大小不应小于工作集大小。",
 mix:"三条硬规矩：①从 t 往左数 Δ 次访问（含 t 本身），往右数是 OPT 的方向；②数完必须去重（它是集合）；③Δ 是访问次数，不是时间单位也不是页面个数。书上算例 Δ=5：t₁ 窗口 2,3,5,3,2 ⟹ {2,3,5}；t₂ 窗口 4,2,1,1,3 ⟹ {1,2,3,4}。全章第四条分界线：工作集不一定是驻留集的子集（有些页可能还没调入或已被换出），只有工作集完全包含在驻留集中才保证不缺页。",
 mem:"工作集是需求，驻留集是供给；往左数，去重。",
 exam:"2016 真题（工作集的应用分析）；3.2-52 的干扰项就是往后数。"},

{ch:"vm",name:"页框回收与页面缓冲算法",def:"两个链表：空闲页面链表（未修改页换出时页框挂到链尾、内容不清空，可直接复用）与修改页面链表（脏页攒够一批再批量写回）。这套延迟 I/O 的机制就是页框回收。",
 mix:"各省一种 I/O：空闲链省读、修改链省写。2012 真题第 45 题其实早就考过——「被系统回收的页框放入空闲页框链表，其中内容在下一次分配之前不清空」正是空闲页面链表的定义。不可回收的是内核页框（内核栈、内核代码段、内核数据段）；Linux 由守护进程 kswapd 在空闲页框低于阈值时主动回收，不能等耗尽再回收，否则写回脏页所需的 I/O 缓冲区也分配不出来，会造成内核内存分配死锁。",
 mem:"删除时不真删，先进回收站。",
 exam:"2025 年新增考纲（页框分配与回收）；2012 选 45 是它的前身。"},

{ch:"vm",name:"内存映射文件",def:"一种系统调用，在磁盘文件与进程虚拟地址空间之间建立直接映射，此后可像访问内存一样读写文件；映射时并不立即加载，首次访问某页才按需调入；进程退出或解除映射时才把修改写回。",
 mix:"用它实现共享内存：同一文件映射到多个进程的虚拟地址空间，OS 通过页表把它们的虚页映射到相同的物理页——虚地址可以不同、物理页必须相同，所以一方写入另一方立刻可见。注意：它保证「可见性」，不保证并发写的正确性，多进程同时写仍需 PV 互斥。与传统 read/write 相比：少一次内核缓冲区到用户缓冲区的拷贝、按需调入、统一写回。",
 mem:"把文件 I/O 变成了缺页处理。",
 exam:"2025 真题（内存映射文件的原理与特点）；它是本章与 ch4 之间的那道门。"},

{ch:"vm",name:"虚存性能的五个影响因素",def:"缺页率是核心因素，受页面大小、分配的物理块数、页面置换算法、写回磁盘的频率、程序编写的局部化程度五方面影响。",
 mix:"五条里两条单调、三条两难：置换算法与局部化程度越好越好（单调）；页面大小、物理块数、写回频率都是两难（页面大 ⟹ 缺页少但内碎片多；块数多 ⟹ 缺页少但超过阈值收益趋平且挤占并发度；攒着批量写 ⟹ 省 I/O 但占页框）。凡是「页面越大越好」「物理块越多越好」这类绝对化说法一律判错。",
 mem:"能说满的只有局部性和置换算法两条。",
 exam:"2020、2022（请求分页系统性能的影响因素分析）。"},

{ch:"vm",name:"数组遍历的缺页次数",def:"三步：①算一行占多少字节　②算一个页框装几行 k　③列优先访问 ⟹ 缺页次数 = 元素总数 ÷ k；行优先访问 ⟹ 缺页次数 = 总页数。",
 mix:"两道题两个刻度：128×128、int 4B、页框 512B（恰好装 1 行）、按 a[j][i] 列优先且数据区仅 1 个页框 ⟹ 16384 次；64×64、页框 128 个字（装 2 行）、按列访问 ⟹ 2048 次。先看清哪个下标在外层循环，a[j][i] 中 j 是行号却在内层，实为列优先访问。这道题串三科：数构给地址公式、组原给 Cache 版本、OS 给缺页版本。",
 mem:"一个页框装几行，决定每几个元素缺一次页。",
 exam:"3.2-12、3.2-13；对应 3.2.8 的第五因素（空间局部性）。"},

{ch:"vm",name:"地址翻译判定树（TLB → 页表 → Cache）",def:"先查 TLB；未命中则查页表；页表项无效则缺页中断；得到物理地址后访问 Cache；Cache 未命中再访主存。两张表都是先看有效位、再比标记。",
 mix:"地址结构推导五步：页内偏移 = log₂(页面大小)；虚/物理页号 = 各自位数 − 偏移；TLB 组索引取虚页号的低位、高位是标记；Cache 的块内偏移/组索引/标记切自整个物理地址（页内偏移那几位也参与）。两个坑：①标记匹配但有效位为 0 仍算未命中（教材例中 0x00f1 的 Cache 行就是这样）；②页表项无效就到此为止，别再硬算物理地址和 Cache。拼物理地址是拼接不是相加。",
 mem:"先看有效位，再比标记；顺序不能反。",
 exam:"2010、2017、2018、2020、2024 五道综合真题走的都是这条线；2017 的 f1 虚地址同时出现在当年组原真题里。"},
{ch:"fs",name:"逻辑结构 vs 物理结构",def:"逻辑结构＝用户眼里这堆记录怎么组织（无结构的流式文件；有结构的顺序、索引、索引顺序、散列文件）；物理结构＝这些字节落在哪些盘块上（连续、链接、索引）。",
 mix:"两条归属别搞反：逻辑结构由<b>用户创建文件时指定</b>，物理结构由<b>操作系统</b>决定。逻辑上的「顺序文件」与物理上的「连续分配」<b>没有必然联系</b>——顺序文件照样可以用链接或索引存放。物理结构与<b>介质特性强相关</b>（磁带只能顺序、光盘宜连续），逻辑结构与介质无关。",
 mem:"给人看的是逻辑，给盘用的是物理；用户挑逻辑，OS 挑物理。",
 exam:"4.1-02/03、4.2-20/23 四道书内题全靠这条判；4.2 一半选择题的干扰项都是拿这两个词互换造的。"},
{ch:"fs",name:"逻辑结构四种 · 索引顺序文件 √N",def:"顺序文件（串结构/顺序结构）、索引文件（每条记录一个索引项，可变长记录必备）、索引顺序文件（一组记录一个索引项）、散列文件。",
 mix:"索引文件与索引顺序文件的差别只在<b>索引项的粒度</b>：前者一记录一项，后者一组一项。索引顺序文件把 N 条记录分成 m 组，平均查找 T(m)=m/2+N/(2m)，由均值不等式 <b>m=√N 时最小，最小值也是 √N</b>：N=10000 ⟹ 100 组 × 100 条 ⟹ 50+50=100 次，比顺序文件的 5000 次快 50 倍。",
 mem:"索引表就是目录页；分组数与查找次数都等于 √N，一个数记两件事。",
 exam:"4.1-04/05。⚠️ 与数据结构 ch7 的分块查找是同一个公式，那边的最小 ASL 是 √n+1——OS 教材忽略了那个 +1，选项里只会出现 100 不会出现 101。"},
{ch:"fs",name:"FCB 与目录项",def:"FCB＝文件控制块，存放文件的全部描述信息（文件名、类型、位置、长度、权限、时间等）；一个 FCB 就是一个目录项，目录文件的内容就是一堆 FCB。",
 mix:"⚠️ <b>采用索引节点后，目录项被瘦身成只剩 &lt;文件名, inode 号&gt; 两项</b>——权限、长度、时间全搬进 inode。2025 真题（4.2-70）就问这个：目录项里<b>没有</b>权限信息。而 2009 真题（4.2-49）问「访问控制信息存哪儿合理」，答案是 <b>FCB / inode</b>。两题一正一反，必须成对记。",
 mem:"目录 = 一本花名册；有 inode 之后，花名册只剩「名字 + 工号」。",
 exam:"4.2-02/03、2009 选 49、2025 选 70。"},
{ch:"fs",name:"索引节点 inode · FCB 分解法",def:"把 FCB 拆成「目录项（文件名 + inode 号）」与「inode（其余描述信息）」，目录体积骤减 ⟹ 检索时读盘次数减少。",
 mix:"⚠️ <b>代价是找到目录项后还要再读一次盘取 inode</b> ⟹ 在第 k 块找到时是 <b>k+1</b> 次而非 k 次。王道原题：512B 块、64B FCB 拆成 10B+56B、254 个文件 ⟹ 分解前 32 块、平均 <b>16.38</b> 次；分解后 5 块、平均 <b>3.99</b> 次。一般条件（每块装满时）：分解前 (n+1)/2、分解后 (m+3)/2 ⟹ <b>划算的条件是 m &lt; n−2</b>，即目录至少要瘦掉 2 块以上才回本。",
 mem:"目录瘦身省下的块数，必须大于那多出来的 1 次读盘。",
 exam:"4.2-综02（本章唯一考「优化划不划算」的题）、4.2-01/04。"},
{ch:"fs",name:"内存 inode vs 磁盘 inode",def:"磁盘 inode 常驻外存；文件被打开时把它拷贝进内存 inode，并附加若干只在内存中有意义的字段。",
 mix:"内存 inode 比磁盘 inode <b>多出来的字段</b>：索引节点编号、状态（是否上锁/修改）、访问计数（多少进程正在用）、逻辑设备号、链接指针。⚠️ <b>关闭文件时只把内存 inode 的计数减一、必要时撤销，不动磁盘 inode</b>（2023 选 67 的题眼）。",
 mem:"磁盘 inode 记「文件是什么」，内存 inode 还要记「现在谁在用它」。",
 exam:"4.2-01、2023 选 67。"},
{ch:"fs",name:"目录结构四级演进",def:"单级目录（全盘一张表）→ 两级目录（主文件目录 + 用户文件目录）→ 树形目录（多级）→ 无环图目录（可共享）。",
 mix:"每一级只解决上一级的一个毛病：单级<b>不能重名</b>、检索慢；两级<b>解决了用户之间的重名</b>但用户内部仍受限；树形分类清晰、检索快，<b>但不便共享</b>；无环图靠共享节点实现共享，代价是<b>要维护共享计数，删除时计数不为 0 就只删自己那条目录项</b>。⚠️「不允许重名」指的是<b>同一目录下</b>（即全路径名不同即可）。",
 mem:"重名 → 共享，四级目录就是被这两个需求一路逼出来的。",
 exam:"4.2-07/13/14、综 03（无环图）、综 04（树形）。"},
{ch:"fs",name:"当前工作目录与路径",def:"绝对路径从根目录开始写；相对路径从<b>当前工作目录</b>开始写。设置当前工作目录的目的是<b>加快检索速度</b>。",
 mix:"不设当前目录，每访问一个文件都要从根逐级往下查目录（每一级至少一次读盘）；设了之后就从这一级起步。⚠️ 2010 真题（4.2-52）四个选项里「方便用户」「节省空间」都是干扰项，正解是<b>加快检索</b>。",
 mem:"当前目录 = 书签，省的是从头翻的那几页。",
 exam:"4.2-12、2010 选 52。"},
{ch:"fs",name:"目录检索的访盘三步公式",def:"① 每块装几项 = 盘块大小 ÷ 目录项大小；② 目录占几块 = 项数 ÷ 每块项数（向上取整）；③ 平均访盘 = 块数 ÷ 2（顺序查找查一半）。",
 mix:"⚠️ <b>第 ④ 步看题目动词</b>：问「查找一个文件」到目录项为止；问「读入索引节点 / 打开文件」还要 <b>+1</b>。4.2-09（FCB 64B、3200 项）= 200 块 ÷ 2 = <b>100 次</b>；4.2-10（目录项只剩 inode 号）= 50 块 ÷ 2 = 25，<b>+1 = 26 次</b>。⚠️ OS 教材的平均查找记作「块数/2」，数据结构记作「(块数+1)/2」，<b>408 的 OS 题按前者</b>。",
 mem:"装几项 → 占几块 → 除以二 → 看要不要再 +1。",
 exam:"4.2-09/10/06、综 02、综 06。"},
{ch:"fs",name:"连续分配",def:"文件占一片<b>物理上连续</b>的盘块；FCB 里记「起始块号 + 文件长度」两项。",
 mix:"✅ 随机访问最快（起始块号 + 逻辑块号直接算出物理块号，1 次访盘）、顺序读取也最快（磁头不用大幅移动）。❌ <b>产生外部碎片</b>、<b>最不利于动态增长</b>（后面被占就得整体搬家）、中间插入要把后续全部记录读出再写回。2013 真题：CD-ROM 视频要快速随机播放 ⟹ 选连续。",
 mem:"连续 = 数组：随机快、插入贵、要一整片地。",
 exam:"4.2-17/18/19、2013 选 57、2011 综 12（一次性写入的场景正好扬长避短）、2014 综 10。"},
{ch:"fs",name:"链接分配：隐式 vs 显式（FAT）",def:"隐式链接＝每个盘块末尾存下一块的指针；显式链接＝把所有指针抽出来做成一张<b>文件分配表 FAT</b>，整张表常驻内存。",
 mix:"⚠️ <b>能不能随机访问，全看指针在哪</b>：隐式链接的指针散在盘块里 ⟹ 读第 i 块要访盘 i 次，<b>不支持随机访问</b>；显式链接查内存中的 FAT ⟹ 不访盘就能得到块号，<b>支持随机访问</b>。⚠️ 隐式链接<b>每块要留出指针的空间</b> ⟹ 块内可用字节不再是 2 的幂，记录成组时要下取整。⚠️ 题干只写「链接分配」时按<b>隐式</b>理解。",
 mem:"隐式 = 藏在每一块里的纸条，只能一张张翻；显式 = 抄成一张总表挂在墙上。",
 exam:"4.2-16/22/25/26/27、2016 综 11（FAT 与文件最大长度）。"},
{ch:"fs",name:"索引分配",def:"给每个文件建一张索引表（存放各逻辑块对应的物理块号），索引表本身放在索引块里；FCB 只需记索引块号。",
 mix:"✅ <b>既支持随机访问、又便于动态增长、还没有外部碎片</b>——2009 与 2020 两道真题都把「随机 + 可变长」写在一起，答案必是索引分配。❌ 索引块本身占用盘块（小文件开销比例高）。索引表装不下时三种扩展：<b>链接方案</b>（索引块之间再链起来）、<b>多级索引</b>、<b>混合索引</b>。",
 mem:"索引 = 页表：一张表把逻辑序号翻译成物理块号。",
 exam:"4.2-21/29/50/65、综 01。⚠️ 多级索引与 ch3 的多级页表是同一个思想：一层装不下就再套一层。"},
{ch:"fs",name:"UNIX 混合索引",def:"inode 里 10 个直接块 + 一级/二级/三级间接各 1 个；最大文件 = (d + a₁·n + a₂·n² + a₃·n³) × 块大小，其中 <b>n = 块大小 ÷ 地址项大小</b>。",
 mix:"⚠️ <b>第一步永远是算 n</b>：「索引块 256B」≠「能装 256 个地址」，必须除以地址项大小（2010 真题干扰项 D 就是照这个错造的）。4KB 块 + 4B 地址 ⟹ n=1024，四段容量 <b>40KB / 4MB / 4GB / 4TB</b>（这组数背熟）。⚠️ <b>d 和 aᵢ 要照抄题干</b>：2010 是「4 直接 + <b>2 个</b>一级 + 1 二级」⟹ 1+32+1024 = <b>1057KB</b>；2018 是「<b>8</b> 个直接」⟹ 32KB+4MB+4GB+4TB。",
 mem:"直接是口袋、一级是抽屉、二级是柜子、三级是仓库；先量抽屉能放几个号（n），再一层层乘。",
 exam:"本章最大的一族：4.2-32/33/34、2010 选 53、2015 选 59、综 08、综 09、2012 综 13、2018 综 14、2022 综 15。"},
{ch:"fs",name:"访盘次数总表（m 级 ⟹ m+1 次）",def:"inode 已在内存的前提下：直接块 1 次、一级间接 2 次、二级 3 次、三级 4 次——<b>m 级间接 = m+1 次</b>（4.4 疑难点表 4.3）。",
 mix:"⚠️ <b>两个前提句必须圈出来</b>：① 「索引节点已在内存」——若不在，每项再 +1（2015 真题的干扰项 C、D 就是多算了这一次）；② 划区间时<b>要累加</b>：一级索引覆盖的是「直接块之后的 n 块」，2015 那题的上界是 10KB+256KB=<b>272384B</b> 而不是 256KB。另：连续分配读任意块 1 次；隐式链接读第 i 块 i 次。",
 mem:"每多一层间接，就多读一个索引块；前提是 inode 已经躺在内存里。",
 exam:"2015 选 59、综 08(3)(4)、2022 综 15(4)。"},
{ch:"fs",name:"簇与内部碎片",def:"簇＝文件分配的最小单位（若干个连续扇区）；扇区＝磁盘读写的最小单位。文件占用簇数一律<b>向上取整</b>。",
 mix:"2017 真题（4.2-62）：簇 1KB、扇区 512B、文件 <b>1026B</b> ⟹ 占 ⌈1026/1024⌉ = <b>2 簇</b>，内部碎片 = 2048−1026 = <b>1022B</b>——只多了 2B 却整整多占一个簇。⚠️ 题干同时给簇和扇区大小时，<b>算占用一律按簇，扇区大小是干扰项</b>。簇越大 ⟹ 管理表越小、但内部碎片越大，是一对矛盾。",
 mem:"簇是「分房子的最小户型」，住一个人也得整套给你。",
 exam:"2017 选 62、2018 综 14、2016 综 11。"},
{ch:"fs",name:"FAT 表有多大",def:"① 簇总数 = 容量 ÷ 簇大小；② 每个表项位数 ≥ ⌈log₂(簇总数)⌉，向上凑到整字节；③ FAT 大小 = 簇总数 × 表项字节数。",
 mix:"综 07：540MB 盘、1KB 块 ⟹ 552960 块，需 20 位 ⟹ 凑成 <b>3B</b>/项 ⟹ FAT ≈ <b>1620KB</b>。⚠️ <b>FAT 的开销率远高于位图</b>：540MB 盘的 FAT 占 0.24%，而 10GB 分区的位图只占 0.003%（差 80 倍）。⚠️ 卷容量上限由 FAT 表项位数决定，<b>单个文件</b>的长度上限还受目录项中「文件长度」字段的位数限制，两者取小。",
 mem:"先数有几个簇，再看几位装得下簇号，最后相乘。",
 exam:"4.2-28、综 07、2016 综 11。"},
{ch:"fs",name:"open 系统调用做了什么",def:"按<b>文件名</b>检索目录 → 把 FCB/inode 读入内存 → 在系统打开文件表与进程打开文件表各建一个表项 → 返回<b>文件描述符 fd</b>。",
 mix:"⚠️ <b>open 不把文件数据读进内存</b>（2014 选 58：首次打开只读 FCB）。⚠️ <b>「按名查找」只在 open 里发生一次</b>（2024 选 68）：read/write/close/lseek 拿到的都是 fd，它们连文件名长什么样都不知道。⚠️ 2012 真题（选 54）说法 Ⅲ「read 的参数里要给文件名」是<b>错的</b>。",
 mem:"open 走一遍「名字 → inode」的路，之后一律凭号牌 fd 直达。",
 exam:"4.2-37/38/40/42、2012 选 54、2014 选 58、2024 选 68。"},
{ch:"fs",name:"close ≠ 写回数据",def:"关闭文件＝把系统打开文件表里的<b>打开计数减 1</b>，计数为 0 时撤销内存 inode 与相关表项。",
 mix:"⚠️ <b>close 不写回文件数据、也不修改磁盘上的 inode</b>（2023 选 67 的四个选项就绕着这一点转）。脏数据何时落盘取决于缓存策略，与 close 没有必然关系。⚠️ 别把「关闭」与「删除」混：关闭动的是内存中的表项，删除才动目录项与磁盘块。",
 mem:"关门只是把号牌交回去，屋里的东西什么时候搬走是另一回事。",
 exam:"4.2-39、2023 选 67。"},
{ch:"fs",name:"两张打开文件表",def:"进程（用户）打开文件表——每个进程一张，存<b>读写指针</b>、访问权限、指向系统表的指针，fd 就是它的下标；系统打开文件表——全系统一张，存<b>打开计数</b>与文件的 inode 信息。",
 mix:"判据：<b>每个进程各有一份的放进程表，全系统只需一份的放系统表</b>。两进程打开同一文件（或一个文件与它的硬链接）⟹ <b>读写指针各自独立、内存 inode 共享、打开计数为 2</b>。⚠️⚠️ <b>教材内部口径冲突</b>：4.3.1 把读写指针写进了系统级打开文件表，与 4.2.7 及 2017 选 61 / 2020 选 64 的解析相反——<b>一律按「读写指针在进程表」作答</b>。",
 mem:"我读到哪儿了是我的事（进程表），这文件被几个人开着是大家的事（系统表）。",
 exam:"2017 选 61、2020 选 64、4.2-38。"},
{ch:"fs",name:"硬链接",def:"新建一个目录项，直接指向<b>同一个 inode</b>；建立时 inode 的链接计数 +1。",
 mix:"⚠️ <b>删除只减计数，减到 0 才真正回收 inode 与数据块</b> ⟹ 删掉原文件后，硬链接照常可用。❌ <b>不能跨文件系统</b>（inode 号只在本卷内有效）、通常不能指向目录。✅ 共享粒度是「同一个 inode」⟹ 一方写入另一方立刻看得到。⚠️ 2022 综 15 的判据：<b>两个目录项的 inode 号相同 ⟹ 它们互为硬链接</b>。",
 mem:"硬链接 = 同一个人的多个名字，销一个名字人还在。",
 exam:"4.2-43/44、2009 选 51、2017 选 61、2022 综 15。"},
{ch:"fs",name:"软链接（符号链接）",def:"新建一个<b>独立的小文件</b>，内容是被链接文件的<b>路径名</b>；被链文件的计数<b>不变</b>，软链接自己的计数恒为 1。",
 mix:"⚠️ <b>原文件被删 ⟹ 软链接悬空</b>，路径解析失败。2021 真题（4.2-66）正是反过来问「删除 file1 内核<b>不必</b>做什么」——答案是<b>删除指向它的快捷方式</b>：内核根本不知道谁指向了它，也没有义务清理。✅ 可跨文件系统、可指向目录。❌ 每次访问要<b>多解析一次路径</b>（多若干次读盘）。",
 mem:"软链接 = 写着地址的便条，房子拆了便条还在，但按址找不到人。",
 exam:"2009 选 51（软 → 硬 → 删原文件的计数序列）、2021 选 66。"},
{ch:"fs",name:"删除文件时内核做什么",def:"删目录项 → 回收数据块与索引块 → inode 链接计数 −1（减到 0 才回收 inode）。",
 mix:"⚠️ <b>不做的三件事</b>：① 不删除文件所在的目录（2013 选 55：目录里还有别的文件）；② 不删除指向它的软链接/快捷方式（2021 选 66）；③ <b>不把数据块内容清零</b>，只标记为空闲，留到下次分配前才清。⚠️ 第 ③ 条与 ch3 页框回收的原文几乎一模一样。",
 mem:"删文件 = 撕掉名册那一行 + 把地皮标成空闲，屋里的东西没人管。",
 exam:"2013 选 55、2021 选 66、综 03（无环图删共享节点）。"},
{ch:"fs",name:"文件保护：权限位串 4×5",def:"访问控制表 ACL <b>按文件</b>组织（这个文件对各类用户开放哪些权限）；访问权限表（能力表）<b>按用户</b>组织。UNIX 的「文件主/组/其他 × rwx」是<b>精简 ACL，9 位</b>。",
 mix:"⚠️ 2017 真题（4.2-60）是全章最易误选的一道：4 类用户 × 5 种权限 ⟹ <b>20 位</b>，不是 5 位。两个原因：① 位串存在 FCB 里，<b>属于文件</b>，必须把所有类别的权限一次记全（「当前是哪类用户」是运行时算出来的，不必存）；② 5 种权限<b>可叠加</b>，不是五选一，所以每种各占一个标志位。⚠️ 加密属于「保密」不属于「保护」。",
 mem:"位串是文件的花名册，一行一类用户、一列一种权限，格格都要留位置。",
 exam:"2017 选 60、2009 选 49、4.2-45/46/47/48。"},
{ch:"fs",name:"两个「上限」：文件数 vs 文件大小",def:"文件<b>数量</b>上限由 inode 号的位数 / inode 总数决定；<b>单个文件</b>大小上限由地址项个数、间接级数、块大小决定。",
 mix:"⚠️ 2020 真题（4.2-63）：目录项 64B（4B inode 号 + 60B 文件名，小写字母）⟹ 上限是 <b>2³²</b>。三个干扰项都在诱导你算文件名的组合数——<b>要害是「文件名可以重名（不同目录下），inode 号不能重复」</b>。⚠️ 2013 真题（4.2-56）反过来问「与单个文件长度<b>无关</b>的因素」⟹ 答<b>索引节点总数</b>。⚠️ 2018 综 14(2)：inode 区能放 64M 个、数据区能放 256M 个 ⟹ <b>取小者 64M</b>。",
 mem:"能装几个文件看工号位数，一个文件能多大看地址项。",
 exam:"2020 选 63、2013 选 56、2018 综 14。"},
{ch:"fs",name:"文件系统的层次结构",def:"自上而下：逻辑文件系统（管元数据、按名解析目录、保护）→ 文件组织模块（逻辑块号 ⟷ 物理块号、管空闲空间）→ 基本文件系统（向驱动发「读写某物理块」的命令）→ I/O 控制层 / 设备驱动。",
 mix:"⚠️ <b>「按名解析」在最上层、「块号翻译」在第二层</b>，别倒过来。⚠️ 文件系统容量 ≠ 磁盘容量：一块盘可分多个区、装多个文件系统，且<b>元数据本身也占空间</b>（4.3-03）。⚠️ UNIX 的索引结构放在 <b>inode</b> 里，不在目录项也不在超级块（4.3-04）。",
 mem:"上层管名字，中层管块号，下层管硬件。",
 exam:"4.3-01/02/03/04。"},
{ch:"fs",name:"磁盘布局与启动链条",def:"硬盘 0 号扇区＝主引导扇区（512B），三部分：<b>主引导程序 MBR + 分区表 + 结束标志 AA55</b>；每个分区内依次是引导块、超级块、空闲空间管理信息、inode 区、根目录与数据区。",
 mix:"启动链条要能连贯背出（ch1 与 ch4 的交汇点）：<b>加电 → BIOS 自检 → 读入 MBR → 由分区表找到活动分区 → 读该分区的引导块 → 装入内核</b>。⚠️ 选项里凡出现「<b>只</b>包含主引导程序 / <b>只</b>包含分区表」都是绝对化错项。⚠️ <b>超级块</b>记录文件系统的全局信息（块大小、总块数、空闲块数、类型），挂载时被读入内存。",
 mem:"0 号扇区 = 门牌 + 地图 + 封条；开机是「自检 → 看地图 → 找活动分区 → 装内核」。",
 exam:"4.3-09；超级块与 VFS 的超级块对象连考。"},
{ch:"fs",name:"空闲空间管理四法",def:"空闲表法（每项 &lt;首块号, 块数&gt;）、空闲链表法（空闲盘块链 / 空闲盘区链）、位示图法（一块一位）、成组链接法（分组 + 索引 + 链接）。",
 mix:"两个维度分别对应两道题：① <b>找连续空间难不难</b>——空闲链表<b>最难</b>（链上相邻的块物理上未必相邻，4.3-11），空闲表最容易；② <b>自身占多大与空闲量有没有关</b>——<b>只有位图无关</b>（2024 选 17），其余三种都随空闲量伸缩。⚠️ <b>FAT 兼管空闲空间</b>（表项填特定值表示空闲），而 inode 不管空闲——2019 与 2025 两年隔空呼应。⚠️ 文件区求空间利用率（离散分配），对换区求速度（连续分配）。",
 mem:"表看区段、链看块、位图看总量、成组链接兼两头。",
 exam:"4.3-05/06/07/11、2019 选 15、2024 选 17、2025 选 69。"},
{ch:"fs",name:"位示图的双向换算",def:"位示图用一位标记一个盘块的空闲状态；(字号 i, 位号 j) ⟷ 盘块号 b 之间的换算，<b>公式随编号起点变</b>。",
 mix:"⚠️⚠️ <b>两套公式各背一遍，做题先回题干找编号起点</b>：<b>从 1 起</b>（教材默认）b = n(i−1)+j、i = (b−1) DIV n + 1、j = (b−1) MOD n + 1；<b>从 0 起</b> b = n·i+j、i = b DIV n、j = b MOD n。本节四道题正好两套口径各两道。⚠️ <b>「位号」与「块内字节序号」差一个 ÷8</b>：2015 真题（4.3-14）问的是字节序号，算出块内位偏移 12 后还要 12÷8 = 1，干扰项 D 就是栽在这一步。⚠️ 那题的 n 是<b>一个盘块能装的位数 8192</b>，不是字长。",
 mem:"先问「从几开始编号」，再问「要的是位号还是字节号」，两问答完再动笔。",
 exam:"4.3-10、2015 选 14、综 01（还要再换算成柱面/磁头/扇区）、综 02。"},
{ch:"fs",name:"位图大小三步走",def:"① 被管理对象数 = 总容量 ÷ 单位大小；② 位图字节数 = 对象数 <b>÷ 8</b>；③ 换成题目要的单位。",
 mix:"2014 真题：10GB 分区、簇 4KB ⟹ 2.5M 个簇 ⟹ 位图 320KB ⟹ <b>÷4KB = 80 簇</b>；<b>四个选项 80/320/80K/320K 正是三步中每一步的中间结果</b>。2023 真题：16GB 内存、页 4KB ⟹ 2²² 个页框 ⟹ 2¹⁹B = <b>512KB</b>，干扰项 4MB 就是「忘了除以 8」。⚠️ <b>位图大小只与总块数有关、与当前空闲块数无关</b>（2024 选 17）——极端验证：磁盘全满时位图还是那么大，其余三法趋近于 0。",
 mem:"对象数 ÷ 8 得字节，再换单位；式子里根本没有「空闲数」这个变量。",
 exam:"2014 选 13、2023 选 16、2024 选 17。⚠️ ch3 管页框、ch4 管盘块共用这一个公式。"},
{ch:"fs",name:"成组链接法",def:"UNIX 的空闲空间管理：每 100 个空闲块一组，每组第一块当索引块记下本组块号，各索引块链成一条链；第一组的信息预先读入内存的<b>空闲盘块号栈</b>。",
 mix:"⚠️ <b>「空闲盘块号栈」这个术语只属于成组链接法</b>（4.3-08 的题眼）。为什么是栈：分配从栈顶取、回收往栈顶压，同一端操作。⚠️ <b>两个临界时刻最爱考</b>：① 分配到栈底时，栈底块号对应的正是本组索引块 ⟹ <b>先把它的内容读进栈（切到下一组），再把它本身分配出去</b>；② 回收到栈满 100 项时 ⟹ <b>把栈中全部块号写进这个新回收的块，让它成为新索引块与新栈底，计数重置为 1</b>。",
 mem:"一百块一组，组头当账本；栈空了先翻账本，栈满了就另起一本。",
 exam:"4.3-08；书例 201~7999 的分组边界 7799 = 77×100+99，与「末组 99 块」精确吻合。"},
{ch:"fs",name:"虚拟文件系统 VFS",def:"内核中的一个<b>抽象层</b>，向上为所有文件系统提供<b>统一接口</b>，向下把请求分发给具体文件系统（ext4 / NTFS / FAT / NFS）。四个对象：超级块、索引节点（V 节点）、目录项、文件对象。",
 mix:"⚠️ <b>五个「不是」</b>（2025 真题四个选项各打一个）：① 不是建在虚拟内存里的文件系统（「虚拟」指抽象层）；② <b>不是真正的文件系统，只存在于内存、不占磁盘</b>，随系统启动建立、关闭释放；③ <b>不提高访问速度</b>（还多一层分发；目录项缓存加快的是路径查找）；④ <b>能访问网络文件系统</b>，不限于本地；⑤ V 节点 ≠ 磁盘 inode（两者靠指针关联）。⚠️ 没有「数据对象」——VFS 管结构不管内容。",
 mem:"VFS 是插线板：上面一个统一插孔，下面各接各的电器；它自己不发电。",
 exam:"4.3-12（四对象）、2025 选 18（首考）。2022 新增大纲考点，不能因「以前没考过」而跳过。"},
{ch:"fs",name:"文件系统的挂载",def:"把一个文件系统接到目录树的某个<b>挂载点</b>上：读入它的超级块、挂到挂载点目录、在内存中建立目录项对象。",
 mix:"⚠️ <b>4.3.4 原文加粗的两条对称规则</b>：<b>同一设备可以挂到多个挂载点；同一挂载点同时只能挂一个设备</b>（挂了新的，原目录内容会被暂时遮住）。<b>尚未考过、是明显的出题点。</b>",
 mem:"一个设备可以有多个入口，一个入口同时只认一个设备。",
 exam:"4.3.4 节，2022 新增大纲考点，与 VFS 连考。"},
{ch:"fs",name:"记录成组与三次换算",def:"成组＝把多条逻辑记录塞进一个物理块；分解＝读出时再拆开。约束是<b>一条逻辑记录不能跨块</b>。",
 mix:"⚠️ <b>取整方向反着来</b>：「每块装几条」<b>下</b>取整（记录不能跨块，余下的字节浪费或放指针），「第 x 条在第几块」<b>上</b>取整。4.2-25：512B 块、100B 记录 ⟹ ⌊512/100⌋ = 5 条/块 ⟹ 第 22 条在 ⌈22/5⌉ = 第 5 块 ⟹ 隐式链接爬 5 次读 <b>+ 修改后写回 1 次 = 6 次</b>，干扰项 5 正是「只读不写」。⚠️ <b>读 = 爬到那一块；改 = 爬到那一块 + 写回一次</b>（块地址已在爬的过程中拿到，写回不必再找）。",
 mem:"装几条往下取，在第几块往上取，改完别忘写回去。",
 exam:"4.2-25/26、综 06、2014 综 10（移动一条记录 = 读 1 次 + 写 1 次）。"},
{ch:"io",name:"设备的三种分类与四条属性线",def:"按信息交换单位分<b>块设备</b>（可寻址、能随机访问，如磁盘）与<b>字符设备</b>（字符流、不可寻址，如键盘打印机）；按共享属性分<b>独占设备 / 共享设备 / 虚拟设备</b>。",
 mix:"四条分界线（5.1-01 一题钉四条）：①<b>可寻址是块设备的特征</b>，字符设备不可寻址；②<b>共享设备必须可寻址、可随机访问</b>，磁盘是唯一样板；③<b>共享 =「一段时间内」交替，不是「同一时刻」同时</b>——磁头只有一个，靠磁盘调度分时轮流；④<b>只有独占设备会引起死锁</b>（不可剥夺资源），共享设备不会。<b>磁带是独占设备</b>（只能顺序存取），选项里的「磁带机和磁盘」是钓鱼项。虚拟设备＝把一台独占设备变成多台逻辑设备（SPOOLing），<b>物理上并没有真变共享</b>。",
 mem:"共享是「轮流用」不是「一起用」；能死锁的只有独占设备。",
 exam:"5.1-01、5.1-02、5.2-17、5.2-29；概念判断题的总起点。"},
{ch:"io",name:"设备控制器与 I/O 端口编址",def:"设备控制器＝<b>与 CPU 的接口（控制/状态/数据寄存器）＋ I/O 逻辑 ＋ 与设备的接口</b>；那组寄存器就是「I/O 端口」。编址分<b>统一编址（内存映射）</b>与<b>独立编址</b>。",
 mix:"<b>实现设备控制功能的是 I/O 逻辑</b>，不是「接口」（接口只传信号）。<b>中断寄存器在主机内，不属于设备控制器</b>；<b>不存在「I/O 地址寄存器」</b>（生造词）。控制命令由 CPU 发出、但<b>由控制器提供</b>。统一编址用普通访存指令、<b>占用主存地址空间</b>；独立编址用专用 in/out 指令、不占主存空间但指令类型少。控制器五大功能：接收识别命令 · 数据交换 · 标识报告状态 · 地址识别 · 数据缓冲与差错控制，<b>不含「逻辑地址转物理地址」（那是 MMU）</b>。",
 mem:"寄存器 = 端口，I/O 逻辑 = 干活的；中断寄存器不在控制器里。",
 exam:"5.1-04、5.1-05、5.1-33、5.1-28；与组原 7.1/7.2 完全重叠。"},
{ch:"io",name:"四种 I/O 控制方式（含进程是否阻塞）",def:"程序直接控制（查询）→ 中断驱动 → DMA → 通道；每一步都在<b>放大 CPU 的干预粒度</b>：字 → 字 → 块 → 一组块。",
 mix:"定位只问三句：<b>谁搬数据 · 一次搬多少 · 数据经不经 CPU 寄存器</b>。查询与中断都<b>经过 CPU 寄存器</b>，DMA 与通道<b>直接在内存与设备之间搬</b>（逻辑通路，物理仍走总线）。<b>OS 侧独有的一问：用户进程会不会阻塞</b>——<b>程序直接控制方式下进程一直在运行态忙等、不阻塞</b>，中断与 DMA 都阻塞（5.1-20 答案 Ⅱ、Ⅲ）。<b>磁盘用 DMA</b>（块设备）。「DMA 是专门负责 I/O 的处理机」错，<b>那是通道</b>。",
 mem:"忙等的不阻塞，被叫醒的才阻塞。",
 exam:"5.1-03/06/08/09/20/27；2017 真题考 DMA 五步排序。"},
{ch:"io",name:"DMA 控制器的组成与两段处理",def:"四类寄存器：<b>命令/状态 CR · 内存地址 MAR · 数据 DR · 数据计数器 DC</b>；一次传输 = <b>预处理（CPU 填参数）→ DMA 搬块 → 发中断 → 后处理</b>。",
 mix:"<b>「中断寄存器」不属于 DMA 控制器</b>（5.1-10）。2017 真题顺序 <b>②④①③</b>：初始化并启动磁盘 → 传一块到内存 → 发中断请求 → 执行结束中断服务程序。四条状态结论：<b>预处理与后处理都在内核态</b>（先经系统调用进内核）；<b>预处理由请求 I/O 的进程做，做完主动阻塞自己</b>；<b>后处理由中断服务例程做，它不是一个单独的进程</b>；<b>后处理时请求进程仍在阻塞态</b>（等唤醒）。",
 mem:"CPU 填四个寄存器再撒手，搬完敲门叫它回来。",
 exam:"5.1-10、5.1-11、2017 真题；组原 7.3.3 问的是周期窃取，OS 问的是进程状态。"},
{ch:"io",name:"DMA vs 通道 vs 中断驱动",def:"三者的差别在<b>干预单位</b>与<b>自主程度</b>：中断驱动每字一次、DMA 每块一次、通道每组块一次；<b>只有通道有自己的通道程序</b>。",
 mix:"<b>通道是一种特殊的处理器 ⟹ 硬件</b>；<b>SPOOLing、缓冲池、内存覆盖都是软件</b>（5.1-07 只考这一句）。<b>DMA 的参数由 CPU 预先设定，通道由通道程序动态决定</b>；<b>一个 DMA 控制器通常只服务一台设备，一个通道可管多个控制器、每个控制器再管多台设备</b>。三级从属链<b>只能逐级控制、不能越级</b>——「设备控制器和通道可以分别控制设备」是错的。<b>驱动程序按设备类型配，不按台数配</b>（2 台绘图机 + 3 台打印机只需 2 个驱动）。",
 mem:"通道是能自己读程序的小 CPU；DMA 只会照着 CPU 填好的参数搬。",
 exam:"5.1-07、5.1-09、5.1-14、5.1-15。"},
{ch:"io",name:"I/O 软件四层：谁干什么",def:"自上而下<b>用户层 → 设备独立性软件（＝系统调用处理程序）→ 设备驱动程序 → 中断处理程序 → 硬件</b>；请求向下走，数据沿原路逆向回传。",
 mix:"分层判据一句话：<b>「这件事换一台设备还成不成立？」成立归设备无关层，不成立归驱动</b>。<b>⭐最贵的一对：「翻译系统调用参数」＝设备独立性软件（5.1-16）vs「向设备寄存器写命令」＝驱动程序（5.1-17）</b>，两题只差一个动词。<b>格式化 I/O 与 SPOOLing 属用户层</b>（最爱错的归属）；<b>检查用户是否有权使用设备属设备无关层</b>；<b>把逻辑块号算成柱面/磁头/扇区属驱动</b>（2013 真题）；<b>把二进制整数转 ASCII 打印属用户层</b>。设备无关层还管：设备命名与保护、缓冲、设备分配与回收、独立于设备的块大小、差错报告。",
 mem:"越往上越抽象，越往下越懂硬件；只有驱动真正碰寄存器。",
 exam:"2011、2012、2013、2020、2022、2023 六年反复考；5.2-综01 四小问一次考全。"},
{ch:"io",name:"设备驱动程序的四功能五特点",def:"驱动是<b>抽象 I/O 请求与具体设备命令之间的双向翻译器</b>，也是唯一直接操作设备寄存器的软件层。",
 mix:"四功能：①译命令（逻辑块号→盘面/磁道/扇区）②检查合法性、查状态、传参数 ③<b>发 I/O 命令；设备忙就把 PCB 挂到设备等待队列</b> ④响应中断并调用中断处理程序。五特点（2022 真题原型）：①双向转换并回报结果 ②<b>与 I/O 控制方式紧密相关</b>——「驱动程序与 I/O 控制方式无关」是 2022 那道题的错项 ③不同类型设备必须配专用驱动 ④<b>部分底层功能可由设备固件或 ROM 提供</b> ⑤<b>必须可重入</b>。处理顺序：<b>校验请求 → 传参数 → 检查状态 → 启动设备</b>。",
 mem:"厂商写的那一层：凡是换型号就要改的事，都推给它。",
 exam:"2022 真题整题就是五特点的改写；5.2-32/33/34。"},
{ch:"io",name:"中断响应的硬软分工与「是否返回原进程」",def:"<b>中断响应（硬件）</b>：关中断、保存断点、用户态→内核态、识别中断源；<b>中断处理（软件）</b>：保存通用寄存器、设屏蔽字、搬数据、唤醒进程、恢复现场。",
 mix:"<b>「一定不由硬件完成」的是「主机获取设备输入」</b>——数据搬运一定是中断服务程序干的（5.1-19）。<b>中断处理结束后不一定返回被中断的进程</b>：单重中断（屏蔽方式）会返回；多重中断时<b>若有更高优先级请求就转去处理它</b>（5.1-21 答案 C）。两道题的题眼都是「<b>一定</b>」二字——见到「一定」先找反例。<b>不同设备有不同的中断处理程序</b>，但同类型设备共用（与驱动按类型配一致）。",
 mem:"敲门交接归硬件，屋里干活归软件；「一定返回」永远是错的。",
 exam:"5.1-19、5.1-21；与组原 5.5 单重/多重中断同源。"},
{ch:"io",name:"中断开销占 CPU 的比率",def:"<b>比率 =（每秒中断次数 × 每次中断处理时间）÷ 1 s</b>；难点全在算出「每秒中断几次」。",
 mix:"三道同型题的答案排成一条结论线：<b>打印机 2%</b>（50 行×80 字符×6 页/分 = 400 字符/秒，×50 μs = 20 ms）· <b>时钟中断 12%</b>（60 Hz ⟹ 每秒 60 次 × 2 ms）· <b>调制解调器 56%</b>（56 kb/s ÷ <b>每字符 10 位</b> = 5600 次/秒 × 0.1 ms）。<b>b/s 是位不是字符</b>，题干那句「每个字符含起始位和结束位共 10 位」是换算的钥匙。<b>结论：中断驱动划不划算取决于中断频率，不取决于设备快慢</b>——56% 就是必须上 DMA 的量化理由。",
 mem:"先把「每秒中断几次」单独算出来圈起来，剩下的只是乘除。",
 exam:"5.1-18、5.1-综01、5.1-综02。"},
{ch:"io",name:"应用程序 I/O 接口三类 · 阻塞与非阻塞",def:"按设备类型分<b>字符设备接口 · 块设备接口 · 网络设备接口（网络套接字）</b>；按调用是否等待分<b>阻塞 I/O</b> 与<b>非阻塞 I/O</b>。",
 mix:"<b>「传输速率较高且可寻址」⟹ 块设备接口</b>（5.1-22）。阻塞 I/O：进程发出请求后<b>被挂起</b>，直到数据就绪才返回（大多数系统调用如 read/write 默认如此）；非阻塞 I/O：<b>立即返回</b>，返回已传输的字节数（可能为 0），常用于用户界面与数据复制。<b>阻塞与否是「调用者等不等」，与底层用哪种 I/O 控制方式是两件事</b>。中断处理程序的<b>注册与注销</b>由驱动程序初始化时向系统登记完成。",
 mem:"块设备＝可寻址＋高速；阻塞看调用者等不等，不看底层怎么搬。",
 exam:"5.1-22、5.1-30、5.1-31。"},
{ch:"io",name:"设备独立性与逻辑设备表 LUT",def:"设备独立性＝<b>用户编程时使用的设备与实际使用的物理设备无关</b>；靠 <b>LUT（逻辑设备名 → 物理设备名 → 驱动程序入口地址）</b>做翻译。",
 mix:"好处链：<b>用户不必记物理名 ⟹ 系统可挑一台空闲的 ⟹ 分配灵活、易于 I/O 重定向、提高利用率、一台坏了能换另一台</b>；<b>它带来的是灵活性与可靠性，不是速度</b>。LUT 两种设置：<b>全系统一张 ⟹ 所有用户不能重名，只适合单用户系统</b>；<b>每用户一张 ⟹ 可以重名，适合多用户系统</b>。用逻辑名分配时，<b>系统在 SDT 里挨个查同类设备，只要有一台空闲就继续分配，全忙才挂公共等待队列</b>——这正是 5.4 疑难点「改进设备分配策略」的第一条。<b>绝对号＝全系统统一编号，相对号＝用户自己起的名</b>。",
 mem:"用户只说「要一台打印机」，LUT 负责翻成「3 号」。",
 exam:"2009、2020 各考一次；5.1-13、5.1-29。"},
{ch:"io",name:"高速缓存 vs 缓冲区（表 5.1）",def:"两者都夹在高速与低速设备之间缓解速度差；<b>高速缓存放的是慢速设备上数据的副本、可久驻、吃重复访问</b>；<b>缓冲区放的是传输途中的数据、传完即释放、吃速度差</b>。",
 mix:"缓冲的三层目的：<b>协调速度差 · 降低中断频率 · 匹配数据粒度</b>（攒够一块再中断一次，正对应中断开销那 56%）。<b>缓冲区不是专门的硬件缓冲器</b>，可以用内存实现（一般就是内存）。<b>缓冲池在主存里，SPOOLing 的输入井/输出井在磁盘上</b>——这一对位置关系年年被交换着考。<b>I/O 时间比 CPU 处理时间短得多时缓冲区几乎无效</b>（没有速度差可吃）。2015 真题「内存中设置磁盘缓冲区的主要目的」＝<b>减少磁盘 I/O 次数</b>。",
 mem:"Cache 存副本吃局部性，Buffer 存在途数据吃速度差。",
 exam:"2015 真题；5.2-02/04/06/11/48。与组原 3.3 Cache 就地串联。"},
{ch:"io",name:"⭐单缓冲与双缓冲：每块稳态时间",def:"三个字母先钉死：<b>T = 设备→缓冲区，M = 缓冲区→用户区，C = CPU 处理一块</b>。<b>单缓冲 max(T, C) + M</b>；<b>双缓冲 max(T, C + M)</b>。",
 mix:"<b>唯一的分水岭是 M 在不在 max 的括号里</b>：单缓冲只有一个缓冲区，「设备写入」与「送用户区」必须互斥串行，M 挂在外面；双缓冲时设备去写另一个缓冲区，M 就能与 T 并行、被收进括号。5.2-09：max(80,30)+40 = <b>120 μs</b>；5.2-10：<b>max(T₁, T₂+T₃)</b>。<b>循环缓冲与缓冲池不出定量计算题</b>（王道原文点明），见到 4 个以上缓冲区的时间题多半是看错题干。",
 mem:"单缓冲「倒完再灌」，双缓冲「边倒边灌」——M 进括号就是双。",
 exam:"2011、2013 连考；两条公式记反是本章重灾区。"},
{ch:"io",name:"⚠️缓冲区的 n 块总时间（不能拿稳态乘 n）",def:"<b>单缓冲 n 块：n × (T + M) + C</b>；<b>双缓冲 n 块：n × T + M + C</b>。与稳态公式是两套东西。",
 mix:"2011 真题（10 块，T=100 M=50 C=50）：单缓冲 10×(100+50)+50 = <b>1550</b>；双缓冲 10×100+50+50 = <b>1100</b>。<b>错误选项 1000 与 1500 正是拿稳态公式直接乘出来的</b>。5.2-综02（4 块，T=80 M=20 C=50 双缓冲）总时间 80×4+70 = <b>390</b>，<b>平均 97.5 ≠ 稳态 80</b>——多出的 70 是最后一块的 M + C 收尾，n 越大平均越逼近 max(C,T)。2013 那道求「2 块最短时间」的题<b>要画时间轴</b>：105 + max(90,105) + 90 = <b>300</b>。",
 mem:"看到「逐个读入 n 个磁盘块」就换公式，别乘。",
 exam:"2011、2013、5.2-综02；本章计算题最大的坑。"},
{ch:"io",name:"循环缓冲与缓冲池",def:"循环缓冲＝若干等大缓冲区链成环，<b>in 指向下一个空、out 指向下一个满</b>；缓冲池＝<b>带管理结构与操作函数的软件机制</b>，三队列四工作方式。",
 mix:"两种阻塞：<b>in 追上 out（全满）⟹ 系统受计算限制 ⟹ 输入进程阻塞</b>；<b>out 追上 in（全空）⟹ 系统受 I/O 限制 ⟹ 计算进程阻塞</b>——谁跑得快谁先撞墙，撞墙的被阻塞。缓冲池三队列：<b>空缓冲队列 · 输入队列 · 输出队列</b>；四方式 <b>收容输入 hin / 提取输入 sin / 收容输出 hout / 提取输出 sout</b>，一律<b>队首摘、队尾挂</b>，<b>读完的缓冲区一律回空缓冲队列</b>。选型：<b>双向传送用双缓冲</b>，<b>多进程既输入又输出用缓冲池</b>。<b>缓冲区是临界资源</b>，管理者最要考虑的是<b>访问同步</b>。",
 mem:"in 是写笔、out 是读笔；追上谁就把谁的主人拦下来。",
 exam:"5.2-03/05/07/12/47/50；只考概念不考计算。"},
{ch:"io",name:"设备分配的四张表：SDT/DCT/COCT/CHCT",def:"<b>SDT 全系统一张</b>（全局索引）· <b>DCT 每台设备一张</b> · <b>COCT 每个控制器一张</b> · <b>CHCT 每个通道一张</b>，串成「设备→控制器→通道」的从属链。",
 mix:"<b>PCB 不属于设备管理的数据结构</b>（5.2-14），但 <b>DCT 里的「设备队列队首指针」指向的正是由 PCB 组成的等待队列</b>。DCT 字段还含<b>重复执行次数（超过就判 I/O 失败）</b>。<b>进程释放设备且无人等待时，把 DCT 的设备状态置空闲＝设备回收</b>。多通路 I/O 结构下，<b>控制器与通道也要逐个试，全忙才算失败</b>（5.4 疑难点第二条改进）。",
 mem:"一张总表 + 三张按部件的表；查表就是顺着指针往上爬。",
 exam:"5.2-14、5.2-16、5.4 疑难点收口句「设备分配，要过三关」。"},
{ch:"io",name:"设备分配三步与安全性",def:"三步：<b>①查 SDT 找 DCT 判设备忙闲 → ②顺指针查 COCT 判控制器 → ③查 CHCT 判通道</b>；<b>三关全过才算分配成功</b>，任一关忙就把 PCB 挂到那一级队列。",
 mix:"<b>安全分配方式</b>：发出 I/O 请求后<b>立即阻塞</b>，期间不再请求任何资源 ⟹ <b>不会死锁</b>（破坏了「请求并保持」），代价是<b>CPU 与 I/O 串行、效率低</b>；<b>不安全分配方式</b>：<b>发出请求后继续运行</b>，可再发第二、第三个请求，<b>可能死锁</b>，好处是一个进程能同时用多台设备。2023 真题「设备分配要考虑的因素」＝<b>固有属性 · 分配算法 · 分配安全性 · 设备独立性</b>；<b>分配算法只有 FCFS 与最高优先级优先</b>（同优先级再按 FCFS）。<b>独占设备静态分配、共享设备动态分配</b>。",
 mem:"过三关才放行；一发请求就睡觉的那种最安全也最慢。",
 exam:"2023 真题；5.2-08/16/29/49。与 ch2 死锁互为表里。"},
{ch:"io",name:"SPOOLing 的组成与三大特点",def:"用<b>磁盘上的输入井/输出井</b>＋<b>内存里的输入/输出缓冲区</b>＋<b>输入进程和输出进程</b>＋<b>井管理程序</b>，用软件模拟当年的脱机外围机。",
 mix:"六个必答点：<b>①打印结果先送磁盘输出井（不是内存）②需要 0 台外围计算机（这正是「假」的含义）③四部分组成 ④用户进程实际分到的是外存区即虚拟设备，物理打印机根本没分出去 ⑤构成条件＝多道程序 + 外存 + SPOOLing 软件，且必须先有独占设备 ⑥三大特点＝提高 I/O 速度、独占设备变共享设备、实现虚拟设备</b>。一次打印的真实过程：输出井分盘块写数据 → 申请<b>用户请求打印表</b>挂到<b>假脱机打印队列</b> → <b>用户进程即认为打完了继续跑</b> → 后台打印进程按队列真打。<b>SPOOLing 属于 I/O 软件的用户层</b>。",
 mem:"井在磁盘、缓冲区在内存；每人一台「虚拟打印机」，实际排队一台真机。",
 exam:"2016 真题；5.2-19 ~ 5.2-28 整整十道。"},
{ch:"io",name:"空间换时间 vs 时间换空间",def:"<b>SPOOLing 是以空间换时间</b>（拿磁盘空间换 CPU 时间）；<b>虚拟存储、覆盖与交换是以时间换空间</b>（多花 I/O 时间换更大的逻辑空间）。",
 mix:"两句话方向相反，最容易背串（5.2-27）。<b>提高单机资源利用率的「关键」技术是多道程序设计</b>，不是 SPOOLing——SPOOLing、虚拟、交换都只是多道程序下的具体手段（5.2-18），问「关键」就往最底层答。<b>虚拟设备靠 SPOOLing 实现</b>；<b>虚拟＝把一个物理实体映射成多个逻辑对应物</b>，分时分复用（处理器）与空分复用（虚存）两类。跨科同族：<b>TLB / 快表 / Cache / ARP 缓存</b>都是空间换时间。",
 mem:"磁盘换 CPU 时间＝SPOOLing；I/O 时间换地址空间＝虚存。",
 exam:"5.2-18、5.2-27、5.1-07；与 ch1 四特征、ch3 虚存联考。"},
{ch:"io",name:"一次键盘输入的完整时序（2023 综合真题）",def:"<b>正确顺序②⑥④③①⑤</b>：调度程序阻塞 P → 用户按键 → 启动键盘中断处理程序 → 驱动把字符从键盘控制器读入系统缓冲区 → 唤醒 P 入就绪队列 → 中断返回、P 从系统调用返回。",
 mix:"三条附带结论：<b>②之后 CPU 一定发生进程切换</b>；<b>①之后调度程序才可能再选中 P</b>；<b>操作③属于键盘驱动程序</b>（与具体设备直接相关）；<b>中断处理、驱动、设备独立性软件都在内核态执行，此时 P 一直在阻塞态</b>。<b>2024 真题问「键盘中断服务例程执行结束时数据在哪」＝系统缓冲区（内核缓冲区）</b>——搬进用户缓冲区是系统调用返回路上才做的，<b>题眼是「执行结束时」四个字</b>。<b>2010 真题：首先获得键盘输入信息的是中断处理程序</b>。",
 mem:"阻塞→按键→中断→读进内核缓冲区→唤醒→返回，六步一条线。",
 exam:"2023 综合题 8 分 + 2024、2010 两道选择题，三题共用一条时序。"},
{ch:"io",name:"用户缓冲区 vs 内核缓冲区",def:"<b>用户缓冲区</b>在用户进程自己的空间里（如一个数组），作用是<b>减少系统调用次数、降低态切换开销</b>；<b>内核缓冲区</b>在内核空间由 OS 管理，作用是<b>提高磁盘 I/O 整体效率</b>。",
 mix:"一次 read 的数据路径：<b>磁盘 → 内核缓冲区 → 用户缓冲区</b>——<b>命中内核缓冲区就不必访盘</b>，未命中才发起磁盘 I/O 并把进程挂起。写操作更明显：<b>用户数据先写内核缓冲区，攒够量或满足刷新条件才批量写盘（延迟写）</b>。<b>那多出来的一次拷贝正是零拷贝技术想省掉的东西</b>。这一条同时解释了 2024 真题为什么答「系统缓冲区」。",
 mem:"用户缓冲区省的是系统调用次数，内核缓冲区省的是访盘次数。",
 exam:"5.4 本章疑难点第 2 条；5.2-52、2024 真题。"},
{ch:"io",name:"磁盘物理结构与地址三级换算",def:"物理地址＝<b>（柱面号，磁头号，扇区号）</b>；连续存放的进位顺序是<b>先存满扇区 → 换磁头（同柱面下一盘面）→ 一个柱面满了才换柱面</b>。",

/* ===== 渲染（与其余卡库同模板） ===== */
const panel=document.getElementById('panel');
const vg=document.getElementById('vgrid');
const isMobile=()=>window.innerWidth<=900;
let curFilter='all', curIdx=-1;

function cardHTML(d){
  return `<div class="wcard">
    <div class="head"><span class="w">${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
    <div class="row r-def"><b>一句话定义</b>${d.def}</div>
    <div class="row r-conf"><b>易混辨析（408 命脉）</b>${d.mix}</div>
    <div class="row r-mem"><b>怎么记</b>${d.mem}</div>
    <div class="row r-exam"><b>408 考法</b>${d.exam}</div>
    ${d.src?`<div class="r-src">📦 提炼自：${d.src}</div>`:''}
    <div class="r-link">🔗 真题出处：待错题页生成后回链点亮</div>
  </div>`;
}
function showCard(i){
  const d=K[i]; curIdx=i;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.toggle('active', +e.dataset.i===i));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>`+cardHTML(d);
  if(isMobile())panel.classList.add('open');
}
function quiz(){
  const pool=K.map((d,i)=>[d,i]).filter(([d])=>curFilter==='all'||d.ch===curFilter);
  const [d,i]=pool[Math.floor(Math.random()*pool.length)];
  curIdx=-1;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.remove('active'));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>
  <div class="wcard"><div class="head"><span class="w">🎲 ${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
  <div class="hint" style="padding:20px 6px;color:var(--muted);font-size:.85rem;text-align:center">先在心里说出<b>定义</b>和<b>易混点</b>……</div>
  <button class="reveal" onclick="showCard(${i})">想好了，看答案</button>
  <button class="reveal" style="background:none;border-color:var(--line);color:var(--muted)" onclick="quiz()">换一张</button></div>`;
  if(isMobile())panel.classList.add('open');
}
function renderGrid(f){
  curFilter=f; vg.innerHTML='';
  K.forEach((d,i)=>{
    if(f!=='all'&&d.ch!==f)return;
    const div=document.createElement('div');div.className='vitem';div.dataset.i=i;
    if(i===curIdx)div.classList.add('active');
    div.innerHTML=`<span class="chip">${CH[d.ch]}</span><div class="w">${d.name}</div><div class="cn">${d.def.length>38?d.def.slice(0,38)+'…':d.def}</div>`;
    div.addEventListener('click',()=>{showCard(i);if(!isMobile())window.scrollTo({top:0,behavior:'smooth'})});
    vg.appendChild(div);
  });
}
const fdiv=document.getElementById('filters');
const counts={};K.forEach(d=>counts[d.ch]=(counts[d.ch]||0)+1);
const fs=[['all','全部 '+K.length]].concat(Object.keys(CH).map(k=>[k,CH[k]+' '+counts[k]]));
fs.forEach(([k,label],j)=>{
  const b=document.createElement('button');b.className='fbtn'+(j===0?' on':'');
  b.innerHTML=label.replace(/ (\d+)$/,' <span class="cnt">$1</span>');
  b.addEventListener('click',()=>{document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderGrid(k)});
  fdiv.appendChild(b);
});
const qb=document.createElement('button');qb.className='quizbtn';qb.textContent='🎲 随机抽卡自测';
qb.addEventListener('click',quiz);fdiv.appendChild(qb);
renderGrid('all');
</script>
