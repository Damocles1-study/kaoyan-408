{ch:"ov",name:"系统层次结构 · 虚拟机的顺序",def:"自上而下：应用（问题）→ 算法与编程 → <b>操作系统/虚拟机</b> → <b>ISA（软硬件分界）</b> → 微体系结构 → 功能部件/RTL → 电路与器件。对应用户：最终用户 / 程序员 / 架构师 / 电子工程师。",

{ch:"ov",name:"⚠️ 单位陷阱：容量 2 的幂 · 速率 10 的幂",def:"<b>容量</b>（主存/Cache/磁盘/文件）：K、M、G、T 基于 <b>2 的幂</b>，1KB=2¹⁰B。<b>速率与频率</b>（主频/带宽/传输率/FLOPS/MIPS）：基于 <b>10 的幂</b>，1kb/s=10³b/s、1GHz=10⁹Hz。另：<b>1B（字节）= 8b（位）</b>。",

 exam:"2012 真题；木桶效应贯穿 Cache 命中率、流水线瓶颈段。"},
{ch:"ov",name:"FLOPS 家族 · 量级与中文数词",def:"MFLOPS 10⁶ 百万 / GFLOPS 10⁹ 十亿 / TFLOPS 10¹² 万亿 / PFLOPS 10¹⁵ 千万亿 / EFLOPS 10¹⁸ 百亿亿 / ZFLOPS 10²¹ 十万亿亿。从 M=10⁶ 起每级 ×10³。",
 mix:"⚠️ <b>中文数词才是真考点</b>：万=10⁴、亿=10⁸、万亿=10¹²、<b>千万亿=10¹⁵、亿亿=10¹⁶</b>。2021 真题 93.0146 PFLOPS = 9.30146×10¹⁶ ≈ <b>9.3 亿亿次</b>；两个错项「9.3×10¹⁵」与「9.3 千万亿次」其实是同一个数，<b>都错在把 93 写成 9.3 时忘了给指数 +1</b>。<br>⚠️ <b>只有带 FL 的才是浮点指标</b>：MIPS/CPI/IPC 数的都是指令或周期。<b>MIPS 衡量标量机，MFLOPS 衡量向量机</b>。",
 mem:"认准 FL 两个字母；科学计数法把系数化到 1~10 时指数要跟着调。",
 exam:"2011、2021 真题。"},

{ch:"num",name:"原码·反码·补码·移码",def:"补码：正数同原码，负数=取反加一；n 位补码范围 −2ⁿ⁻¹ ~ 2ⁿ⁻¹−1，0 唯一。移码 = 真值加偏置；<b>同字长且偏置取 2ⁿ 时，移码 = 补码最高位取反</b>。",
 mix:"原码/反码有 ±0，补码多表示一个最小负数 −2ⁿ⁻¹（它没有对应正数，取负会溢出）。移码全 0 表示最小值，便于浮点阶码比大小。补码的模是 2ⁿ。",
 mem:"补码取负 =「按位取反，末位加一」。",
 exam:"表示范围/互相转换选择题必考。"},
{ch:"num",name:"补码加减与溢出判断",def:"减法转加法：A−B = A+(−B) 补。溢出判断三法：双符号位 01 上溢 / 10 下溢；符号位进位与最高数值位进位异或为 1；两同号数相加结果异号。",
 mix:"⚠️ 无符号数的进位（CF）与有符号数的溢出（OF）是两回事，同一运算两个标志可任意组合。异号相加、同号相减永不溢出。",
 mem:"双符号位「01 冲上天，10 掉下地」。",
 exam:"判断哪个运算溢出，选择题高频。"},
{ch:"num",name:"移位·扩展·截断",def:"算术右移补符号位、逻辑右移补 0；短转长：有符号做符号扩展、无符号做零扩展；长转短：直接截断低位。",
 mix:"补码算术左移可能溢出（符号位被挤掉），右移不会但丢精度。截断后的值可能面目全非（符号都会变）。char 默认是否有符号看编译器，408 题目会指明。",
 mem:"算术移位保符号，逻辑移位只管 0。",
 exam:"结合 C 变量赋值考察，408 特色。"},
{ch:"num",name:"C 语言整型转换陷阱",def:"signed 与 unsigned 混合运算时 signed 被转为 unsigned；−1 转 unsigned 变最大数。",
 mix:"int→float 可能丢精度（float 有效位数只有 24 位 < 32）；float→int 截断小数部分且可能溢出；int↔long 按符号扩展/截断。比较 −1 < 1U 的结果是假——408 考过同款。",
 mem:"位模式不变，解释方式变。",
 exam:"408 特色题型，几乎年年一题。"},
{ch:"num",name:"IEEE 754 单精度",def:"1 位符号 + 8 位阶码（偏置 127）+ 23 位尾数（隐藏整数位 1）；值 = (−1)^s × 1.M × 2^(E−127)。",
 mix:"阶码全 0：非规格化数（隐藏位为 0，指数按 −126 算）；阶码全 1：∞（尾数 0）或 NaN（尾数非 0）。最小正规格化数 2⁻¹²⁶。双精度偏置 1023。「偏置 128」是移码定义与 754 的差异点，看清题目。",
 mem:"「藏个 1，减 127」。",
 exam:"与十进制互化、比较大小，计算题必考。"},
{ch:"num",name:"浮点加减五步",def:"对阶（小阶向大阶）→ 尾数加减 → 规格化（左规/右规）→ 舍入（<b>IEEE 754 默认「就近舍入」，中点向偶数</b>）→ 溢出判断。",
 mix:"为什么小阶向大阶：小数右移丢的是低位，大数左移丢的是高位。浮点溢出看阶码：尾数溢出可右规挽救（阶码+1），阶码上溢才是真溢出，阶码下溢按 0 处理。",
 mem:"「对尾规舍溢」五字诀。<b>舍入看保护位 G / 舍入位 R / 粘滞位 S 三位</b>。",
 exam:"步骤排序/手算结果，选择题高频。"},
{ch:"num",name:"奇偶·海明·CRC 校验",def:"奇偶校验只能发现奇数位错、不能纠错；海明码 2^k ≥ n+k+1 可纠 1 位错；CRC 用生成多项式做模 2 除法，余数作校验位。",
 mix:"海明码「纠 1 检 2」需再加一位全校验位。CRC 校验位数 = 生成多项式最高次数；模 2 除法就是异或、不借位。校验能力与码距有关：纠 1 位错需码距 ≥3。",
 mem:"模 2 除法 = 只做异或的除法。",
 exam:"求海明校验位数 / CRC 余数。⚠️ <b>2027 版王道第 2 章正文已无校验码一节，该章考纲也未列入</b>（考纲只列数制与编码 / 运算方法和运算电路 / 整数 / 浮点数），本卡按通用知识保留，复习优先级排在本章其余卡之后。"},
{ch:"num",name:"大小端与边界对齐",def:"大端：高字节存低地址（符合书写习惯）；小端：低字节存低地址。边界对齐：数据按自身长度的整数倍地址存放。",
 mix:"给内存转储图判断端序时，先找最高有效字节的位置。对齐会浪费空间但一次访存取全数据；不对齐省空间但可能两次访存。结构体大小要算入填充字节。",
 mem:"大端像人写数：先写高位。",
 exam:"结合 C 结构体/联合体考察，408 特色。"},

{ch:"num",name:"⚠️ 三个偏置值别混：2ⁿ / 2^(k−1) / 2^(k−1)−1",def:"<b>定点移码</b>偏置 <b>2ⁿ</b>（n 为数值位数）；<b>王道图 2.13 那种教学格式</b>（7 位阶码）偏置 <b>2^(k−1)</b> = 64；<b>IEEE 754 阶码</b>偏置 <b>2^(k−1) − 1</b>，单精度 <b>127</b>、双精度 <b>1023</b>。",
 mix:"⚠️ <b>只有 IEEE 754 那个「减了 1」</b>，减这个 1 是为了把阶码字段的<b>全 0 与全 1 两个编码空出来做特殊值</b>（±0 / 非规格化数 / ±∞ / NaN），代价是规格化阶码只能用 1~254。<br>连带后果：<b>「移码 = 补码最高位取反」这条捷径在 IEEE 754 里<u>不成立</u></b>（那里偏置不是 2ⁿ）。",
 mem:"128 是数学上的中点，127 是 IEEE 为腾格子挪了一格。",
 exam:"偏置写成 128 是最常见的错法，一错整道 IEEE 754 大题全废。"},
{ch:"num",name:"⚠️ CF 与 OF：两个溢出标志各归谁",def:"<b>OF = Cn ⊕ Cn−1</b>，<b>仅对有符号数有意义</b>；<b>CF = Sub ⊕ Cout</b>，<b>仅对无符号数有意义</b>；<b>SF</b> = 结果最高位（仅有符号）；<b>ZF</b> = 结果全 0（<b>有/无符号都有意义</b>）。",
 mix:"⚠️ <b>硬件两个都算，用哪个由程序员决定</b>——「一套电路，两种语义」。同一次运算，<b>两个结论可以相反</b>：书上现成反例 <code>010 + 011 = 101</code>，OF = 1 但当无符号看 2+3=5 根本没溢出（CF = 0）。<br>⚠️ 所以题目问「是否溢出」时，<b>先问一句「当作什么数」</b>；问「OF 怎么产生」必须答 Cn ⊕ Cn−1，答「看符号」不给分。",
 mem:"OF 给有符号看，CF 给无符号看，ZF 谁都能看。",
 exam:"2018、2022–2024 连考四年；常与「同一次运算两个结论」一起问。"},
{ch:"num",name:"⚠️ 减法的 CF 要取反：CF = Sub ⊕ Cout",def:"<b>加法（Sub=0）：CF = Cout</b>（有进位即溢出）；<b>减法（Sub=1）：CF = ~Cout</b>（<b>没有</b>进位才是借位、才是溢出）。合起来就是 <b>CF = Sub ⊕ Cout</b>。",
 mix:"⚠️ <b>减法直接抄 Cout 当 CF 是标准错法</b>，而且错项常按这个设。<br>直觉：减法在硬件里是 <code>X + ~Y + 1</code>，等价于 <b>X − Y + 2ⁿ</b>——<b>够减时那个 2ⁿ 会以进位的形式冒出来</b>，所以<b>有进位 = 够减 = 不借位</b>。<br>⚠️ 而 OF 不分加减，永远是 Cn ⊕ Cn−1。",
 mem:"加法「有进位就出事」，减法「没进位才出事」。",
 exam:"sub 指令的 CF/OF 判断，2018、2023、2025 均考。"},
{ch:"num",name:"⚠️ 比大小两套规则：无符号 ZF→CF，有符号 ZF→OF⊕SF",def:"执行 A − B 后——<b>无符号</b>：ZF=1 ⟹ A=B；ZF=0 且 CF=0 ⟹ A&gt;B；CF=1 ⟹ A&lt;B。<b>有符号</b>：ZF=1 ⟹ A=B；ZF=0 且 <b>OF⊕SF=0</b> ⟹ A&gt;B；ZF=0 且 <b>OF⊕SF=1</b> ⟹ A&lt;B。",
 mix:"⚠️ 两套规则<b>骨架完全一样</b>：先 ZF 判等，再看一个「方向位」。差别只在——<b>无符号一个 CF 就够，有符号要 OF ⊕ SF</b>。<br><b>为什么有符号多一个 OF？因为溢出会把符号位翻反</b>，不异或纠正就会把 3−(−3)=6 判成 A&lt;B。<br>⟹ 这正是 <b>ch4 条件转移指令分两套</b>的原因：JA/JB（无符号，查 CF/ZF）与 JG/JL（有符号，查 SF/OF/ZF）。",
 mem:"无符号看借位；有符号看「符号位有没有被溢出骗了」。",
 exam:"2022–2024 连考三年，常给标志位组合反推大小关系。"},
{ch:"num",name:"⚠️ 三种取整方向：向负无穷 / 向零 / 就近向偶",def:"<b>补码算术右移</b>：<b>向负无穷</b>（−7 &gt;&gt; 1 = <b>−4</b>）。<b>C 的 <code>/</code> 与 float→int</b>：<b>向零</b>（−7/2 = <b>−3</b>；(int)−3.9 = <b>−3</b>）。<b>IEEE 754 默认舍入</b>：<b>就近，中点向偶数</b>。",
 mix:"⚠️ <b>三者对正数结果相同，对负数或中点各不相同</b>——命题人正是靠这一点设陷阱。<br>⟹ 判断题「<code>x&gt;&gt;1</code> 与 <code>x/2</code> 结果总是相同」是<b>错的</b>（负奇数差 1）；<b>编译器不能把有符号除 2 直接优化成算术右移</b>（要先加偏置修正），但<b>乘法可以随便换成移位</b>。<br>⚠️ 另有第四种：ch3 算地址位数、页数用的是<b>数学上的向上取整 ⌈⌉</b>。",
 mem:"移位向下、C 除法向零、浮点向偶。",
 exam:"2018 逻辑右移 vs 算术右移；类型转换题常暗含向零截断。"},
{ch:"num",name:"⚠️ 隐藏位：23 位尾数 = 24 位有效数字（但非规格化数没有）",def:"规格化 IEEE 754 数的<b>尾数最高位恒为 1，不显式存储</b>，隐含在小数点之前。⟹ <b>单精度 23 位尾数实际提供 24 位有效数字，双精度 52 位提供 53 位</b>。",
 mix:"⚠️ 三层用法都要记：<b>① 拆机器数算真值时要手动补回那个 1</b>（写成 1.f，不是 .f）；<b>② 阶码全 0 的非规格化数<u>没有</u>隐藏位</b>（用 0.f）；<b>③ 对阶右移时，隐藏位要先还原到尾数最高位再一起右移</b>，不还原就丢掉了最大的那一位。<br>⚠️ 有效位数问「多少位」答 <b>24</b> 不是 23，陷阱选项清一色是 23。",
 mem:"「藏一个 1，白赚一位精度」；凡见阶码全 0，先问「这里没有隐藏位」。",
 exam:"2017、2018、2024 三年考有效位；拆装题每年都要用。"},
{ch:"num",name:"⚠️ 非规格化数的指数是 −126，不是 −127",def:"阶码字段虽为全 0，但 IEEE 754 <b>规定非规格化数的指数按 −126 算</b>（双精度 −1022），<b>不是按 e − 127 公式算出来的 −127</b>；且<b>不使用隐藏位</b>，值 = ±2⁻¹²⁶ × (0.f)。",
 mix:"⚠️ <b>这是习题里最常见的错法。</b>原因：这样才能与最小规格化数 1.0×2⁻¹²⁶ <b>无缝衔接</b>——最大的非规格化数 0.111…1×2⁻¹²⁶ 正好紧邻它下方；按 −127 算中间会凭空多出一个缺口，「渐进下溢」就不渐进了。<br>⟹ <b>最小非规格化正数 = 2⁻¹²⁶ × 2⁻²³ = 2⁻¹⁴⁹</b>（机器数 <code>00000001H</code>）。",
 mem:"非规格化数的指数 = 最小规格化数的指数，差别只在 1.f 与 0.f。",
 exam:"2017、2023 考特殊浮点数；2⁻¹⁴⁹ 的来历常单独出选择题。"},
{ch:"num",name:"⚠️ 阶码字段 e 与指数真值 E 差 127",def:"<b>阶码字段 e</b>：存在机器里的那 8 位，<b>按无符号读，规格化数取值 1 ~ 254</b>。<b>指数真值 E = e − 127</b>：<b>范围 −126 ~ +127</b>。",
 mix:"⚠️ 题目问「阶码是多少」<b>可能指两件事</b>：问字段答 <b>254（1111 1110）</b>，问真值答 <b>+127</b>，<b>答错一个就是零分</b>。<br>⚠️ <b>「阶码全 1（255）」是保留编码，不是最大规格化阶码</b>——最大是 254，<b>这一格之差就是浮点上溢判断的全部内容</b>。<br>卷面务必写「e = …，E = e − 127 = …」两行，这是采分点。",
 mem:"字段无符号读 1~254，真值 −126~+127，差 127。",
 exam:"综合题第一问必用；也是「为什么规格化阶码只到 254」的答案。"},
{ch:"num",name:"⚠️ C 整型转换四象限：先扩展、后重解释",def:"<b>字长变了</b> ⟹ 位扩展（<b>补什么看<u>源类型</u>的符号性</b>：无符号补 0、有符号补符号位）或位截断（丢高位留低位）。<b>符号性变了</b> ⟹ <b>位模式一个不动，只换一把尺子读</b>。",
 mix:"⚠️ <b>两个都变时必须按顺序：先按源类型扩展，再按目标类型重解释；顺序反了答案就错。</b><br>例（2025 真题）：<code>short x = −4321</code> → <code>unsigned int</code>，先<b>符号</b>扩展成 <code>0xFFFFEF1F</code>，再当无符号读 = <b>4294962975</b>；<b>先读成 61215 再扩展是标准错法</b>，而 61215 就摆在选项里。<br>⚠️ <b>扩展补什么与目标类型无关</b>，只看源类型。",
 mem:"两个开关：变不变字长 × 变不变符号性；都变则先扩后解。",
 exam:"2012 / 2016 / 2019 / 2024 / 2025 五年，各占四象限的一格。"},
{ch:"num",name:"⚠️ 位截断不报错；截断后值不变的条件",def:"长类型转短类型时<b>直接丢弃高位、只保留低位</b>，<b>不触发任何异常或错误报告</b>。<b>截断后值不变，当且仅当被截掉的高位是低半部分的符号扩展</b>（无符号则为全 0）。",
 mix:"⚠️ 题目会给一段「看起来很正常」的赋值，诱你以为编译器会拦下来。<code>int x = 165537</code>（0x000286A1）转 <code>short</code> ⟹ 只留 <code>0x86A1</code> = <b>−31071</b>，与原值毫无关联。<br>⟹ <b>这与乘法溢出判据是同一句话</b>：把 2n 位乘积砍成 n 位，<b>无符号看「高 n 位全 0」，有符号看「高 n+1 位全相同」</b>。",
 mem:"看到赋值/强转，先数位数、再画位模式，绝不在十进制层面推。",
 exam:"2024 考 int→short→int 两次转换；乘法溢出题用同一判据。"},
{ch:"num",name:"⚠️ 「字」≠「字长」：五个近义词分清",def:"<b>机器字长</b> = CPU 内部整数运算数据通路宽度（≈ 通用寄存器宽度），「32 位机」指的就是它。<b>字（word）</b> = <b>体系结构定义的逻辑单位</b>，x86 里<b>永远是 16 位</b>（32 位叫双字）。",
 mix:"⚠️ <b>「某机字长 32 位」与「某机一个字为 16 位」可以同时成立，不矛盾</b>——字是架构层面的约定，字长体现硬件实际处理能力。<br>⚠️ 加上后面三章的，一共五个近义词：<b>存储字长</b>（一个存储单元的位数，ch3）、<b>指令字长</b>（一条指令占多少位，ch4）、<b>数据总线宽度</b>（一次并行传多少位，ch6）。<b>它们可以互不相等。</b>",
 mem:"见到「字」必回题干找定义，别默认等于字长。",
 exam:"组原前四章最常见的暗错源；ch3 的地址位数计算首先卡在这里。"},
{ch:"num",name:"⚠️ 大小端两种问法；逆序的是字节不是位",def:"<b>大端</b>：MSB 存低地址 ⟹ 与标准十六进制<b>书写顺序一致</b>（照抄）。<b>小端</b>：LSB 存低地址 ⟹ 与书写顺序<b>相反</b>（倒抄）。",
 mix:"⚠️ <b>两种问法要先认出来</b>：① <b>给数值问存放顺序</b>——先按十六进制写出机器数，再决定照抄还是倒抄；② <b>给内存字节问数值</b>（反汇编型）——<b>小端要把字节逆序拼回去</b>。<br>⚠️ <b>逆序的是「字节」，不是位</b>：每个字节内部的 8 位顺序<u>不变</u>（64H 还是 64H，不会变成 46H）。这是最常见的错法。<br>⟹ <b>网络字节序是大端</b>，所以 x86 主机收发要做字节序转换。",
 mem:"「大端与书写顺序一致」记这一条，另一条自动是反面。",
 exam:"2016 / 2018 / 2019 / 2023 / 2024 / 2025 六年；常与结构体对齐复合。"},
{ch:"num",name:"⚠️ 结构体对齐：两条规则，最容易漏尾部填充",def:"① <b>每个成员的起始地址必须是其对齐值的整数倍</b>（char 1 / short 2 / int·float 4 / double 8）；② <b>结构体总大小必须是<u>最大成员对齐值</u>的整数倍</b>，不足则<b>尾部填充</b>。",
 mix:"⚠️ <b>第 ② 条最容易漏。</b>书上例子：<code>struct A{int a; char b; short c;}</code> = <b>8</b> 字节；<code>struct B{char b; int a; short c;}</code> = <b>12</b> 字节——<b>成员完全相同、只是声明顺序不同就多占 50%</b>（B 算到 10 就收手是标准错法，还要补到 12）。<br>⚠️ <b>C 标准要求按声明顺序布局，编译器不会替你重排</b>；省空间的排法 = <b>按对齐值从大到小声明</b>。",
 mem:"从 0 起，每个成员先把偏移推到它对齐值的倍数；最后把总长推到最大对齐值的倍数。",
 exam:"2012、2020、2025 三年，且都与小端复合成一道题。"},
{ch:"num",name:"⚠️ 对齐+小端复合题：三步走，顺序不能颠倒",def:"① <b>先算对齐布局</b>（只与对齐规则有关，与大小端无关）→ ② <b>再定每个成员的机器数</b>（补码 / IEEE 754）→ ③ <b>最后逐个成员按小端倒序填字节</b>。",
 mix:"⚠️ <b>第 ③ 步的坑：逐个成员分别倒序，不是把整个结构体倒过来</b>——结构体是若干独立变量的拼接，<b>大小端只作用在单个变量内部</b>；<b>填充字节不参与任何倒序</b>，成员之间的先后顺序也不受影响。<br>例：<code>struct S{char a; int b; short c;}</code>，a=0x41、b=0x12345678、c=0x0ABC，从 0x0000 起、小端 ⟹ <code>41 -- -- -- | 78 56 34 12 | BC 0A | -- --</code>，sizeof = <b>12</b>。",
 mem:"先排位置，再算机器数，最后才倒字节。",
 exam:"2012 / 2020 / 2025，本章两根主梁之一（另一根是 IEEE 754 拆装）。"},
{ch:"num",name:"⚠️ 三张运算器结构图：只差三处",def:"<b>无符号乘</b>：判 y₀ 一位 / ALU 只「加」/ <b>逻辑右移</b> / 溢出判据 <b>P ≠ 0</b>。<b>补码乘（Booth）</b>：判 y₀y₋₁ 两位 / ALU「加·减」/ <b>算术右移</b> / 溢出判据 <b>P 不是 Y 的符号扩展</b>。<b>除法</b>：试商比较 / ALU「加·减」/ <b>左移</b> / 商在 Q、余数在 R。",
 mix:"⚠️ <b>移位方向是最容易记混、也最容易被考的一格。</b>记忆锚：<b>乘法「从低位往高位攒」⟹ 右移；除法「从高位往低位啃」⟹ 左移</b>——手算竖式时你干的正是这两件事。<br>⚠️ 乘法结果在<b>寄存器对 [P:Y]</b>（P 高 32 位、Y 低 32 位），到 ch4 就是 x86 的 <b>EDX:EAX</b>。<br>⚠️ <b>补码除法与无符号除法的唯一初始化差别</b>：余数寄存器 R 要<b>填被除数的符号位</b>（符号扩展），无符号则填 0。",
 mem:"乘右除左；无符号只加，有符号加减。",
 exam:"2019–2021、2025 各考一次，全部只考差别，不考手算。"},
{ch:"num",name:"⚠️ 除法的三条「唯一」",def:"① <b>两个 n 位无符号数相除永远不溢出</b>；② <b>补码除法的商溢出只有一种情形：−2ⁿ⁻¹ ÷ (−1)</b>；③ <b>快速退出</b>：|被除数| &lt; |除数| ⟹ 商 0、余数 = 被除数，<b>跳过全部迭代</b>。",
 mix:"⚠️ 命题人不会让你手算 32 位除法，<b>只考这三条边界</b>。<br>第 ① 条的理由：最坏是 (2ⁿ−1) ÷ 1 = 2ⁿ−1，恰好装得下。<br>第 ② 条的根源是 <b>补码表示范围不对称</b>（|最小负数| 超出正数区间）——与 <code>−(−128)</code>、<code>abs(−128)</code> 溢出是<b>同一件事</b>。<br>第 ③ 条就是「执行时间最短的情况」这一问的答案。<br>⚠️ 另：除零异常<b>由硬件捕获，经中断向量表跳转</b>（通向 ch7 与 OS）。",
 mem:"无符号永不溢，补码只溢一种，够不着就直接退。",
 exam:"2025 连考三问（异常处理 / 除法器结构 / 初始化步骤）。"},
{ch:"num",name:"⚠️ 加法器减法输入端是 ~Y，不是 [−Y]补",def:"减法时送进加法器的是 <b>~Y（只按位取反）</b>，那个「加 1」<b>由 Cin = Sub = 1 完成</b>。控制信号 <b>Sub 一根线同时干两件事</b>：选 MUX 的哪一路 + 作为最低位进位。",
 mix:"⚠️ <b>题目问「减法时加法器两个输入端分别是什么」，填 [−Y]补 是标准错法</b>（书专门加注意栏警告）——[−Y]补 = ~Y + 1，<b>那个 +1 已经被 Cin 领走了，不能算两次</b>。<br>推导：Y + ~Y = 2ⁿ − 1 ⟹ 2ⁿ − Y = ~Y + 1 ⟹ <b>X − Y = X + ~Y + 1 − 2ⁿ</b>，其中减掉的 2ⁿ 就是被丢弃的高位进位。",
 mem:"反相器只会取反，它不会加法。",
 exam:"2011 考补码加法器的实现原理；Cin 的值就是 Sub 本身，是常见填空答案。"},
{ch:"num",name:"⚠️ 右规只需一次，左规可能多次；大数吃小数",def:"<b>右规</b>（结果形如 1×.×××）：尾数右移一位、阶码加 1，<b>只需一次</b>。<b>左规</b>（结果形如 0.0…1×××）：尾数左移一位、阶码减 1，<b>可能多次</b>。",
 mix:"⚠️ 这不是经验而是能证明的：两个规格化尾数 ∈ [1,2)，<b>和 ∈ [2,4)，最多多出一位整数位</b> ⟹ 右移一次必回到 [1,2)；而<b>相减会大量抵消高位</b>，前导零可以很多。<br>⟹ 判断题「浮点加法后可能需要多次右规」是<b>错的</b>。<br>⚠️ 相关的另一头是<b>大数吃小数</b>：阶差很大时小数被右移到有效位全没，<code>1e8 + 1.0 == 1e8</code>（float）。对策是<b>从小到大排序后再累加</b>。",
 mem:"加法最多多一位（右规一次），减法能塌一大截（左规多次）。",
 exam:"2009 考浮点加减；2017 综合题第 4 问考舍入使结果增大。"},
{ch:"num",name:"⚠️ 浮点溢出只看阶码；范围与精度此消彼长",def:"<b>浮点数的溢出由「阶码是否超出可表示范围」决定</b>；<b>尾数溢出可通过右规修正，不算溢出</b>。另：<b>阶码的位数决定表示范围，尾数的位数决定精度</b>。",
 mix:"⚠️ 选项里「尾数溢出导致结果错误」「尾数右移会引起溢出」<b>一律错</b>。<br>⚠️ <b>总位数固定时范围与精度必然此消彼长</b>（阶码多一位则范围翻番、尾数少一位）——这也是「同字长下浮点比定点范围大但精度低」的原因。<br>⚠️ 反直觉的一条：<b>浮点数能表示的「个数」不比定点数多</b>（书 p.75 常见问题 3）——范围大只意味着被摊得更稀疏，而且 ±0 / ±∞ / NaN 还占掉一批编码（<b>光 NaN 就占了 2×(2²³−1) 个</b>）。",
 mem:"溢出只问阶码；范围归阶码、精度归尾数。",
 exam:"2015 考浮点溢出判断；「浮点比定点能表示更多的数」是经典错项。"},
{ch:"mem",name:"存储层次与局部性",def:"Cache—主存层解决速度不匹配（硬件自动，对所有程序员透明）；主存—辅存层解决容量（硬件+OS，对应用程序员透明）。",
 mix:"时间局部性 = 刚用过的还会用（循环变量）；空间局部性 = 邻居马上被用（顺序数组）。二维数组按行访问空间局部性好、按列差——408 考过程序改写对比。",
 mem:"快的贵而小，慢的廉而大，靠局部性粘合。",
 exam:"局部性分析选择题高频。"},
{ch:"mem",name:"SRAM vs DRAM",def:"SRAM 用触发器、不刷新、快而贵 → Cache；DRAM 用电容、需定期刷新、密度高 → 主存。",
 mix:"DRAM 刷新按行进行、对 CPU 透明；有集中/分散/异步三种刷新方式。DRAM 地址复用（行/列分两次送），引脚约减半。DRAM 读出是破坏性的，读后要再生。",
 mem:"S=Static 稳得住；D=Dynamic 会漏电要充。",
 exam:"刷新与引脚数计算，选择题高频。"},
{ch:"mem",name:"主存扩展与片选",def:"位扩展（加宽字长，各片同时选中）、字扩展（加大容量，高位地址译码片选）、字位同时扩展。",
 mix:"芯片数 = 总容量 / 单片容量。字扩展时低位地址线接每片、高位做片选；由起始地址反推片选逻辑是大题套路。8K×8 芯片组成 64K×16 需 8K×8 → 16 片（8 组×2 片）。",
 mem:"位扩展并排站，字扩展排队叫号。",
 exam:"求芯片数/地址范围/片选信号，大题曾多次考。"},
{ch:"mem",name:"多模块存储器",def:"低位交叉编址：连续地址分布在不同模块，可流水存取，m 模块理论带宽提升至 m 倍。",
 mix:"高位交叉编址只是单纯扩容（连续访问集中在一个模块，不加速）。流水存取时间 = T + (n−1)r（T 存取周期，r 总线传送周期，需 m ≥ T/r）。存取周期 > 存取时间（含恢复时间）。",
 mem:"低位交叉像发牌，连续地址轮流落到各家。",
 exam:"连续读 n 个字的总时间计算，选择题高频。"},
{ch:"mem",name:"Cache 三种映射",def:"直接映射：行号 = 块号 mod 行数；全相联：任意行；组相联：组间直接、组内全相联。地址划分 = 标记 + 组号/行号 + 块内偏移。",
 mix:"划分口诀「从右往左切」：先块内偏移（log₂块大小），再组号/行号，剩下全是标记。直接映射冲突率高但无需替换算法；全相联标记最长、比较器最多。n 路组相联 = 每组 n 行。",
 mem:"直接=固定车位，全相联=随便停，组相联=按楼层随便停。",
 exam:"年年必考：给地址求映射到哪一组/命中判断。"},
{ch:"mem",name:"Cache 容量与命中率计算",def:"Cache 总位数 = 数据阵列 + 标记阵列（tag+有效位+脏位+替换算法位）；平均访问时间 = H×t_c + (1−H)×(t_c+t_m) 或 t_c + (1−H)×缺失惩罚。",
 mix:"算总容量最易漏：有效位每行 1 位必有；写回法才有脏位；LRU 位按每行 log₂(路数)。命中率与块大小不是单调关系（太大则行数少、冲突多）。",
 mem:"「数据+标记+三小位」逐项点名再相加。",
 exam:"总容量/平均访问时间计算，大题选择都爱考。"},
{ch:"mem",name:"Cache 替换与写策略",def:"替换：LRU/FIFO/随机（直接映射无需替换算法）。写命中：写直达（同时写主存）vs 写回（只写 Cache 置脏位）；写不命中：写分配 vs 非写分配。",
 mix:"经典搭配：写回+写分配、写直达+非写分配。写直达配写缓冲避免 CPU 等待；写回主存数据可能过期（一致性问题的来源）。",
 mem:"写直达「随手同步」，写回「攒着一起还」。",
 exam:"策略辨析+写操作访存次数计算，高频。"},
{ch:"mem",name:"TLB·Page·Cache 命中组合",def:"页式虚存访存顺序：虚地址 → 查 TLB（缺则查页表）→ 物理地址 → 查 Cache（缺则访主存）。",
 mix:"⚠️ 不可能的组合：TLB 命中而页表缺失（TLB 是页表子集）；缺页而 Cache 命中（数据不在主存就不可能在 Cache）。可能的三种：全命中；TLB 缺/页命中；缺页则全缺。",
 mem:"下级缺，上级必缺——子集关系推一切。",
 exam:"判断组合可能性，408 考过大题。"},
{ch:"mem",name:"磁盘与固态硬盘 SSD",def:"磁盘容量 = 面数×磁道数×扇区数×扇区大小；SSD 基于闪存：按页读写、按块擦除，需磨损均衡。",
 mix:"SSD 随机读远快于磁盘，但写前须擦除整块 → 写放大；磨损均衡把写操作摊匀延长寿命。磁盘转速 rpm 决定旋转延迟（平均半圈）。",
 mem:"SSD 像铅笔字：写前要把整页擦干净。",
 exam:"SSD 特性是新考纲考点，概念选择题。"},
{ch:"mem",name:"RAID",def:"RAID0 条带化无冗余；RAID1 镜像；RAID5 分布式奇偶校验，容 1 盘故障。",
 mix:"RAID0 提升速度但可靠性反而低于单盘（任一盘坏全坏）；RAID1 容量减半；RAID5 有效容量 = (n−1)/n。「RAID 都能提高可靠性」是错误选项（RAID0 不能）。",
 mem:"0 求快，1 求稳，5 求平衡。",
 exam:"概念选择题偶考。"},

{ch:"ins",name:"指令格式与扩展操作码",def:"指令 = 操作码 + 地址码；扩展操作码：短操作码留出部分编码作为长操作码的前缀空间。",
 mix:"计算「还能定义多少条 x 地址指令」：上层每留一个编码，下层就多 2^(地址字段位数) 个编码空间；已用编码不能是更长码的前缀。定长指令字中操作码变长是常态。",
 mem:"像电话区号：短号用了的开头，长号不能再用。",
 exam:"扩展操作码计算题高频。"},
{ch:"ins",name:"寻址方式",def:"立即（数在指令中）、直接（地址在指令中）、间接（地址的地址）、寄存器、寄存器间接、相对（PC+偏移）、基址、变址。",
 mix:"⚠️ 基址 vs 变址：基址寄存器面向系统、由 OS 管理（重定位用），基址不变形式地址变；变址寄存器面向用户、程序员可改（数组遍历），形式地址不变变址变。间接寻址访存次数比直接多一次。",
 mem:"基址是「起点在哪」，变址是「走到第几个」。",
 exam:"求有效地址/访存次数，年年见。"},
{ch:"ins",name:"相对寻址计算",def:"转移目标 = PC + 偏移量；⚠️ 计算时 PC 已经指向下一条指令（取指后自动加了指令长度）。",
 mix:"「取指后 PC 自增」是最大坑：偏移量 = 目标地址 −（本指令地址 + 指令长度）。偏移量是补码，可负。相对寻址的意义：程序整体搬家不用改转移指令（位置无关）。",
 mem:"从「下一条」起跳，不是从本条。",
 exam:"求转移目标/偏移量，选择题高频易错。"},
{ch:"ins",name:"RISC vs CISC",def:"RISC：指令定长、种类少、只有 Load/Store 访存、寄存器多、大多单周期、硬布线为主、利于流水线。CISC 反之。",
 mix:"「RISC 指令少所以程序短」错——完成同样功能 RISC 的指令条数反而多。RISC 也可以有微程序（以硬布线为主）。x86 是 CISC 但内部翻译成类 RISC 微操作执行。",
 mem:"RISC = 乐高小积木，CISC = 整块预制件。",
 exam:"特征对比选择题常客。"},
{ch:"ins",name:"机器级表示：栈帧与 call/ret",def:"call 压入返回地址并跳转；ret 弹出返回地址。栈帧含返回地址、旧帧指针（ebp）、局部变量；参数按约定压栈或用寄存器传。",
 mix:"栈向低地址增长，push 先减 sp；ebp 是当前帧基准，局部变量在 ebp 下方、参数在上方。看懂给出的汇编片段与 C 对照即可，408 不要求默写汇编。",
 mem:"一次调用一层帧，ebp 是这层的地标。",
 exam:"C 与汇编对照阅读题，新考纲趋势题型。"},
{ch:"ins",name:"指令执行周期",def:"取指周期 →（间址周期）→ 执行周期 →（中断周期），由标志触发器区分。",
 mix:"取指周期做的事对所有指令相同：取指令、PC 自增。间址周期只为间接寻址服务。中断周期由硬件完成保存断点、关中断——这是「中断隐指令」的舞台。",
 mem:"取—（转）—做—（应答）。",
 exam:"「PC 自增发生在哪个阶段」类选择题高频。"},

{ch:"cpu",name:"CPU 寄存器与可见性",def:"程序员可见：通用寄存器、PC、PSW（标志）；不可见：MAR、MDR、IR、微指令寄存器。",
 mix:"PC 对程序员可见（转移指令要用它），IR 不可见——两者常被出题互换。位数：PC 与 MAR ≥ 编址空间位数，MDR = 存储字长，IR = 指令字长。",
 mem:"你能「用指令碰到」的才叫可见。",
 exam:"判断可见性 + 位数计算，选择题年年见。"},
{ch:"cpu",name:"单总线数据通路与微操作",def:"CPU 内部一条总线连接各寄存器；一个节拍内只允许一个部件向总线发送数据。",
 mix:"ALU 是组合电路无记忆，输入端必须接暂存器（单总线下两个操作数不能同时上总线）。写微操作序列：取指固定三步 PC→MAR、M(MAR)→MDR→IR、PC+1；执行阶段按寻址方式展开。",
 mem:"一条马路一次只过一辆车。",
 exam:"补全微操作序列/控制信号，大题热点。"},
{ch:"cpu",name:"硬布线 vs 微程序",def:"硬布线：控制信号由组合逻辑直接产生，快但难改（RISC）；微程序：每条机器指令对应控存里的一段微程序，灵活但慢（CISC）。",
 mix:"一条微指令含多个微命令（并行发出）；微程序段数 ≈ 机器指令条数（+公共的取指微程序）。水平型微指令：并行强、字长长、程序短；垂直型相反。控存容量 = 微指令条数 × 微指令字长。",
 mem:"硬布线是焊死的电路，微程序是查表念稿。",

/* ===== 渲染（与其余卡库同模板） ===== */
const panel=document.getElementById('panel');
const vg=document.getElementById('vgrid');
const isMobile=()=>window.innerWidth<=900;
let curFilter='all', curIdx=-1;

function cardHTML(d){
  return `<div class="wcard">
    <div class="head"><span class="w">${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
    <div class="row r-def"><b>一句话定义</b>${d.def}</div>
    <div class="row r-conf"><b>易混辨析（408 命脉）</b>${d.mix}</div>
    <div class="row r-mem"><b>怎么记</b>${d.mem}</div>
    <div class="row r-exam"><b>408 考法</b>${d.exam}</div>
    ${d.src?`<div class="r-src">📦 提炼自：${d.src}</div>`:''}
    <div class="r-link">🔗 真题出处：待错题页生成后回链点亮</div>
  </div>`;
}
function showCard(i){
  const d=K[i]; curIdx=i;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.toggle('active', +e.dataset.i===i));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>`+cardHTML(d);
  if(isMobile())panel.classList.add('open');
}
function quiz(){
  const pool=K.map((d,i)=>[d,i]).filter(([d])=>curFilter==='all'||d.ch===curFilter);
  const [d,i]=pool[Math.floor(Math.random()*pool.length)];
  curIdx=-1;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.remove('active'));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>
  <div class="wcard"><div class="head"><span class="w">🎲 ${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
  <div class="hint" style="padding:20px 6px;color:var(--muted);font-size:.85rem;text-align:center">先在心里说出<b>定义</b>和<b>易混点</b>……</div>
  <button class="reveal" onclick="showCard(${i})">想好了，看答案</button>
  <button class="reveal" style="background:none;border-color:var(--line);color:var(--muted)" onclick="quiz()">换一张</button></div>`;
  if(isMobile())panel.classList.add('open');
}
function renderGrid(f){
  curFilter=f; vg.innerHTML='';
  K.forEach((d,i)=>{
    if(f!=='all'&&d.ch!==f)return;
    const div=document.createElement('div');div.className='vitem';div.dataset.i=i;
    if(i===curIdx)div.classList.add('active');
    div.innerHTML=`<span class="chip">${CH[d.ch]}</span><div class="w">${d.name}</div><div class="cn">${d.def.length>38?d.def.slice(0,38)+'…':d.def}</div>`;
    div.addEventListener('click',()=>{showCard(i);if(!isMobile())window.scrollTo({top:0,behavior:'smooth'})});
    vg.appendChild(div);
  });
}
const fdiv=document.getElementById('filters');
const counts={};K.forEach(d=>counts[d.ch]=(counts[d.ch]||0)+1);
const fs=[['all','全部 '+K.length]].concat(Object.keys(CH).map(k=>[k,CH[k]+' '+counts[k]]));
fs.forEach(([k,label],j)=>{
  const b=document.createElement('button');b.className='fbtn'+(j===0?' on':'');
  b.innerHTML=label.replace(/ (\d+)$/,' <span class="cnt">$1</span>');
  b.addEventListener('click',()=>{document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderGrid(k)});
  fdiv.appendChild(b);
});
const qb=document.createElement('button');qb.className='quizbtn';qb.textContent='🎲 随机抽卡自测';
qb.addEventListener('click',quiz);fdiv.appendChild(qb);
/* 标题里的张数自动跟着 K 走——以后加卡不用再改标题 */
document.getElementById('ktot').textContent = K.length;
renderGrid('all');
</script>
</body>
</html>
