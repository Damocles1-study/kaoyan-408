const K = [

{ch:"mem",name:"主存扩展与片选",def:"位扩展（加宽字长，各片同时选中）、字扩展（加大容量，高位地址译码片选）、字位同时扩展。",

{ch:"mem",name:"Cache 容量与命中率计算",def:"Cache 总位数 = 数据阵列 + 标记阵列（tag+有效位+脏位+替换算法位）；平均访问时间 = H×t_c + (1−H)×(t_c+t_m) 或 t_c + (1−H)×缺失惩罚。",

{ch:"ins",name:"相对寻址计算",def:"转移目标 = PC + 偏移量；⚠️ 计算时 PC 已经指向下一条指令（取指后自动加了指令长度）。",
 mix:"「取指后 PC 自增」是最大坑：偏移量 = 目标地址 −（本指令地址 + 指令长度）。偏移量是补码，可负。相对寻址的意义：程序整体搬家不用改转移指令（位置无关）。",
 mem:"从「下一条」起跳，不是从本条。",
 exam:"求转移目标/偏移量，选择题高频易错。"},
{ch:"ins",name:"RISC vs CISC",def:"RISC：指令定长、种类少、只有 Load/Store 访存、寄存器多、大多单周期、硬布线为主、利于流水线。CISC 反之。",
 mix:"「RISC 指令少所以程序短」错——完成同样功能 RISC 的指令条数反而多。RISC 也可以有微程序（以硬布线为主）。x86 是 CISC 但内部翻译成类 RISC 微操作执行。",
 mem:"RISC = 乐高小积木，CISC = 整块预制件。",
 exam:"特征对比选择题常客。"},
{ch:"ins",name:"机器级表示：栈帧与 call/ret",def:"call 压入返回地址并跳转；ret 弹出返回地址。栈帧含返回地址、旧帧指针（ebp）、局部变量；参数按约定压栈或用寄存器传。",
 mix:"栈向低地址增长，push 先减 sp；ebp 是当前帧基准，局部变量在 ebp 下方、参数在上方。看懂给出的汇编片段与 C 对照即可，408 不要求默写汇编。",
 mem:"一次调用一层帧，ebp 是这层的地标。",
 exam:"C 与汇编对照阅读题，新考纲趋势题型。"},
{ch:"ins",name:"指令执行周期",def:"取指周期 →（间址周期）→ 执行周期 →（中断周期），由标志触发器区分。",
 mix:"取指周期做的事对所有指令相同：取指令、PC 自增。间址周期只为间接寻址服务。中断周期由硬件完成保存断点、关中断——这是「中断隐指令」的舞台。",
 mem:"取—（转）—做—（应答）。",
 exam:"「PC 自增发生在哪个阶段」类选择题高频。"},

{ch:"cpu",name:"CPU 寄存器与可见性",def:"程序员可见：通用寄存器、PC、PSW（标志）；不可见：MAR、MDR、IR、微指令寄存器。",
 mix:"PC 对程序员可见（转移指令要用它），IR 不可见——两者常被出题互换。位数：PC 与 MAR ≥ 编址空间位数，MDR = 存储字长，IR = 指令字长。",
 mem:"你能「用指令碰到」的才叫可见。",
 exam:"判断可见性 + 位数计算，选择题年年见。"},
{ch:"cpu",name:"单总线数据通路与微操作",def:"CPU 内部一条总线连接各寄存器；一个节拍内只允许一个部件向总线发送数据。",
 mix:"ALU 是组合电路无记忆，输入端必须接暂存器（单总线下两个操作数不能同时上总线）。写微操作序列：取指固定三步 PC→MAR、M(MAR)→MDR→IR、PC+1；执行阶段按寻址方式展开。",
 mem:"一条马路一次只过一辆车。",
 exam:"补全微操作序列/控制信号，大题热点。"},
{ch:"cpu",name:"硬布线 vs 微程序",def:"硬布线：控制信号由组合逻辑直接产生，快但难改（RISC）；微程序：每条机器指令对应控存里的一段微程序，灵活但慢（CISC）。",
 mix:"一条微指令含多个微命令（并行发出）；微程序段数 ≈ 机器指令条数（+公共的取指微程序）。水平型微指令：并行强、字长长、程序短；垂直型相反。控存容量 = 微指令条数 × 微指令字长。",
 mem:"硬布线是焊死的电路，微程序是查表念稿。",
 exam:"概念对比+控存容量计算，选择题高频。"},
{ch:"cpu",name:"流水线性能计算",def:"k 段流水线执行 n 条指令：T = (k+n−1)×Δt；吞吐率 = n/T；加速比 = kn/(k+n−1)；理想加速比 ≈ k。",
 mix:"流水线时钟周期取最慢段（加锁存延迟）——各段不均衡时提速受限于短板。装入(k−1 拍)与排空使实际性能低于理想。流水线提高的是吞吐率，单条指令的执行时间反而略增。",
 mem:"洗烘叠三台机器同时转，瓶颈是最慢那台。",
 exam:"吞吐率/加速比计算，年年见。"},
{ch:"cpu",name:"流水线三类冒险",def:"结构冒险（部件冲突）、数据冒险（RAW 为主）、控制冒险（转移指令）。",
 mix:"数据冒险首选转发（旁路）解决；⚠️ load-use 冒险转发也救不了，必须停顿一拍。结构冒险经典解法：指令 Cache 与数据 Cache 分离。控制冒险：分支预测、延迟槽。数一数要插几个气泡是标准计算。",
 mem:"「转发能救算术，救不了刚 load 的」。",
 exam:"判断冒险类型/算停顿拍数，大题选择都常考。"},
{ch:"cpu",name:"中断隐指令与屏蔽字",def:"中断隐指令 = 硬件自动完成：保存断点（PC/PSW）、关中断、取中断向量。屏蔽字动态调整「处理优先级」。",
 mix:"保存断点是硬件，保存通用寄存器现场是软件（服务程序做）。响应优先级由硬件排队器固定，处理优先级可用屏蔽字改——屏蔽字设计题：1 表示屏蔽，自己通常屏蔽自己和更低者。",
 mem:"隐指令 = 没有这条指令，硬件自己干了。",
 exam:"屏蔽字表格+画中断处理轨迹，考过大题。"},
{ch:"cpu",name:"超标量与多处理器概念",def:"超标量：每拍发射多条指令（空间并行）；超流水：把段切更细（时间并行）；VLIW 靠编译器打包。SISD/SIMD/MIMD 分类；多核共享主存。",
 mix:"SIMD = 一条指令多组数据（向量、GPU）；多核属于 MIMD。硬件多线程让一个核交替跑多个线程隐藏延迟。考纲只要求基本概念，不深入。",
 mem:"超标量是多车道，超流水是细工序。",
 exam:"概念选择题，新考纲增补点。"},

{ch:"bus",name:"总线分类与带宽",def:"片内总线 / 系统总线（数据、地址、控制）/ 通信总线；总线带宽 = 位宽 × 工作频率 / 8（B/s）。",
 mix:"数据线双向、地址线单向（CPU 发出）。突发（猝发）传送：一次地址、连续多个数据。计算带宽注意 MHz→次/秒、位→字节，以及「每几个周期传一次」的条件。",
 mem:"带宽 = 车道数 × 发车频率。",
 exam:"带宽计算选择题高频。"},
{ch:"bus",name:"同步 vs 异步定时",def:"同步：公共时钟统一节拍，速度快，适合高速近距离；异步：请求—应答握手，可靠灵活，适合速度差异大的设备。",
 mix:"异步按握手完整度分不互锁/半互锁/全互锁。半同步（时钟+WAIT 信号）折中。「同步方式效率一定高」不严谨——慢设备被迫按最慢者定节拍时反而浪费。",
 mem:"同步跳集体舞，异步打乒乓球。",
 exam:"概念辨析选择题。"},
{ch:"bus",name:"I/O 编址两种方式",def:"统一编址（内存映射 I/O）：端口占内存地址空间，用普通访存指令；独立编址：专用 IN/OUT 指令、独立地址空间。",
 mix:"统一编址不需要专用 I/O 指令但挤占内存空间、地址译码慢；独立编址指令短、译码快，但需要专门指令和控制线。x86 是独立编址、ARM 是统一编址。",
 mem:"统一 = 端口冒充内存单元。",
 exam:"两种方式优缺点辨析，选择题高频。"},
{ch:"bus",name:"查询·中断·DMA 开销对比",def:"程序查询全程占用 CPU；中断每传一个字/字符打断一次；DMA 整块传完才中断一次。",
 mix:"计算题套路：中断开销 = 中断次数 ×（响应+服务时间）；查询开销看查询频率×每次时间。高速设备用中断可能来不及响应（数据丢失）→ 必须 DMA。",
 mem:"CPU 被打扰的粒度：字符级 → 块级。",
 exam:"CPU 时间占用率计算，年年见。"},
{ch:"bus",name:"DMA 方式细节",def:"DMA 控制器代替 CPU 控制总线传数据；三种占用方式：停止 CPU 访存、周期挪用（窃取）、交替访问。",
 mix:"周期挪用最常用：DMA 与 CPU 冲突时 I/O 优先（数据不等人）。DMA 传输前初始化（源/目的地址、计数器）和结束后处理仍靠 CPU（中断服务）。DMA 数据不经过 CPU 寄存器。",
 mem:"挪用 = 趁 CPU 不用总线时偷偷搬。",
 exam:"「DMA 中 CPU 何时介入」选择题高频。"},
{ch:"bus",name:"I/O 接口的功能与组成",def:"接口 = 数据缓冲寄存器 + 状态/控制寄存器 + 地址译码 + 中断/握手逻辑，实现速度匹配、格式转换、通信控制。",
 mix:"「端口」指接口中可编址的寄存器（数据口/状态口/控制口），端口 ≠ 接口。状态口与控制口可以共用一个地址（读状态、写控制）。",
 mem:"接口是翻译官，端口是它的几个窗口。",
 exam:"接口组成/端口概念选择题中频。"}
];

/* ===== 渲染（与其余卡库同模板） ===== */
const panel=document.getElementById('panel');
const vg=document.getElementById('vgrid');
const isMobile=()=>window.innerWidth<=900;
let curFilter='all', curIdx=-1;

function cardHTML(d){
  return `<div class="wcard">
    <div class="head"><span class="w">${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
    <div class="row r-def"><b>一句话定义</b>${d.def}</div>
    <div class="row r-conf"><b>易混辨析（408 命脉）</b>${d.mix}</div>
    <div class="row r-mem"><b>怎么记</b>${d.mem}</div>
    <div class="row r-exam"><b>408 考法</b>${d.exam}</div>
    ${d.src?`<div class="r-src">📦 提炼自：${d.src}</div>`:''}
    <div class="r-link">🔗 真题出处：待错题页生成后回链点亮</div>
  </div>`;
}
function showCard(i){
  const d=K[i]; curIdx=i;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.toggle('active', +e.dataset.i===i));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>`+cardHTML(d);
  if(isMobile())panel.classList.add('open');
}
function quiz(){
  const pool=K.map((d,i)=>[d,i]).filter(([d])=>curFilter==='all'||d.ch===curFilter);
  const [d,i]=pool[Math.floor(Math.random()*pool.length)];
  curIdx=-1;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.remove('active'));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>
  <div class="wcard"><div class="head"><span class="w">🎲 ${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
  <div class="hint" style="padding:20px 6px;color:var(--muted);font-size:.85rem;text-align:center">先在心里说出<b>定义</b>和<b>易混点</b>……</div>
  <button class="reveal" onclick="showCard(${i})">想好了，看答案</button>
  <button class="reveal" style="background:none;border-color:var(--line);color:var(--muted)" onclick="quiz()">换一张</button></div>`;
  if(isMobile())panel.classList.add('open');
}
function renderGrid(f){
  curFilter=f; vg.innerHTML='';
  K.forEach((d,i)=>{
    if(f!=='all'&&d.ch!==f)return;
    const div=document.createElement('div');div.className='vitem';div.dataset.i=i;
    if(i===curIdx)div.classList.add('active');
    div.innerHTML=`<span class="chip">${CH[d.ch]}</span><div class="w">${d.name}</div><div class="cn">${d.def.length>38?d.def.slice(0,38)+'…':d.def}</div>`;
    div.addEventListener('click',()=>{showCard(i);if(!isMobile())window.scrollTo({top:0,behavior:'smooth'})});
    vg.appendChild(div);
  });
}
const fdiv=document.getElementById('filters');
const counts={};K.forEach(d=>counts[d.ch]=(counts[d.ch]||0)+1);
const fs=[['all','全部 '+K.length]].concat(Object.keys(CH).map(k=>[k,CH[k]+' '+counts[k]]));
fs.forEach(([k,label],j)=>{
  const b=document.createElement('button');b.className='fbtn'+(j===0?' on':'');
  b.innerHTML=label.replace(/ (\d+)$/,' <span class="cnt">$1</span>');
  b.addEventListener('click',()=>{document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderGrid(k)});
  fdiv.appendChild(b);
});
const qb=document.createElement('button');qb.className='quizbtn';qb.textContent='🎲 随机抽卡自测';
qb.addEventListener('click',quiz);fdiv.appendChild(qb);
renderGrid('all');
</script>
</body>
</html>
