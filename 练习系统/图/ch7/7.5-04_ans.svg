<text x="20" y="94" text-anchor="start" font-size="12" fill="#2b2b2b">H(a₁)=H(a₂)=H(a₃)=3（绿：同义词）　　H(b₁)=H(b₂)=5（红：另一组同义词）</text>
<path d="M 181 44 Q 204 28 227 44" fill="none" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#ah2e7d32)"/>
<path d="M 185 44 Q 252 10 319 44" fill="none" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#ah2e7d32)"/>
<path d="M 273 74 Q 319 90 365 74" fill="none" stroke="#c0392b" stroke-width="1.4" marker-end="url(#ahc0392b)"/>
<text x="20" y="118" text-anchor="start" font-size="12" fill="#2b2b2b">⚠️ a₃ 本该落 3，却被 b₁ 挡在 5、只能跑到 6：<tspan fill="#c0392b">挡住 a₃ 的 b₁ 不是它的同义词</tspan></text>
<text x="20" y="138" text-anchor="start" font-size="12" fill="#8a6d3b">⟹ 堆积 = 同义词的探测序列与非同义词的探测序列<tspan font-weight="bold">交织</tspan>在一起（选 C）</text>
<text x="20" y="172" text-anchor="start" font-size="12" fill="#8a6d3b">对照：链地址法把同义词收进各自的链，两组永不相干 ⟹ 不产生堆积</text>
