<svg width="1150" height="430" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 430" font-family="Georgia,serif">
<text x="16" y="26" font-size="14" fill="#8a8a8a">① 上层：对 A[7], A[15], …, A[8n−1] 做<tspan font-weight="bold" fill="#b0652f">顺序查找</tspan> —— 第 k 个索引结点在第 k 层，命中它需比较 k 次</text>
<text x="16" y="50" font-size="14" fill="#8a8a8a">② 下层：落到第 k 块后，在块内<tspan font-weight="bold" fill="#b0652f">剩下的 7 个</tspan>元素上做<tspan font-weight="bold" fill="#b0652f">折半查找</tspan>（块尾 A[8k−1] 已在上层比过）—— 再花 1~3 次</text>
