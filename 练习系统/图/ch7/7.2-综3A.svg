<text x="575.0" y="418" text-anchor="middle" font-size="13" fill="#8a8a8a">第 k 块内 8 个元素的比较次数：索引元素 A[8k−1] 为 k 次，块内 7 个依次为 k+1, k+2, k+2, k+3, k+3, k+3, k+3 —— 合计 8k+17</text>
