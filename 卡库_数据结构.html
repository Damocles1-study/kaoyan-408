const K = [
{ch:"lin",name:"O / Ω / Θ 渐进记号",def:"O 是渐进上界（≤），Ω 是渐进下界（≥），Θ 是紧界（=，同时满足上下界）。",
 mix:"「快排时间复杂度是 O(n²)」这话也对——O 只是上界，可以放宽。别把 最好/平均/最坏（对输入分情况）和 O/Ω/Θ（对函数取界）两套概念搅在一起：快排最坏 Θ(n²)、平均 Θ(n log n)，两者都可以再套 O 说法。",
 mem:"O 像 ≤，Ω 像 ≥，Θ 像 =。选择题遇到「以下说法正确的是」先把这两套概念拆开。",

{ch:"lin",name:"顺序表 vs 链表",def:"顺序表连续存储、按位访问 O(1)；链表指针链接、定位后插删 O(1)。",

 mem:"查得快/插得慢 ↔ 插得快/查得慢，鱼与熊掌。",

{ch:"lin",name:"头指针 vs 头结点",def:"头指针 = 指向链表第一个结点的指针（链表必有）；头结点 = 首元结点之前附加的哑结点（可有可无，为统一插删操作）。",

 mem:"指针必有，结点可选。",
 exam:"概念辨析选择题；写算法题时先声明是否带头结点。",src:""},
{ch:"lin",name:"循环链表与双链表",def:"循环链表尾结点指回表头；双链表每结点有 prior/next 两个指针，插删需改 4 个指针。",

{ch:"sq",name:"共享栈",def:"两个栈共用一个数组，栈底设在两端、相向生长，top0=−1 与 top1=maxsize 起步。",

 mem:"两人相向走，碰面即满。",

{ch:"sq",name:"循环队列判满",def:"数组 + 取模实现队列。常用「牺牲一格」：(rear+1)%M==front 为满，front==rear 为空。",

{ch:"sq",name:"出栈序列与 Catalan",def:"n 个元素依次入栈、任意时刻可出栈，合法出栈序列共 Catalan(n)=C(2n,n)/(n+1) 种。",
 mix:"判断某序列是否合法：对入栈序 1..n，出栈序列中任一元素后面、比它小的那些数必须严格降序（它们还压在栈里）。Catalan 四兄弟——括号匹配、栈混洗、n 结点二叉树、n 结点 BST——全是同一个数。",
 mem:"C₁=1, C₂=2, C₃=5, C₄=14, C₅=42。",

{ch:"sq",name:"中缀 → 后缀（逆波兰）",def:"借助运算符栈把中缀表达式转后缀；后缀求值只需一个操作数栈，无括号无歧义。",

{ch:"sq",name:"KMP 与 next 数组",def:"失配时主串指针不回溯，模式串按 next 数组右滑；next[j] = 模式串前 j−1 位中最长相等前后缀长度（+1，按王道 1 起下标）。",

 mem:"next = 失配后模式串「自己和自己对齐」能保留的最长部分。",
 exam:"手算 next / nextval 几乎必考一题。",src:""},

{ch:"tree",name:"n₀ = n₂ + 1",def:"任何二叉树：叶子数 = 度2结点数 + 1。",
 mix:"只对二叉树成立。推导：边数 = n−1（除根人人一条入边）= n₁+2n₂（按孩子数数边），联立即得。常见变形：完全二叉树给 n 求 n₀，或给 n₀ 求总结点范围。",
 mem:"同一堆边两种数法：按「入边」数 = 按「出边」数。",

{ch:"tree",name:"满二叉树 vs 完全二叉树",def:"满二叉树每层全满（高 h 共 2^h−1 结点）；完全二叉树 = 满二叉树从编号末尾连续删去若干结点（只许最底层右侧缺）。",
 mix:"完全二叉树度为 1 的结点数只能是 0 或 1 个；叶子只出现在最底两层；最后一个分支结点编号 ⌊n/2⌋。「满」是「完全」的特例，方向别反。",
 mem:"完全 = 满树砍尾巴。",
 exam:"给 n 求叶子数/高度/度1结点数的选择题高频。",src:"826 第5章"},
{ch:"tree",name:"完全二叉树的顺序存储",def:"按层从 1 编号：lchild=2i，rchild=2i+1，parent=⌊i/2⌋；n 结点高度 ⌈log₂(n+1)⌉ 或 ⌊log₂n⌋+1。",
 mix:"⚠️ 从 0 编号则是 2i+1 / 2i+2 / ⌊(i−1)/2⌋——408/王道习惯 1 起，826/邓书用 0 起，做题先看编号起点。这套秩对应是「堆能塞进数组」的根基。",
 mem:"1 起编号：孩子翻倍；0 起编号：翻倍加一。",
 exam:"堆、完全二叉树计算题的底层公式，必须秒写。",src:"826 第5章（0 起版，已转 408 口径）"},
{ch:"tree",name:"二叉树四种遍历",def:"先/中/后序的「序」指根的访问位次（左永远先于右）；层次遍历 = 按层 BFS。",
 mix:"辅助结构别配反：先/中/后序迭代用栈，层次用队列。非递归后序最繁（需记录右子树是否访问过，或「双栈/逆先序」技巧）。遍历时间 O(n)，迭代空间 O(树高)。",
 mem:"「X 序」= 根什么时候被念出来。",
 exam:"给树写序列、给算法问访问顺序，年年见。",src:"826 第5章"},
{ch:"tree",name:"遍历序列重建二叉树",def:"（先序 | 后序 | 层次）任一 + 中序 → 唯一重建；先序 + 后序一般不唯一。",
 mix:"先/后/层序只能「定根」，唯有中序能「分左右」——缺中序时单分支结点的孩子分不清左右。仅当是真二叉树（无单分支）时，先序+后序才唯一。「先序+后序可确定层序」是经典错误命题。",
 mem:"定根靠先/后/层，分左右唯有中序。",
 exam:"重建类选择题高频；826 曾连续三年围绕此点出题。",src:"826 第5章"},
{ch:"tree",name:"遍历序列相等的三条对称结论",def:"先序=中序 ⟺ 每个非叶结点只有右子树（右斜单支）；中序=后序 ⟺ 每个结点无右子树（左斜单支）；先序=后序逆序 ⟺ 每结点至多一个孩子（单支链，高度=结点数）。",
 mix:"记忆锚点：先序 NLR、中序 LNR、后序 LRN，让哪个字母「消失」就得哪条结论——先序=中序要 L 不动（无左则 N R = N R）？反过来想更稳：无右子树时中序 LN、后序 LN 相同。另：先序=后序（相同不是逆序）⟺ 只有根一个结点。这组是 5.3-15/30/31/40（含 2017 真题）的统一考点。",
 mem:"「一前一后要单支，同序反序看左右」——差一个字母就换一条。",
 exam:"给条件反推树形的选择题，2017 直接考「先序=中序求树形」。",src:"王道第5章 5.3"},
{ch:"tree",name:"线索二叉树",def:"利用 n+1 个空链域存遍历前驱/后继，ltag/rtag=1 表示线索、=0 表示孩子。",

 exam:"求某结点线索指向谁的选择题高频。",src:""},
{ch:"tree",name:"Huffman 树与 WPL",def:"反复合并权值最小的两棵树，得 WPL=Σ(权×深度) 最小的二叉树；左0右1 即前缀编码。",
 mix:"Huffman 树没有度 1 结点（是真二叉树）：n₀ 个叶共 2n₀−1 个结点、合并 n₀−1 次。快捷验算：WPL = 所有非叶结点权值之和。形态可能不唯一（等权时），但 WPL 唯一。",

{ch:"tree",name:"树·森林 ↔ 二叉树",def:"孩子兄弟表示法（左孩子、右兄弟）把任意树/森林一一对应到二叉树。",

{ch:"tree",name:"并查集",def:"用双亲表示法存的森林，支持 Union（并根）与 Find（找根）；路径压缩 + 按秩/规模合并后近乎 O(α(n))。",

/* ===== 渲染 ===== */
const panel=document.getElementById('panel');
const vg=document.getElementById('vgrid');
const isMobile=()=>window.innerWidth<=900;
let curFilter='all', curIdx=-1;

function showCard(i){
  const d=K[i]; curIdx=i;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.toggle('active', +e.dataset.i===i));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>
  <div class="wcard">
    <div class="head"><span class="w">${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
    <div class="row r-def"><b>一句话定义</b>${d.def}</div>
    <div class="row r-conf"><b>易混辨析（408 命脉）</b>${d.mix}</div>
    <div class="row r-mem"><b>怎么记</b>${d.mem}</div>
    <div class="row r-exam"><b>408 考法</b>${d.exam}</div>
    ${d.src?`<div class="r-src">📦 提炼自：${d.src}</div>`:''}
    <div class="r-link">🔗 真题出处：待错题页生成后回链点亮</div>
  </div>`;
  if(isMobile())panel.classList.add('open');
}

function renderGrid(f){
  curFilter=f; vg.innerHTML='';
  K.forEach((d,i)=>{
    if(f!=='all'&&d.ch!==f)return;
    const div=document.createElement('div');div.className='vitem';div.dataset.i=i;
    if(i===curIdx)div.classList.add('active');
    div.innerHTML=`<span class="chip">${CH[d.ch]}</span><div class="w">${d.name}</div><div class="cn">${d.def.length>38?d.def.slice(0,38)+'…':d.def}</div>`;
    div.addEventListener('click',()=>{showCard(i);if(!isMobile())window.scrollTo({top:0,behavior:'smooth'})});
    vg.appendChild(div);
  });
}

const fdiv=document.getElementById('filters');
const counts={};K.forEach(d=>counts[d.ch]=(counts[d.ch]||0)+1);
const fs=[['all','全部 '+K.length]].concat(Object.keys(CH).map(k=>[k,CH[k]+' '+counts[k]]));
fs.forEach(([k,label],j)=>{
  const b=document.createElement('button');b.className='fbtn'+(j===0?' on':'');
  b.innerHTML=label.replace(/ (\d+)$/,' <span class="cnt">$1</span>');
  b.addEventListener('click',()=>{document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderGrid(k)});
  fdiv.appendChild(b);
});
function quiz(){
  const pool=K.map((d,i)=>[d,i]).filter(([d])=>curFilter==='all'||d.ch===curFilter);
  const [d,i]=pool[Math.floor(Math.random()*pool.length)];
  curIdx=-1;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.remove('active'));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>
  <div class="wcard"><div class="head"><span class="w">🎲 ${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
  <div class="hint" style="padding:20px 6px;color:var(--muted);font-size:.85rem;text-align:center">先在心里说出<b>定义</b>和<b>易混点</b>……</div>
  <button class="reveal" onclick="showCard(${i})">想好了，看答案</button>
  <button class="reveal" style="background:none;border-color:var(--line);color:var(--muted)" onclick="quiz()">换一张</button></div>`;
  if(isMobile())panel.classList.add('open');
}
const qb=document.createElement('button');qb.className='quizbtn';qb.textContent='🎲 随机抽卡自测';
qb.addEventListener('click',quiz);fdiv.appendChild(qb);
renderGrid('all');
</script>
</body>
</html>
