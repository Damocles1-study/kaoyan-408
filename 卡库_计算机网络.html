  #panel .close{display:none}
  @media (max-width:900px){

<script>
const CH = {base:"体系结构",phy:"物理层",dll:"数据链路层",net:"网络层",trans:"传输层",app:"应用层"};
const K = [
{ch:"base",name:"OSI 与 TCP/IP 分层",def:"OSI 七层：物理—链路—网络—传输—会话—表示—应用；TCP/IP 四层。数据单元：比特—帧—分组（IP数据报）—报文段。",
 mix:"设备工作层次：集线器/中继器=物理层，交换机/网桥=链路层，路由器=网络层。「交换机根据 IP 转发」是错误选项。OSI 先有模型后有协议，TCP/IP 相反。",
 mem:"「物链网传会表应」七字诀。",
 exam:"设备与层次对应选择题年年见。"},
{ch:"base",name:"时延四件套",def:"发送时延 = 帧长/带宽；传播时延 = 距离/传播速率；处理时延；排队时延。时延带宽积 = 传播时延 × 带宽。",
 mix:"⚠️ 带宽只影响发送时延、距离只影响传播时延——「提高带宽能缩短传播时延」是经典错误。时延带宽积 =「链路能装多少比特」，是滑动窗口计算的地基。",
 mem:"发送是「倒水出壶」，传播是「水流过管」。",
 exam:"计算总时延，几乎年年一题。"},
{ch:"base",name:"电路·报文·分组交换",def:"电路交换先建链独占带宽；报文交换整报存储转发；分组交换分片存储转发、可流水。",
 mix:"k 段链路传 x bit（分成 p 个分组）：分组交换总时延 ≈ x/b + (k−1)×(分组长/b)（忽略传播）。分组交换时延通常最小但有首部开销与乱序问题。电路交换建立后无转发时延。",
 mem:"分组交换 = 车队分小车，过桥能流水。",
 exam:"三种方式时延对比计算，高频。"},

{ch:"phy",name:"奈奎斯特与香农",def:"无噪声：C = 2W·log₂V（W 带宽 Hz，V 码元种类）；有噪声：C = W·log₂(1+S/N)。",
 mix:"S/N 常以分贝给出：dB = 10·lg(S/N)，30dB → S/N=1000。两个公式各算一遍取小者才是实际极限。奈氏的 2W 是码元速率上限，乘 log₂V 才是比特率。",
 mem:"奈氏管码元，香农管噪声。",
 exam:"计算极限速率，几乎必考一题。"},
{ch:"phy",name:"编码与调制",def:"数字基带：NRZ、曼彻斯特（每比特中间跳变，自同步）、差分曼彻斯特（看边界有无跳变）；数字→模拟：ASK/FSK/PSK/QAM。",
 mix:"⚠️ 比特率 = 波特率 × log₂V（V 是一个码元的取值种类数）；曼彻斯特编码 1 比特占 2 个信号周期，波特率 = 2×比特率。QAM-16 一码元载 4 比特。",
 mem:"波特数「个数」，比特数「信息」。",
 exam:"码型识图+速率换算，选择题高频。"},
{ch:"phy",name:"物理层设备",def:"中继器放大再生信号；集线器 = 多口中继器，物理星形、逻辑总线。",
 mix:"集线器不隔离冲突域也不隔离广播域——所有端口共享带宽，同时只能一对通信。中继器两端必须是同一协议网段。「集线器能存储转发」错。",
 mem:"集线器只是个大喇叭。",
 exam:"配合「数冲突域/广播域」考。"},

{ch:"dll",name:"封装成帧与透明传输",def:"帧定界方法：字符计数、字节（字符）填充、比特填充（标志 01111110，数据中连续五个 1 后插 0）、违规编码。",
 mix:"比特填充计算：发送方「见五个 1 插 0」，接收方「见五个 1 删后面的 0」。字符计数法一处出错全部错位。透明传输 = 数据里出现啥都不怕。",
 mem:"五个 1 后必插 0，机械执行别犹豫。",
 exam:"写出插 0 后的发送序列，选择题高频。"},
{ch:"dll",name:"停等协议与信道利用率",def:"发一帧等一帧确认；利用率 = T发 / (T发 + RTT + T确认)。",
 mix:"想达到利用率目标反推窗口大小：W ≥ 1 + RTT×带宽/帧长（即 1+2a）。停等的序号 1 位就够（0/1 交替）。确认帧发送时延常忽略，看题目条件。",
 mem:"路上太久，就得多发几帧填满管道。",
 exam:"利用率/最小窗口计算，年年见。"},
{ch:"dll",name:"GBN vs SR",def:"GBN：发送窗 ≤ 2ⁿ−1、接收窗 = 1、累计确认、出错后全部重发；SR：收发窗都 > 1、逐帧确认、只重传出错帧，窗口 ≤ 2ⁿ⁻¹。",
 mix:"⚠️ 窗口上限背反是重灾区：n 位序号下 GBN 是 2ⁿ−1，SR 是 2ⁿ⁻¹（发送窗+接收窗 ≤ 2ⁿ）。GBN 接收方只按序接收；SR 接收方要能缓存失序帧。",
 mem:"GBN「错一罚十」，SR「精准补刀、窗口减半」。",
 exam:"给序号位数求最大窗口，几乎必考。"},
{ch:"dll",name:"CSMA/CD 与最小帧长",def:"先听后发、边听边发、冲突停发、随机重发；最小帧长 = 2τ × 带宽（争用期 2τ 内必须仍在发送才能检测到冲突）。",
 mix:"10Mbps 以太网争用期 51.2μs、最小帧 64B。距离越长/速率越高，最小帧长要求越大。二进制指数退避从 {0..2^k−1} 选随机数（k=min(重传次数,10)，16 次失败放弃）。",
 mem:"帧太短，撞了都不知道。",
 exam:"最小帧长/最远距离计算，高频。"},
{ch:"dll",name:"CSMA/CA 与无线网",def:"802.11 用碰撞避免：帧间间隔 IFS + 随机退避 + 链路层确认 ACK，可选 RTS/CTS 预约。",
 mix:"无线不能用 CD 的原因：① 发送时自己的信号太强，听不出别人的（无法边发边听）；② 隐蔽站问题。CA 有确认重传（802.11 链路层可靠），以太网 CD 没有 ACK。",
 mem:"无线喊话听不见别人，只能先举手预约。",
 exam:"CD/CA 对比辨析，选择题常客。"},
{ch:"dll",name:"以太网与 MAC 帧",def:"MAC 帧：目的地址6B + 源地址6B + 类型2B + 数据46~1500B + FCS4B；无连接、不可靠（差错帧直接丢弃）。",
 mix:"以太网不重传坏帧，可靠性交给高层（TCP）。类型字段标识上层协议（0x0800 IP，0x0806 ARP）。数据不足 46B 要填充——这就是最小帧 64B 的组成。",
 mem:"以太网只管送到门口，不管签收。",
 exam:"帧结构字段/最小最大帧长选择题。"},
{ch:"dll",name:"交换机与自学习",def:"根据帧的源 MAC 学习端口映射，按目的 MAC 转发；表中没有则向除入口外所有端口泛洪。",
 mix:"⚠️ 冲突域/广播域统计：集线器都不隔离；交换机每个端口一个冲突域、但同属一个广播域；路由器两个都隔离；VLAN 在交换机内隔离广播域。全双工交换机端口无碰撞、不需 CSMA/CD。",
 mem:"看源学地址，看目的做转发。",
 exam:"数冲突域/广播域 + 自学习表演变，几乎必考。"},
{ch:"dll",name:"PPP 协议",def:"点对点链路（拨号/专线）；面向字节，字节填充转义；提供不可靠服务（有 FCS 检错但不纠错不重传）。",
 mix:"PPP 无序号无确认；支持身份认证与多网络层协议。与以太网一样把可靠性交给上层。标志字节 0x7E，转义字节 0x7D。",
 mem:"PPP = 两点之间的老实搬运工。",
 exam:"特性判断选择题中频。"},

{ch:"net",name:"IPv4 数据报格式",def:"首部 20~60B；关键字段：TTL（每经一个路由器减 1，为 0 丢弃并回 ICMP）、协议（6=TCP，17=UDP）、首部检验和（只检首部）。",
 mix:"⚠️ 三个字段三种单位：首部长度以 4B 为单位、总长度以 1B 为单位、片偏移以 8B 为单位——「4、1、8」是分片计算的命门。每经路由器 TTL 减 1 且检验和要重算。",
 mem:"单位口诀「首4总1偏8」。",
 exam:"字段含义+单位换算选择题年年见。"},
{ch:"net",name:"IP 分片计算",def:"数据部分按 MTU 切片，除最后一片外每片数据长必须是 8 的倍数；MF=1 表示后面还有分片，DF=1 禁止分片。",
 mix:"每个分片都带完整 20B 首部：MTU 1500 → 每片数据最多 1480B。片偏移 = 本片数据首字节序号 / 8。分片可在沿途任何路由器发生，但重组只在最终目的主机。",
 mem:"切蛋糕每块都配个盘子（首部）。",
 exam:"求分片数/各片偏移，计算题高频。"},
{ch:"net",name:"IP 地址与 CIDR",def:"无分类编址 a.b.c.d/n，前 n 位网络前缀；子网掩码前 n 位全 1；每个子网可用主机数 = 2^h − 2。",
 mix:"减 2 是去掉主机号全 0（网络地址）和全 1（定向广播地址）。判断两地址是否同网段：分别与掩码按位与后比较。路由器各接口属于不同网段。",
 mem:"掩码就是一把切地址的尺子。",
 exam:"子网划分/可用地址数计算，必考。"},
{ch:"net",name:"路由聚合与最长前缀匹配",def:"聚合：取多个网络的公共前缀合成一条路由；查表时多条匹配取前缀最长（最具体）的一条。",
 mix:"聚合后的超网可能覆盖并不存在的网段（以表项数换精确性）。默认路由 0.0.0.0/0 前缀最短、最后兜底。做题先把地址写成二进制找公共前缀。",
 mem:"越长越具体，越具体越优先。",
 exam:"求聚合地址/选转发接口，大题选择都常考。"},
{ch:"net",name:"特殊 IP 与私有地址",def:"127.0.0.1 环回；私有地址：10/8、172.16/12、192.168/16；255.255.255.255 受限广播；主机号全 1 定向广播。",
 mix:"私有地址不能在公网路由，出门必须 NAT。169.254.x.x 是 DHCP 失败的链路本地地址。受限广播不出路由器。「路由器转发目的为 127.x 的分组」错。",
 mem:"「10、172.16、192.168」三段私房。",
 exam:"判断地址合法性/类型，选择题高频。"},
{ch:"net",name:"NAT",def:"网络地址转换：路由器改写 IP+端口，维护 NAT 表（私网 IP:端口 ↔ 公网 IP:端口）。",
 mix:"NAPT 用端口号区分多台内网主机，一个公网 IP 就够。NAT 修改 IP 首部与传输层端口，检验和都要重算。外网无法主动发起访问内网（表中无映射）。",
 mem:"小区传达室：统一门牌，分机号区分住户。",
 exam:"给 NAT 表填转换结果，考过大题。"},
{ch:"net",name:"ARP",def:"由 IP 地址解析 MAC 地址：同网段广播请求、单播应答，结果存 ARP 缓存。",
 mix:"⚠️ 目的主机在其他网段时，ARP 解析到的是默认网关的 MAC。ARP 报文直接封装在以太帧中（类型 0x0806），不封装在 IP 里。ARP 表项有寿命，会过期重查。",
 mem:"出小区先问门卫（网关）的脸。",
 exam:"「主机 A 发给跨网段主机 B，ARP 查谁」几乎必考。"},
{ch:"net",name:"IP 与 MAC 沿途变化",def:"无 NAT 时：源/目的 IP 全程不变；MAC 地址每经过一个路由器换一对（当前链路的发送口与接收口）。",
 mix:"路由器转发时改 MAC、TTL 减 1、重算首部检验和，但不改源目的 IP。交换机什么都不改。抓包题给某链路上的帧，四个地址要能全部写对。",
 mem:"IP 是收件人，MAC 是每一程的快递员。",
 exam:"大题选择都爱考的「填地址表」。"},
{ch:"net",name:"DHCP 与 ICMP",def:"DHCP：UDP 67/68，发现→提供→请求→确认四步，首程全程广播；ICMP：IP 层差错报告（不可达/超时/参数错/重定向）与询问（回送）。",
 mix:"DHCP 客户端初始无 IP，源地址用 0.0.0.0。ping 用 ICMP 回送请求/回答；traceroute 利用 TTL 递增触发超时报文。对 ICMP 差错报文不再产生差错报文。ICMP 封装在 IP 数据报内。",
 mem:"DHCP 领身份证，ICMP 送病危通知。",

{ch:"net",name:"RIP",def:"距离向量协议：以跳数为度量，最大 15 跳，16 = 不可达；每 30s 与相邻路由器交换整张路由表；封装在 UDP（端口 520）。",

{ch:"net",name:"BGP",def:"自治系统（AS）之间的路径向量协议：交换「可达网络 + 完整 AS 路径」，基于策略选路；用 TCP（端口 179）。",

{ch:"net",name:"IPv6",def:"128 位地址，冒号十六进制记法（:: 双冒号只能出现一次）；基本首部 40B 定长；取消首部检验和；路由器不分片（源端处理）。",

{ch:"trans",name:"TCP 报文段首部",def:"序号 = 本段第一个数据字节的编号；确认号 = 期望收到的下一个字节编号；SYN 与 FIN 各消耗一个序号。",

{ch:"trans",name:"三次握手",def:"SYN(seq=x) → SYN+ACK(seq=y, ack=x+1) → ACK(seq=x+1, ack=y+1)；同步双方初始序号。",

{ch:"trans",name:"四次挥手与 TIME_WAIT",def:"FIN → ACK → FIN → ACK；主动关闭方最后进入 TIME_WAIT，等 2MSL 再彻底关闭。",

{ch:"trans",name:"TCP 重传机制",def:"超时重传：RTO 由加权平均 RTT 自适应估算；快重传：连续收到 3 个冗余 ACK 立即重传，不等超时。",
 mix:"RTO 应略大于 RTT。Karn 算法：重传报文段的 RTT 样本不参与估算（分不清确认的是哪次）。快重传是「接收方每收失序段就重发当前 ACK」触发的。",

{ch:"trans",name:"流量控制 vs 拥塞控制",def:"流量控制：端到端问题，接收方用 rwnd 限制发送方，防淹没接收方；拥塞控制：全局问题，用 cwnd 防压垮网络。发送窗口 = min(rwnd, cwnd)。",
 mix:"⚠️ 408 级易混命门：一个管「对方受不了」、一个管「路上受不了」。rwnd 由接收方通告，cwnd 由发送方根据网络状况自己维护。零窗口后发送方启动坚持定时器发 1 字节探测报文，防互等死锁。",
 mem:"流控看对方脸色，拥控看马路堵不堵。",
 exam:"辨析 + min 取值计算，必考。"},
{ch:"trans",name:"拥塞控制四算法",def:"慢开始：cwnd 从 1 MSS 起每 RTT 翻倍；到 ssthresh 转拥塞避免（每 RTT +1）；超时：ssthresh=cwnd/2、cwnd=1 重新慢开始；3 冗余 ACK：快重传 + 快恢复（ssthresh=cwnd/2、cwnd=ssthresh 起线性增）。",
 mix:"⚠️「慢开始不慢」——指数增长，名慢实快，「慢」指起点低。超时与快重传的处理不同是计算题核心：一个回到 1，一个减半继续。画 cwnd 折线图必须能徒手复现。",
 mem:"「指数爬坡、线性巡航；超时归零、三催减半」。",
 exam:"算第 n 个 RTT 的 cwnd / 画曲线，几乎年年考。"},

{ch:"app",name:"DNS",def:"层次域名系统：本地域名服务器 → 根 → 顶级 → 权限；递归查询（替你问到底）vs 迭代查询（只告诉你下一家）；UDP 53。",
 mix:"主机对本地服务器通常递归，本地服务器对外通常迭代。算「最少/最多查询次数」：缓存命中最少 0 次网外查询。区分域名解析顺序与投递顺序。",

 exam:"双连接/端口辨析选择题高频。"},

 mix:"⚠️ 链路别配反：发件人→发送服务器与服务器之间都是 SMTP；只有收件人取信那一段才是 POP3/IMAP。SMTP 只传 ASCII，非文本靠 MIME 编码扩展。",

 mix:"计算题套路：非持久每对象约 2 个 RTT（TCP 握手 1 + 请求响应 1）；持久+流水线取回 n 个对象可近 1 个 RTT。无状态靠 Cookie 弥补。HTTP 本身可靠性来自 TCP。",

{ch:"app",name:"从输入 URL 到页面显示",def:"（可选 DHCP 获取配置）→ DNS 解析域名 → ARP 求网关 MAC → TCP 三次握手 → HTTP 请求响应 → 渲染。",
 mix:"综合大题模板：每一步说清「哪层、什么协议、单播还是广播」。DNS 之前可能先查本机缓存/hosts；对象分布在多服务器时要多次 DNS+TCP。",

/* ===== 渲染（与其余卡库同模板） ===== */
const panel=document.getElementById('panel');
const vg=document.getElementById('vgrid');
const isMobile=()=>window.innerWidth<=900;
let curFilter='all', curIdx=-1;

function cardHTML(d){
  return `<div class="wcard">
    <div class="head"><span class="w">${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
    <div class="row r-def"><b>一句话定义</b>${d.def}</div>
    <div class="row r-conf"><b>易混辨析（408 命脉）</b>${d.mix}</div>
    <div class="row r-mem"><b>怎么记</b>${d.mem}</div>
    <div class="row r-exam"><b>408 考法</b>${d.exam}</div>
    ${d.src?`<div class="r-src">📦 提炼自：${d.src}</div>`:''}
    <div class="r-link">🔗 真题出处：待错题页生成后回链点亮</div>
  </div>`;
}
function showCard(i){
  const d=K[i]; curIdx=i;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.toggle('active', +e.dataset.i===i));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>`+cardHTML(d);
  if(isMobile())panel.classList.add('open');
}
function quiz(){
  const pool=K.map((d,i)=>[d,i]).filter(([d])=>curFilter==='all'||d.ch===curFilter);
  const [d,i]=pool[Math.floor(Math.random()*pool.length)];
  curIdx=-1;
  document.querySelectorAll('.vitem').forEach(e=>e.classList.remove('active'));
  panel.innerHTML=`<button class="close" onclick="panel.classList.remove('open')">✕</button>
  <div class="wcard"><div class="head"><span class="w">🎲 ${d.name}</span><span class="pos">${CH[d.ch]}</span></div>
  <div class="hint" style="padding:20px 6px;color:var(--muted);font-size:.85rem;text-align:center">先在心里说出<b>定义</b>和<b>易混点</b>……</div>
  <button class="reveal" onclick="showCard(${i})">想好了，看答案</button>
  <button class="reveal" style="background:none;border-color:var(--line);color:var(--muted)" onclick="quiz()">换一张</button></div>`;
  if(isMobile())panel.classList.add('open');
}
function renderGrid(f){
  curFilter=f; vg.innerHTML='';
  K.forEach((d,i)=>{
    if(f!=='all'&&d.ch!==f)return;
    const div=document.createElement('div');div.className='vitem';div.dataset.i=i;
    if(i===curIdx)div.classList.add('active');
    div.innerHTML=`<span class="chip">${CH[d.ch]}</span><div class="w">${d.name}</div><div class="cn">${d.def.length>38?d.def.slice(0,38)+'…':d.def}</div>`;
    div.addEventListener('click',()=>{showCard(i);if(!isMobile())window.scrollTo({top:0,behavior:'smooth'})});
    vg.appendChild(div);
  });
}
const fdiv=document.getElementById('filters');
const counts={};K.forEach(d=>counts[d.ch]=(counts[d.ch]||0)+1);
const fs=[['all','全部 '+K.length]].concat(Object.keys(CH).map(k=>[k,CH[k]+' '+counts[k]]));
fs.forEach(([k,label],j)=>{
  const b=document.createElement('button');b.className='fbtn'+(j===0?' on':'');
  b.innerHTML=label.replace(/ (\d+)$/,' <span class="cnt">$1</span>');
  b.addEventListener('click',()=>{document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderGrid(k)});
  fdiv.appendChild(b);
});
const qb=document.createElement('button');qb.className='quizbtn';qb.textContent='🎲 随机抽卡自测';
qb.addEventListener('click',quiz);fdiv.appendChild(qb);
renderGrid('all');
</script>
</body>
